name: ARC3 certified frontier
on:
  push:
    branches: [arc3-certified-frontier-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-certified-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-certified-frontier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
      - name: Build standalone candidate and notebook
        run: |
          mkdir -p kaggle/certified-frontier-results
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py kaggle/scripts/certified_frontier_audit.py
          cp kaggle/agent/my_agent.py kaggle/certified-frontier-results/candidate.py
          python kaggle/scripts/build_notebook.py
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 8c84ed5f8fef13d80cf63eef34971646af8e10d4
          path: prior-worktree
      - name: Rebuild exact MG-ARC8 prior
        run: |
          python prior-worktree/kaggle/scripts/build_agent.py --output "$PWD/kaggle/certified-frontier-results/prior.py"
          echo '6700b43bf5316b882c044a8f4f98e085ccdc0bbdb979053e6a6c6da4f75dea6a  kaggle/certified-frontier-results/prior.py' | sha256sum --check
      - name: Install pinned SDK
        run: python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Freeze identical worlds
        run: python kaggle/scripts/certified_frontier_audit.py prepare
      - name: Run candidate, exact MG-ARC8 prior and no-frontier ablation
        run: python kaggle/scripts/certified_frontier_audit.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-certified-frontier
          path: |
            kaggle/certified-frontier-results/
            kaggle/agent/my_agent.py
            kaggle/notebooks/submission.ipynb
            kaggle/src/
            kaggle/scripts/
            kaggle/tests/
            kaggle/provenance/
