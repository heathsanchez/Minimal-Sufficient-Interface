name: ARC3 Consequential Experiment Quotient V1
on:
  push:
    branches: [arc3-consequential-experiment-quotient-v1, arc3-protected-future-kernel-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/mathgraph
          ref: 2efa47b2efc27434ed24dbf6ad6e1f50e463f947
          path: global-source
      - name: Preserve exact source snapshot for reproducibility
        run: |
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          roots=['kaggle/src','kaggle/tests','kaggle/scripts','kaggle/provenance']
          with ZipFile('out/source-snapshot.zip','w',ZIP_DEFLATED) as z:
              for root in roots:
                  for p in Path(root).rglob('*'):
                      if p.is_file(): z.write(p,str(p))
              for name in ['crystal.py','protected_future.py']:
                  p=Path('global-source/mathgraph')/name
                  z.write(p,str(p))
          PY
      - name: Run all ARC integration contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
      - name: Reproduce pinned global semantic waist
        run: python kaggle/scripts/vendor_continuation_core.py --source global-source --check
      - name: Independent exhaustive-policy rank and action audit
        run: python kaggle/scripts/audit_continuation_ranks.py --output out/independent-policy-audit.json
      - name: Independent prospective goal-relative transport audit
        run: python kaggle/scripts/audit_goal_relative_transport.py --output out/independent-goal-relative-transport-audit.json
      - name: Build actual offline agent and notebook
        run: |
          python kaggle/scripts/build_agent.py
          python kaggle/scripts/build_notebook.py
          python -m py_compile kaggle/agent/my_agent.py
      - name: Run frozen learner on finite acquisition-reuse stream
        run: python kaggle/scripts/qualify_developmental_controller.py --output out/finite-stream.json
      - name: Decisive developmental composition gate
        run: python kaggle/scripts/qualify_developmental_composition.py out/developmental-composition.json
      - name: Install pinned public ARC runtime
        run: python -m pip install arc-agi==0.9.9 python-dotenv
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Matched official test-environment acquisition and replay
        run: |
          python kaggle/scripts/qualify_developmental_controller.py --environments upstream-arc-agi/test_environment_files --output out/public-environments.json
      - name: Actual framework adapter regression
        run: |
          python kaggle/scripts/play_local.py --offline-environments-dir upstream-arc-agi/test_environment_files --game bt33-a7c3f9d18b4e --max-steps 32 | tee out/framework-bt33.log
          grep -q 'MAX_LEVELS_REACHED=3' out/framework-bt33.log
      - name: Freeze accessible public catalogue then compare whole agents on every game
        timeout-minutes: 18
        run: |
          timeout 16m python kaggle/scripts/qualify_developmental_controller.py --public-catalog --environments public-environments --output out/public-catalog.json
      - name: Genesis minimum applicability bindings from progress and near-miss lineage
        run: python kaggle/scripts/compile_causal_world_bank.py --input out/public-catalog.json --output out/causal-law-product-bank.json
      - name: Prospective leave-one-game-out applicability-genesis replay
        timeout-minutes: 18
        run: |
          timeout 16m python kaggle/scripts/qualify_developmental_controller.py --public-catalog --causal-bank out/causal-law-product-bank.json --environments public-environments --output out/public-catalog-causal.json
      - name: Consequential experiment quotient constitution gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('out/public-catalog.json'))
          rows=p['results']
          candidate=[life for r in rows for life in r['arms']['candidate']]
          sources={}
          for life in candidate:
              for k,v in life['sources'].items(): sources[k]=sources.get(k,0)+v
          genesis=sources.get('crystal_genesis',0)
          # This branch's constitutional claim: ordinary probe exhaustion must
          # not silently authorize expansion. Public play has no independent
          # obstruction certificate yet, so genesis must be absent.
          assert genesis == 0, sources
          assert not p['observed_regression'], p
          report={
            'schema':'arc3.consequential-experiment-quotient@1',
            'games':len(rows),
            'candidate_sources':sources,
            'genesis_actions':genesis,
            'probe_uses':p['probe_uses'],
            'live_crystal_uses':p['live_crystal_uses'],
            'observed_improvement':p['observed_improvement'],
            'observed_regression':p['observed_regression'],
            'claim':'probe exhaustion remained UNKNOWN; no uncertified EXPAND'
          }
          Path('out/consequential-experiment-quotient.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Consequential promotion gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('out/public-catalog-causal.json'))
          assert not p['observed_regression'], p
          assert p['release_qualified'], p
          by={r['game_id']:r for r in p['results']}
          assert by['ar25-0c556536']['arms']['candidate'][0]['levels'] >= 2
          assert by['ft09-0d8bbf25']['arms']['candidate'][0]['levels'] >= 3
          print('APPLICABILITY_GENESIS_PROBE_USES',p['probe_uses'])
          print('APPLICABILITY_GENESIS_LIVE_CRYSTAL_USES',p['live_crystal_uses'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-goal-relative-transport-v1
          path: |
            out/
            kaggle/agent/my_agent.py
            kaggle/notebooks/submission.ipynb
            kaggle/provenance/sources.json
          if-no-files-found: error
