name: Executable Lean Tight Loop Probe

on:
  push:
    branches: [experiment/executable-lean-tight-loop]
    paths:
      - "lean/ExecutableTightLoopProbe.lean"
      - "lean/ExecutableTightLoopPromotion.lean"
      - ".github/workflows/executable-tight-loop-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build minimal dependency chain
        env:
          LEAN_PATH: lean
        run: |
          lean -o lean/ConstitutionalFailedFactorization.olean lean/ConstitutionalFailedFactorization.lean
          lean -o lean/ConstitutionalRealizationAndRecursion.olean lean/ConstitutionalRealizationAndRecursion.lean
          lean -o lean/GenuinePolicyReflexivity.olean lean/GenuinePolicyReflexivity.lean
      - name: Execute probe
        env:
          LEAN_PATH: lean
        run: lean lean/ExecutableTightLoopProbe.lean
      - name: Kernel-check promoted invariant
        env:
          LEAN_PATH: lean
        run: lean lean/ExecutableTightLoopPromotion.lean

  mathgraph-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Create identical micro-theorem source
        run: |
          cat > /tmp/LoopProbe.lean <<'EOF'
          import Std
          namespace LoopProbe
          theorem forced_new_separator
              {Obj Obs : Type} (p q : Obj) (B0 B1 : (Obj → Obs) → Prop)
              (hcollapse : ∀ b, B0 b → b p = b q)
              (hresolve : ∃ b, B1 b ∧ b p ≠ b q) :
              ∃ b, B1 b ∧ ¬ B0 b ∧ b p ≠ b q := by
            rcases hresolve with ⟨b, hB1, hsep⟩
            exact ⟨b, hB1, (fun hB0 => hsep (hcollapse b hB0)), hsep⟩
          end LoopProbe
          EOF
      - name: Benchmark ordinary Lean steady-state
        run: |
          lean /tmp/LoopProbe.lean >/dev/null
          python3 - <<'PY'
          import subprocess,time,statistics,json
          xs=[]
          for _ in range(30):
              t=time.perf_counter(); subprocess.run(['lean','/tmp/LoopProbe.lean'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); xs.append(time.perf_counter()-t)
          print('LEAN_SECONDS', json.dumps({'n':len(xs),'median':statistics.median(xs),'mean':statistics.mean(xs),'min':min(xs),'max':max(xs)}))
          PY
      - name: Install arena dependencies
        run: |
          rustup component add llvm-tools-preview
          PROFDATA="$(find "$(rustc --print sysroot)" -type f -name llvm-profdata | head -1)"
          test -x "$PROFDATA"
          sudo ln -sf "$PROFDATA" /usr/local/bin/llvm-profdata
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git /tmp/arena
          cp /tmp/LoopProbe.lean /tmp/arena/tests/mathgraph-loop-probe.lean
          cat > /tmp/arena/tests/mathgraph-loop-probe.yaml <<'EOF'
          description: Same micro theorem used for the executable Lean loop benchmark.
          leanfile: tests/mathgraph-loop-probe.lean
          outcome: accept
          export-decls:
            - LoopProbe.forced_new_separator
          EOF
      - name: Measure Lean4Export cold and warm cost
        working-directory: /tmp/arena
        run: |
          python3 - <<'PY'
          import subprocess,time
          t=time.perf_counter(); subprocess.run(['uv','run','lka.py','build-test','mathgraph-loop-probe'],check=True); print('EXPORT_COLD_SECONDS',time.perf_counter()-t)
          t=time.perf_counter(); subprocess.run(['uv','run','lka.py','build-test','mathgraph-loop-probe'],check=True); print('EXPORT_WARM_SECONDS',time.perf_counter()-t)
          PY
      - name: Build pinned Arena MathGraph checker
        working-directory: /tmp/arena
        run: |
          python3 - <<'PY'
          import subprocess,time
          t=time.perf_counter(); subprocess.run(['uv','run','lka.py','build-checker','mathgraph'],check=True); print('MATHGRAPH_BUILD_SECONDS',time.perf_counter()-t)
          PY
      - name: Benchmark MathGraph checker directly
        working-directory: /tmp/arena
        run: |
          python3 - <<'PY'
          import subprocess,time,statistics,json,os
          root='/tmp/arena/_build/checkers/mathgraph/src'
          binary=root+'/target/release/sokonanoda'
          config=root+'/config.json'
          inp='/tmp/arena/_build/tests/mathgraph-loop-probe.ndjson'
          assert os.path.exists(binary), binary
          assert os.path.exists(config), config
          assert os.path.exists(inp), inp
          def once():
              with open(inp,'rb') as f:
                  return subprocess.run([binary,config],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
          r=once()
          print('MATHGRAPH_DIRECT_EXIT',r.returncode)
          if r.returncode != 0:
              print(r.stderr.decode('utf-8','replace'))
              raise SystemExit(r.returncode)
          xs=[]
          for _ in range(100):
              t=time.perf_counter(); r=once(); xs.append(time.perf_counter()-t)
              if r.returncode != 0:
                  print(r.stderr.decode('utf-8','replace')); raise SystemExit(r.returncode)
          print('MATHGRAPH_DIRECT_SECONDS', json.dumps({'n':len(xs),'median':statistics.median(xs),'mean':statistics.mean(xs),'min':min(xs),'max':max(xs)}))
          PY
      - name: Profile MathGraph parse check and thread overhead
        working-directory: /tmp/arena
        run: |
          python3 - <<'PY'
          import subprocess,time,statistics,json,os
          root='/tmp/arena/_build/checkers/mathgraph/src'
          binary=root+'/target/release/sokonanoda'
          base_config=root+'/config.json'
          inp='/tmp/arena/_build/tests/mathgraph-loop-probe.ndjson'
          with open(base_config) as f: base=json.load(f)
          def bench(label,cfg,n=200):
              path=f'/tmp/{label}.json'
              with open(path,'w') as f: json.dump(cfg,f)
              def once():
                  with open(inp,'rb') as src:
                      return subprocess.run([binary,path],stdin=src,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              r=once()
              if r.returncode != 0:
                  print(label,'EXIT',r.returncode,r.stderr.decode('utf-8','replace')); raise SystemExit(r.returncode)
              xs=[]
              for _ in range(n):
                  t=time.perf_counter(); r=once(); xs.append(time.perf_counter()-t)
                  if r.returncode != 0: raise SystemExit(r.returncode)
              print(label, json.dumps({'n':n,'median':statistics.median(xs),'mean':statistics.mean(xs),'min':min(xs),'max':max(xs)}))
          for threads in (1,2,4):
              cfg=dict(base); cfg['num_threads']=threads; cfg['parse_only']=False
              bench(f'CHECK_T{threads}',cfg)
          for threads in (1,4):
              cfg=dict(base); cfg['num_threads']=threads; cfg['parse_only']=True
              bench(f'PARSE_T{threads}',cfg)
          PY
