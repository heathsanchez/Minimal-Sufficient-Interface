name: ARC3 probe exploration
on:
  push:
    branches: [experiment/arc3-probe-exploration-v1]
    paths:
      - 'experiments/arc3_consequence/**'
      - 'tests/test_probe_exploration.py'
      - '.github/workflows/arc3-probe-exploration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - name: Test adaptive probe policy and exact ablation
        run: |
          python -m unittest discover -s tests -p test_probe_exploration.py -v
          echo 'PROBE_EXPLORATION_TESTS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Run matched adaptive and ablated controllers on official offline game
        run: |
          python experiments/arc3_consequence/run_probe.py \
            --game bt11-fd9df0622a1a \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --output arc3-probe-exploration.json
          echo 'ARC3_PROBE_EXPLORATION_OFFLINE=COMPLETED'
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-probe-exploration
          path: arc3-probe-exploration.json
