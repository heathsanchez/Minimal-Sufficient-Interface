name: ARC3 grounded interventional V2
on:
  push:
    branches: [arc3-grounded-interventional-v2]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-grounded-interventional-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-grounded-interventional-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  grounded-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quotient contracts
        run: |
          python -m unittest kaggle.tests.test_interventional_quotient -v
          python -m unittest kaggle.tests.test_grounded_interventional_quotient -v
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/grounded-interventional-v2-results
          python kaggle/scripts/build_agent.py --output kaggle/grounded-interventional-v2-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/grounded-interventional-v2-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/grounded_interventional_v2_probe.py
          python -m py_compile kaggle/scripts/operational_quotient_probe.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/grounded-interventional-v2-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ft09 and vc33 worlds
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/grounded-interventional-v2-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ft09,vc33',
              environments_dir='kaggle/grounded-interventional-v2-results/envs',
              manifest='kaggle/grounded-interventional-v2-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Run grounded parameter audit and recursive closure
        run: python -u kaggle/scripts/grounded_interventional_v2_probe.py
      - name: Compile certified quotient into developmental memory
        run: python -u kaggle/scripts/operational_quotient_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-grounded-interventional-v2
          path: |
            kaggle/grounded-interventional-v2-results/
            kaggle/src/metalogic_arc3/grounded_interventional_quotient.py
            kaggle/scripts/grounded_interventional_v2_probe.py
            kaggle/scripts/operational_quotient_probe.py
            kaggle/tests/test_grounded_interventional_quotient.py
          if-no-files-found: warn
