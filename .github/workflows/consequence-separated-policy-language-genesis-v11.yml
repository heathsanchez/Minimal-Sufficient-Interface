name: consequence separated policy language genesis v11
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/consequence_separated_policy_language_genesis_v11.py'
      - '.github/workflows/consequence-separated-policy-language-genesis-v11.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run V11
        run: python experiments/consequence_separated_policy_language_genesis_v11.py
