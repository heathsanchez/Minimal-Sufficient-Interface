name: ARC3 component explore-harvest V4
on:
  push:
    branches: [arc3-component-explore-harvest-v4]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-component-explore-harvest-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-component-explore-harvest-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  explore-harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quotient contracts
        run: python -m unittest kaggle.tests.test_interventional_quotient -v
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/component-explore-harvest-v4-results
          python kaggle/scripts/build_agent.py --output kaggle/component-explore-harvest-v4-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/component-explore-harvest-v4-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/component_explore_harvest_v4.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/component-explore-harvest-v4-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ls20 world
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/component-explore-harvest-v4-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20',
              environments_dir='kaggle/component-explore-harvest-v4-results/envs',
              manifest='kaggle/component-explore-harvest-v4-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Explore rich cone, harvest free certificates, persist exact ledger
        run: python -u kaggle/scripts/component_explore_harvest_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-component-explore-harvest-v4
          path: |
            kaggle/component-explore-harvest-v4-results/
            kaggle/scripts/component_explore_harvest_v4.py
          if-no-files-found: warn
