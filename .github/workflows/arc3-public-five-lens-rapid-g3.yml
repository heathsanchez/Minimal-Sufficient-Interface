name: ARC3 Public Five Lens Rapid G3

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-five-lens-rapid-g3]
    paths:
      - 'experiments/arc3_public_five_lens_rapid_g3.py'
      - '.github/workflows/arc3-public-five-lens-rapid-g3.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Run five-lens discriminator
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-five-lens-rapid-g3
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_five_lens_rapid_g3.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-five-lens-rapid-g3.log"
          grep -E 'ARC3_PUBLIC_FIVE_LENS_RAPID_G3=(PROMOTED|RESIDUAL)' "$GITHUB_WORKSPACE/arc3-public-five-lens-rapid-g3.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-five-lens-rapid-g3/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert d["transport"]["g2_count_match"]
          assert d["transport"]["g3_count_match"]
          assert d["max_g3_actions"]<=60
          assert d["status"] in {"PROMOTED","RESIDUAL"}
          if d["status"]=="PROMOTED":
              assert d["selected"] is not None
              assert all(x["progressed"] for x in d["verification"])
          print("ARC3_PUBLIC_FIVE_LENS_RAPID_G3_SEAL=PASS")
          print("STATUS=",d["status"])
          print("TRANSPORT=",d["transport"])
          print("COVARIANCE=",[(x["action"],x["slot_from"],x["slot_to"],x["source_changed"]) for x in d["covariance"]])
          print("INTERVENTION_UNIQUE=",{
              "initial_after":d["intervention"]["initial_unique_after"],
              "initial_delta":d["intervention"]["initial_unique_delta"],
              "final_after":d["intervention"]["final_unique_after"],
              "final_delta":d["intervention"]["final_unique_delta"],
          })
          print("INTERVENTION_INITIAL=",d["intervention"]["initial_records"])
          print("INTERVENTION_FINAL=",d["intervention"]["final_records"])
          print("TERMINAL=",d["terminal_tested"])
          print("SELECTED=",d["selected"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-five-lens-rapid-g3
          path: |
            evidence/arc3-public-five-lens-rapid-g3/result.json
            arc3-public-five-lens-rapid-g3.log
          if-no-files-found: error
