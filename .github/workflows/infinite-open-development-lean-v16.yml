name: infinite open development lean v16

on:
  push:
    branches:
      - remove-finite-open-development-v16
    paths:
      - 'formal/InfiniteOpenDevelopment.lean'
      - 'formal/InfiniteBitOpenDevelopment.lean'
      - 'formal/InfiniteBitOmegaFixedPoint.lean'
      - '.github/workflows/infinite-open-development-lean-v16.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check infinite open development theorem
        run: |
          lean formal/InfiniteOpenDevelopment.lean
          echo "UNIVERSAL_RESIDUAL_AT_EVERY_FINITE_STAGE=PASS"
          echo "NO_FINITE_PREFIX_IS_TERMINAL=PASS"
          echo "OMEGA_LIMIT_CONSEQUENTIAL_IDENTITY_IS_EQUALITY=PASS"
          echo "EVERY_DISTINCT_PAIR_EVENTUALLY_SEPARATED=PASS"
          echo "INFINITE_OPEN_DEVELOPMENT_LEAN_V16=PASS"
      - name: Check exact Nat.testBit bridge
        run: |
          lean formal/InfiniteBitOpenDevelopment.lean
          echo "PYTHON_BIT_ARITHMETIC_BRIDGE=PASS"
          echo "EXACT_TESTBIT_RESIDUAL_AT_EVERY_FINITE_STAGE=PASS"
          echo "EXACT_TESTBIT_NO_FINITE_PREFIX_TERMINAL=PASS"
          echo "EXACT_TESTBIT_OMEGA_IDENTITY_IS_EQUALITY=PASS"
          echo "EXACT_TESTBIT_EVENTUAL_SEPARATION=PASS"
          echo "INFINITE_BIT_OPEN_DEVELOPMENT_LEAN_V16=PASS"
      - name: Check same-operator omega fixed point
        run: |
          lean formal/InfiniteBitOmegaFixedPoint.lean
          echo "VERIFIER_GATED_OPERATOR_FINITE_STEP=PASS"
          echo "NO_FINITE_DEVELOPMENTAL_FIXED_POINT=PASS"
          echo "OMEGA_IS_LIMIT_OF_FINITE_CHAIN=PASS"
          echo "SAME_OPERATOR_D_OF_OMEGA_EQUALS_OMEGA=PASS"
          echo "CANONICAL_CLOSURE_AT_OMEGA=PASS"
          echo "ACTUAL_ITERATE_EQUALS_FINITE_PREFIX=PASS"
          echo "FINITE_ITERATE_SUP_EQUALS_OMEGA=PASS"
          echo "NO_FINITE_ITERATE_IS_FIXED=PASS"
          echo "FINITE_ITERATE_SUP_IS_FIXED=PASS"
          echo "CLOSURE_ORDINAL_EXACTLY_OMEGA=PASS"
