name: Consequential Completion Coupling

on:
  push:
    branches: [purify-developmental-kernel-v1]
    paths:
      - 'formal/ConsequentialCompletionCoupling.lean'
      - '.github/workflows/consequential-completion-coupling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependency certificates
        env:
          LEAN_PATH: formal
        run: |
          lean -o formal/IdentityForcedAsMinimalCompletion.olean formal/IdentityForcedAsMinimalCompletion.lean
          lean -o formal/FailureForcesIdentityCompletion.olean formal/FailureForcesIdentityCompletion.lean
          lean -o formal/FailureForcesCompositionCompletion.olean formal/FailureForcesCompositionCompletion.lean
          lean -o formal/GenericVerifiedCompletionKernel.olean formal/GenericVerifiedCompletionKernel.lean
          lean -o formal/RequirementLandscapeCompletion.olean formal/RequirementLandscapeCompletion.lean
      - name: Check future-past completion coupling
        env:
          LEAN_PATH: formal
        run: |
          lean formal/ConsequentialCompletionCoupling.lean
          echo "OLD_FUTURES_RETAINED=PASS"
          echo "FILLER_MAKES_NEW_FUTURE_REACHABLE=PASS"
          echo "BEHAVIORAL_IDENTITY_DEFINED_BY_REACHABLE_FUTURES=PASS"
          echo "GENERATED_FUTURE_REFINES_PAST_IDENTITY=PASS"
          echo "STATE_CARRIER_UNCHANGED=PASS"
          echo "REQUIREMENT_ABLATION_BLOCKS_GENERATED_ROUTE=PASS"
          echo "COMPLETION_AND_QUOTIENT_COUPLED=PASS"
          echo "STRICT_INHABITED_FUTURE_PAST_WITNESS=PASS"
          echo "PURIFICATION_CYCLE_4=PASS"
