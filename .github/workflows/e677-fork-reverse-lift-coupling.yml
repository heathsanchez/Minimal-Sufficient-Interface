name: E677 fork reverse-lift coupling

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:

jobs:
  fork-reverse-lift-coupling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frontier contract
        run: python frontier_contract.py
      - name: Route current frontier
        id: route
        run: python frontier_router.py --github-output
      - name: Skip non-applicable route
        if: steps.route.outputs.route != 'SIZE_FREE_FORK_CANONICAL_DCELL'
        run: |
          echo "FORK_COUPLING_SKIPPED_ROUTE=${{ steps.route.outputs.route }}"
          echo "FORK_COUPLING_NOT_APPLICABLE"
      - name: Install Z3
        if: steps.route.outputs.route == 'SIZE_FREE_FORK_CANONICAL_DCELL'
        run: pip install z3-solver
      - name: Compile probe
        if: steps.route.outputs.route == 'SIZE_FREE_FORK_CANONICAL_DCELL'
        run: python -m py_compile e677_fork_reverse_lift_coupling_probe.py
      - name: Run fork reverse-lift coupling probe
        if: steps.route.outputs.route == 'SIZE_FREE_FORK_CANONICAL_DCELL'
        run: python e677_fork_reverse_lift_coupling_probe.py --out artifacts/e677_fork_reverse_lift_coupling_probe.json --timeout-ms 30000
      - name: Qualify transition
        if: steps.route.outputs.route == 'SIZE_FREE_FORK_CANONICAL_DCELL'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/e677_fork_reverse_lift_coupling_probe.json'))
          assert x['finite_domain_claimed'] is False
          assert x['finite_magma_claimed'] is False
          assert x['counterexample_claimed'] is False
          assert x['global_e677_implication_claimed'] is False
          assert x['size_free_theorem_claimed'] is False
          assert x['proposed_transition']['classification'] in {'PROMOTE','PARK','REQUIRE_ATTACHMENT'}
          print('FORK_COUPLING_RESULT='+x['case']['result'])
          print('FORK_COUPLING_NAMED_TERMS='+str(x['case']['named_terms']))
          print('FORK_COUPLING_GROUND_AXIOMS='+str(x['case']['ground_axioms']))
          print('FORK_COUPLING_TRANSITION='+x['proposed_transition']['classification'])
          print('FORK_COUPLING_RESIDUAL='+x['proposed_transition']['residual'])
          print('FORK_COUPLING_FRONTIER_TRANSITION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.route.outputs.route == 'SIZE_FREE_FORK_CANONICAL_DCELL'
        with:
          name: e677-fork-reverse-lift-coupling
          path: artifacts/e677_fork_reverse_lift_coupling_probe.json
