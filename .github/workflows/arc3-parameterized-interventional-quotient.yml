name: ARC3 parameterized interventional quotient diagnostic
on:
  push:
    branches: [arc3-parameterized-interventional-quotient-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-parameterized-interventional-quotient.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-parameterized-iq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quotient contracts
        run: python -m unittest kaggle.tests.test_interventional_quotient -v
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/interventional-quotient-results
          python kaggle/scripts/build_agent.py --output kaggle/interventional-quotient-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/interventional-quotient-results/agent.py' | sha256sum --check
          python -m py_compile             kaggle/src/metalogic_arc3/interventional_quotient.py             kaggle/scripts/interventional_quotient_diagnostic.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/interventional-quotient-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Prepare exact worlds
        run: |
          mkdir -p kaggle/agent
          cp kaggle/interventional-quotient-results/agent.py kaggle/agent/my_agent.py
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.prepare(SimpleNamespace(
              fixtures=True,
              games='bt11',
              environments_dir='upstream-arc-agi/test_environment_files',
              manifest='kaggle/interventional-quotient-results/fixture.json',
              max_actions=128,
          ))
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ft09,ls20,vc33',
              environments_dir='kaggle/interventional-quotient-results/envs',
              manifest='kaggle/interventional-quotient-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Derive exact-action partial quotient
        run: python -u kaggle/scripts/interventional_quotient_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-parameterized-interventional-quotient
          path: |
            kaggle/interventional-quotient-results/
            kaggle/src/metalogic_arc3/interventional_quotient.py
            kaggle/scripts/interventional_quotient_diagnostic.py
            kaggle/tests/test_interventional_quotient.py
          if-no-files-found: warn
