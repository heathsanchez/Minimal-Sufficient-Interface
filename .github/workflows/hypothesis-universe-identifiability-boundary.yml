name: Hypothesis Universe Identifiability Boundary

on:
  push:
    branches:
      - rgrs/residual-ontology-genesis
    paths:
      - 'formal/VerifierOutcomeCannotIdentifyExactHypothesisUniverse.lean'
      - '.github/workflows/hypothesis-universe-identifiability-boundary.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check hypothesis-universe identifiability boundary
        run: |
          export LEAN_PATH=formal
          lean -o formal/VerifierOutcomeCannotIdentifyExactContextGrammar.olean formal/VerifierOutcomeCannotIdentifyExactContextGrammar.lean
          lean -o formal/NewConsequenceSeparatesContextGrammar.olean formal/NewConsequenceSeparatesContextGrammar.lean
          lean -o formal/AmbiguityInducesDecidingContext.olean formal/AmbiguityInducesDecidingContext.lean
          lean -o formal/VersionSpaceInducesDecidingContext.olean formal/VersionSpaceInducesDecidingContext.lean
          lean formal/VerifierOutcomeCannotIdentifyExactHypothesisUniverse.lean
          echo "HYPOTHESIS_UNIVERSES_GENUINELY_DISTINCT=PASS"
          echo "CURRENT_OBSERVABLE_UNIVERSE_IDENTICAL=PASS"
          echo "EXACT_UNIVERSE_RECONSTRUCTION_FROM_CURRENT_CONSEQUENCE_IMPOSSIBLE=PASS"
          echo "OPERATIONAL_IMAGE_NOT_HIDDEN_SYNTAX=PASS"
          echo "NEW_CONSEQUENCE_OR_UNIVERSE_GENESIS_REQUIRED=BOUNDARY"
          echo "HYPOTHESIS_UNIVERSE_IDENTIFIABILITY_BOUNDARY=PASS"
