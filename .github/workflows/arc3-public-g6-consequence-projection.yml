name: ARC3 Public G6 Consequence Projection

on:
  workflow_dispatch:
  push:
    branches: [arc3-consequence-compiler-v1]
    paths:
      - 'kaggle/src/metalogic_arc3/consequence_arc.py'
      - 'kaggle/src/metalogic_arc3/future_arc.py'
      - 'kaggle/tests/test_consequence_arc.py'
      - 'kaggle/tests/test_consequence_training_schema.py'
      - 'kaggle/tests/test_g6_consequence_projection_schema.py'
      - 'experiments/arc3_public_consequence_training.py'
      - 'experiments/arc3_public_g6_consequence_projection.py'
      - '.github/workflows/arc3-public-g6-consequence-projection.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Test consequence compiler
        run: PYTHONPATH=kaggle/src:experiments python -m unittest discover -s kaggle/tests -v
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root = Path(os.environ["ENV_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          arcade = Arcade(operation_mode=OperationMode.NORMAL, environments_dir=str(root))
          env = arcade.make(os.environ["GAME_ID"])
          if env is None:
              raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS", env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Regenerate warranted G3-G5 consequence corpus
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-consequence-training
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_consequence_training.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-consequence-training.log"
          grep 'ARC3_PUBLIC_CONSEQUENCE_TRAINING=PASS' \
            "$GITHUB_WORKSPACE/arc3-public-consequence-training.log"
      - name: Compile and qualify G6 consequence projection
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
          TRAINING_RESULT: ${{ github.workspace }}/evidence/arc3-public-consequence-training/result.json
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-g6-consequence-projection
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_g6_consequence_projection.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-g6-consequence-projection.log"
          grep 'ARC3_PUBLIC_G6_CONSEQUENCE_PROJECTION=' \
            "$GITHUB_WORKSPACE/arc3-public-g6-consequence-projection.log"
      - name: Seal qualification boundary
        env:
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from arc3_public_g6_consequence_projection import validate_g6_result

          training = json.loads(Path(
              "evidence/arc3-public-consequence-training/result.json"
          ).read_text())
          result = json.loads(Path(
              "evidence/arc3-public-g6-consequence-projection/result.json"
          ).read_text())
          assert training["head"] == os.environ["GITHUB_SHA"]
          assert result["adapter_id"] == training["adapter_id"]
          assert result["warrant_id"] == training["warrant_id"]
          validate_g6_result(result, executing_head=os.environ["GITHUB_SHA"])
          assert result["status"] in {"PROMOTED", "REJECTED", "RESIDUAL"}
          print("ARC3_PUBLIC_G6_CONSEQUENCE_PROJECTION_SEAL=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-g6-consequence-projection
          path: |
            evidence/arc3-public-consequence-training/*.json
            evidence/arc3-public-g6-consequence-projection/*.json
            arc3-public-consequence-training.log
            arc3-public-g6-consequence-projection.log
          if-no-files-found: error
