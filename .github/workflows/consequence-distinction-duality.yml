name: Consequence Distinction Duality

on:
  push:
    paths:
      - 'consequence_distinction.py'
      - 'tests/test_consequence_distinction_duality.py'
      - 'lean/ConsequenceDistinctionDuality.lean'
      - 'CONSEQUENCE_DISTINCTION_DUALITY.md'
      - '.github/workflows/consequence-distinction-duality.yml'
  pull_request:
    paths:
      - 'consequence_distinction.py'
      - 'tests/test_consequence_distinction_duality.py'
      - 'lean/ConsequenceDistinctionDuality.lean'
      - 'CONSEQUENCE_DISTINCTION_DUALITY.md'
      - '.github/workflows/consequence-distinction-duality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duality-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run duality oracle tests
        run: python -m unittest -v tests.test_consequence_distinction_duality
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check consequence-distinction duality theorems
        env:
          LEAN_PATH: lean
        run: lean lean/ConsequenceDistinctionDuality.lean
