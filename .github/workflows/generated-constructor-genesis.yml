name: Generated Constructor Genesis
on:
  push:
    paths:
      - 'tests/test_generated_constructor_genesis.py'
      - '.github/workflows/generated-constructor-genesis.yml'
  workflow_dispatch:
jobs:
  genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated constructor genesis
        run: python -m unittest -v tests.test_generated_constructor_genesis
