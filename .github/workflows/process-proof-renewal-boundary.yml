name: Process Proof Renewal Boundary

on:
  push:
    branches: [recursive-discovery-compiler-v2-live-attachment]
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile qualification sources
        run: python -m py_compile developmental_operating_system.py developmental_operating_system_v2.py developmental_process_tournament.py developmental_process_tournament_v2.py renewal_unique_fixer_boundary.py
      - name: Re-run frozen baseline process tournament
        run: python developmental_process_tournament.py
      - name: Run attachment-aware matched process tournament
        run: python developmental_process_tournament_v2.py
      - name: Verify unique-fixer renewal negative boundary
        run: python renewal_unique_fixer_boundary.py | tee renewal_unique_fixer_boundary.log
      - name: Verify promotion markers
        run: |
          grep -q 'DEVELOPMENTAL_PROCESS_TOURNAMENT_PASS' <(python developmental_process_tournament.py)
          grep -q 'ATTACHMENT_PROCESS_TOURNAMENT_PASS' <(python developmental_process_tournament_v2.py)
          grep -q 'RENEWAL_UNIQUE_FIXER_BOUNDARY_VERIFIED' renewal_unique_fixer_boundary.log
          echo PROCESS_AND_OBJECT_BOUNDARY_VERIFIED
