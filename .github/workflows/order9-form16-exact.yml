name: Order9 Form16 Exact

on:
  push:
    branches:
      - recursive-discovery-compiler-v2-live-attachment
    paths:
      - '.github/workflows/order9-form16-exact.yml'
  workflow_dispatch:

jobs:
  form16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen external verifier source
        run: |
          git clone --filter=blob:none https://github.com/Grisha-Pochuev/finite-magma-e677-to-e255.git external
          git -C external checkout 5a205195a84eec54dbcb2fd766f0b2d1ded1831b
          observed=$(git -C external hash-object tools/e677_order9_no_hit_bad_count_sat.py)
          echo "checker-blob=$observed"
          test "$observed" = "efe356acd0047eef8ae5645b2cb04ac2a493632d"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact six-outcome coverage in two engines
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/form16
          checker=external/tools/e677_order9_no_hit_bad_count_sat.py
          common="--min-bad 3 --max-bad 3 --scan-bad3-structural --bad3-case 16"

          python "$checker" $common --bad3-canonical-root-outcomes --solver cadical195 --conflict-budget 1000000 \
            2>&1 | tee artifacts/form16/cadical_canonical.txt
          echo ${PIPESTATUS[0]} > artifacts/form16/cadical_canonical.rc

          python "$checker" $common --bad3-good-product-reps-only --solver cadical195 --conflict-budget 1000000 \
            2>&1 | tee artifacts/form16/cadical_good_reps.txt
          echo ${PIPESTATUS[0]} > artifacts/form16/cadical_good_reps.rc

          python "$checker" $common --bad3-canonical-root-outcomes --solver glucose42 --per-count-seconds 90 \
            2>&1 | tee artifacts/form16/glucose_canonical.txt
          echo ${PIPESTATUS[0]} > artifacts/form16/glucose_canonical.rc

          python "$checker" $common --bad3-good-product-reps-only --solver glucose42 --per-count-seconds 90 \
            2>&1 | tee artifacts/form16/glucose_good_reps.txt
          echo ${PIPESTATUS[0]} > artifacts/form16/glucose_good_reps.rc
          exit 0
      - name: Verify exhaustive representative coverage
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root=Path('artifacts/form16')
          summary={}
          counterexamples=[]
          for engine in ('cadical','glucose'):
              c=(root/f'{engine}_canonical.txt').read_text()
              g=(root/f'{engine}_good_reps.txt').read_text()
              if 'VERIFIED NO-HIT COUNTEREXAMPLE' in c or 'VERIFIED NO-HIT COUNTEREXAMPLE' in g:
                  counterexamples.append(engine)
                  summary[engine]={'counterexample':True}
                  continue
              crows=[line for line in c.splitlines() if 'bad3 case 16/24 split ' in line]
              grows=[line for line in g.splitlines() if 'bad3 case 16/24 split ' in line]
              if len(crows)!=6:
                  raise SystemExit(f'{engine}: expected 6 canonical outcomes, got {len(crows)}')
              if len(grows)!=2:
                  raise SystemExit(f'{engine}: expected 2 Good representatives, got {len(grows)}')
              nongood=[line for line in crows if 'product=row=' in line or 'product=third=' in line]
              if len(nongood)!=4:
                  raise SystemExit(f'{engine}: expected 4 non-Good outcomes, got {len(nongood)}')
              bad_nongood=[line for line in nongood if ': UNSAT;' not in line]
              bad_good=[line for line in grows if ': UNSAT;' not in line]
              summary[engine]={
                  'counterexample':False,
                  'canonical_statuses':crows,
                  'good_rep_statuses':grows,
                  'non_good_all_unsat':not bad_nongood,
                  'good_reps_all_unsat':not bad_good,
              }
              if bad_nongood:
                  raise SystemExit(f'{engine}: unresolved non-Good leaves: {bad_nongood}')
              if bad_good:
                  raise SystemExit(f'{engine}: unresolved Good representatives: {bad_good}')
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          if counterexamples:
              print('FORM16_VERIFIED_COUNTEREXAMPLE_CANDIDATE', counterexamples)
          else:
              print('ORDER9_FORM16_EXACTLY_EXCLUDED_IN_TWO_ENGINES')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: order9-form16-exact
          path: artifacts/form16
