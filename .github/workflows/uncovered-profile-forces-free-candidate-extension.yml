name: Uncovered Profile Forces Free Candidate Extension

on:
  push:
    branches:
      - rgrs/universe-genesis-positive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check free raw candidate extension
        run: |
          export LEAN_PATH=formal
          lean formal/UncoveredProfileForcesFreeCandidateExtension.lean
          echo "REQUIRED_PROFILE_ABSENT_FROM_RAW_CARRIER=PASS"
          echo "FREE_ONE_WITNESS_CARRIER_EXTENSION=PASS"
          echo "OLD_CANDIDATE_BEHAVIOR_PRESERVED=PASS"
          echo "REQUIRED_PROFILE_REALIZED=PASS"
          echo "NO_UNRELATED_BEHAVIOR_PROFILE_ADDED=PASS"
          echo "FREE_EXTENSION_UNIVERSAL=PASS"
          echo "RESIDUAL_ABLATION_LEAVES_GAP_UNREPAIRED=PASS"
          echo "NO_HIDDEN_SYNTAX_RECONSTRUCTED=PASS"
          echo "ONE_POINT_EXTENSION_META_CONSTRUCTOR_AND_CONTEXT_FAMILY_STILL_SUPPLIED=BOUNDARY"
          echo "UNCOVERED_PROFILE_FORCES_FREE_CANDIDATE_EXTENSION=PASS"
