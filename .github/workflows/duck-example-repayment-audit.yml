name: Duck example repayment probe
on:
  workflow_dispatch:
  push:
    branches: [arc3-ducktape-duck-v1]
    paths:
      - '.github/workflows/duck-example-repayment-audit.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Probe bundled benchmark schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("vendor/duck-harness/example-run/benchmark.json")
          data = json.loads(p.read_text())

          def shape(x, depth=0, max_depth=4):
              ind = "  " * depth
              if isinstance(x, dict):
                  print(f"{ind}dict keys={list(x)[:40]}")
                  if depth < max_depth:
                      for k, v in list(x.items())[:12]:
                          print(f"{ind}{k!r}:")
                          shape(v, depth + 1, max_depth)
              elif isinstance(x, list):
                  print(f"{ind}list len={len(x)}")
                  if x and depth < max_depth:
                      print(f"{ind}[0]:")
                      shape(x[0], depth + 1, max_depth)
              else:
                  value = repr(x)
                  print(f"{ind}{type(x).__name__}: {value[:240]}")

          shape(data)
          run = data["game_runs"][0]
          print("\nFIRST_HISTORY_ENTRIES")
          for i, entry in enumerate(run.get("history", [])[:3]):
              print(f"history[{i}]")
              shape(entry, 1, 8)

          print("\nFIRST_VIEWER_EVENTS")
          event_file = sorted(Path("vendor/duck-harness/example-run/artifacts").glob("*_events.jsonl"))[0]
          print("event_file", event_file.name)
          for i, line in enumerate(event_file.open()):
              if i >= 6:
                  break
              event = json.loads(line)
              print(f"event[{i}]")
              shape(event, 1, 6)
          PY

      - name: Audit all 500 bundled Duck runs
        run: |
          python kaggle/audit_public_duck_repayments.py \
            vendor/duck-harness/example-run/artifacts \
            --out duck-repayment-audit.json | tee duck-repayment-audit.log
          grep -q 'DUCK_REPAYMENT_AUDIT=PASS' duck-repayment-audit.log

      - uses: actions/upload-artifact@v4
        with:
          name: duck-repayment-audit
          path: |
            duck-repayment-audit.json
            duck-repayment-audit.log
          if-no-files-found: error
