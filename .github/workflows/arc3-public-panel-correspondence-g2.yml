name: ARC3 Public Panel Correspondence G2

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-panel-correspondence-g2]
    paths:
      - 'experiments/arc3_public_panel_correspondence_g2.py'
      - '.github/workflows/arc3-public-panel-correspondence-g2.yml'
      - 'experiments/arc3_public_all_blue_to_gray_g2.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Test exact left-right panel correspondence
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-panel-correspondence-g2
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_panel_correspondence_g2.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-panel-correspondence-g2.log"
          grep -E 'ARC3_PUBLIC_PANEL_CORRESPONDENCE_G2=(PROMOTED|RESIDUAL)' "$GITHUB_WORKSPACE/arc3-public-panel-correspondence-g2.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-panel-correspondence-g2/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert d["status"] in {"PROMOTED","RESIDUAL"}
          for v in d["variants"]:
              if "remaining_mismatch" in v:
                  assert v["remaining_mismatch"]==0
          if d["status"]=="PROMOTED":
              assert d["selected"] is not None
              assert all(x["progressed"] for x in d["verification"])
          print("ARC3_PUBLIC_PANEL_CORRESPONDENCE_G2_SEAL=PASS")
          print("STATUS=",d["status"])
          print("VARIANTS=",[(v["variant"],len(v["prefix"]),v.get("mismatch_count"),v.get("progressed"),v.get("level"),v.get("state")) for v in d["variants"]])
          print("SELECTED=",d["selected"])
          print("VERIFICATION=",d["verification"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-panel-correspondence-g2
          path: |
            evidence/arc3-public-panel-correspondence-g2/result.json
            arc3-public-panel-correspondence-g2.log
          if-no-files-found: error
