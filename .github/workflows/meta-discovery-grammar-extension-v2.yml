name: meta discovery grammar extension v2
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/meta_discovery_grammar_extension_v2.py'
      - '.github/workflows/meta-discovery-grammar-extension-v2.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exhaustive grammar-extension gate
        run: python experiments/meta_discovery_grammar_extension_v2.py
