name: identity composition consequence calculus

on:
  push:
    branches: [msi/verified-development-theorem-v1]
    paths:
      - 'lean/IdentityCompositionConsequence.lean'
      - '.github/workflows/identity-composition-consequence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile independent developmental calculus
        env:
          LEAN_PATH: lean
        run: |
          set -euxo pipefail
          lean lean/IdentityCompositionConsequence.lean
      - name: Record compression gate
        run: |
          echo 'IDENTITY_FROM_COMPOSITIONAL_CONSEQUENCE=CHECKED'
          echo 'MAXIMAL_CONSEQUENTIAL_UNION=CHECKED'
          echo 'LANGUAGE_EXTENSION_REFINES_IDENTITY=CHECKED'
          echo 'VERIFIED_NEW_CONSEQUENCE_FORCES_SPLIT=CHECKED'
          echo 'LEAST_COMPOSITION_CLOSED_EXTENSION=CHECKED'
          echo 'VERIFIED_COMPOSITIONAL_PORTAL=CHECKED'
          echo 'STATIC_STAGE_FIXED_POINT=CHECKED'
          echo 'COMPRESSION_TARGET=identity + composition + consequence recovers behavioural congruence, separation/union, developmental refinement, and generated-stage minimality'
          echo 'BOUNDARY=resource-indexed reachability, observation genesis, and syntax generation remain outside this minimal calculus'
