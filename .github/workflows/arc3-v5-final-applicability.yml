name: ARC3 V5 Final Applicability Gate
on:
  push:
    branches: [arc3-causal-role-rebinding-v1]
    paths:
      - experiments/arc3_relational_applicability_v5.py
      - experiments/arc3_typed_local_refinement_v4.py
      - experiments/arc3_prospective_role_refinement_v3.py
      - .github/workflows/arc3-v5-final-applicability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned public replay corpus
        run: |
          git clone --quiet https://github.com/Tufalabs/duck-harness.git /tmp/duck
          git -C /tmp/duck checkout --quiet 7652836056c59e044f093e3c13ed7438c814169e
          test -d /tmp/duck/example-run/artifacts
      - name: Run frozen V5 applicability hypothesis
        run: |
          mkdir -p out
          PYTHONPATH=experiments python experiments/arc3_relational_applicability_v5.py \
            --events-dir /tmp/duck/example-run/artifacts \
            --output out/arc3-relational-applicability-v5.json
          test -s out/arc3-relational-applicability-v5.json
          cat out/arc3-relational-applicability-v5.json
      - name: Classify without changing evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/arc3-relational-applicability-v5.json')
          d=json.loads(p.read_text())
          summary={
            'schema':'arc3.v5-final-applicability-gate@1',
            'source_schema':d.get('schema'),
            'heldout_cells':d.get('heldout_cells'),
            'predicted_cells':d.get('predicted_cells'),
            'wrong_predictions':d.get('wrong_predictions'),
            'coverage':d.get('coverage'),
            'source_status':d.get('status'),
            'classification':(
              'ZERO_ERROR_CANDIDATE'
              if d.get('predicted_cells',0)>0 and d.get('wrong_predictions')==0
              else 'EXACT_RESIDUAL'
            ),
          }
          Path('out/v5-gate.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-v5-final-applicability
          path: out/
          if-no-files-found: error
