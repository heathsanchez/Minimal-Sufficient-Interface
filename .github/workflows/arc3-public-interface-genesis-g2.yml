name: ARC3 Public Interface Genesis G2

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-interface-genesis-g2]
    paths:
      - 'experiments/arc3_public_interface_genesis_g2.py'
      - '.github/workflows/arc3-public-interface-genesis-g2.yml'
      - 'experiments/arc3_public_direct_schema_g2.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Synthesize active interface from residual disagreement
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-interface-genesis-g2
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_interface_genesis_g2.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-interface-genesis-g2.log"
          grep -E 'ARC3_PUBLIC_INTERFACE_GENESIS_G2=(SOLVED|SEPARATOR|INTERFACE_CREATED|NO_INTERFACE)' "$GITHUB_WORKSPACE/arc3-public-interface-genesis-g2.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-interface-genesis-g2/result.json").read_text())
          assert d["model_calls"] == 0 and d["source_inspection"] is False
          assert d["candidate_count"] == 36
          assert d["max_live_suffix_actions"] <= 3
          assert d["status"] in {"SOLVED","SEPARATOR","INTERFACE_CREATED","NO_INTERFACE"}
          if d["status"] == "SOLVED":
              assert d["selected"] is not None
              assert all(x["outcome"] == "PROGRESS" for x in d["verification"])
          if d["status"] == "SEPARATOR":
              s=d["separator"]
              assert s is not None
              assert s["left_outcome"] != s["right_outcome"]
          if d["status"] == "INTERFACE_CREATED":
              assert d["chosen_root_probe"] is not None
              assert d["chosen_root_probe"]["partition"]["classes"] > 1
          print("ARC3_PUBLIC_INTERFACE_GENESIS_G2_SEAL=PASS")
          print("STATUS=",d["status"])
          print("BOARD_CLASSES=",d["base_exact_board_classes"])
          print("ROOT_POOL=",d["root_probe_pool"])
          print("CHOSEN_ROOT=",d["chosen_root_probe"])
          print("SECOND_LEVEL=",d["second_level"])
          print("EVALUATIONS=",d["tested_candidate_probe_evaluations"])
          print("SEPARATOR=",d["separator"])
          print("SELECTED=",d["selected"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-interface-genesis-g2
          path: |
            evidence/arc3-public-interface-genesis-g2/result.json
            arc3-public-interface-genesis-g2.log
          if-no-files-found: error
