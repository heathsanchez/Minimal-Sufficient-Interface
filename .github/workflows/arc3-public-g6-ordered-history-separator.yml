name: ARC3 Public G6 Ordered History Separator

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-g6-ordered-history-separator-v1]
    paths:
      - 'experiments/arc3_public_g6_ordered_history_separator.py'
      - 'kaggle/tests/test_g6_ordered_history_separator.py'
      - '.github/workflows/arc3-public-g6-ordered-history-separator.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install exact Duck environment
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Run full regression suite
        run: PYTHONPATH=kaggle/src:experiments python -m unittest discover -s kaggle/tests -v
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode

          root = Path(os.environ["ENV_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          arcade = Arcade(
              operation_mode=OperationMode.NORMAL,
              environments_dir=str(root),
          )
          env = arcade.make(os.environ["GAME_ID"])
          if env is None:
              raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS", env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Run bounded same-endpoint history census
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-g6-ordered-history-separator
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_g6_ordered_history_separator.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-g6-ordered-history-separator.log"
          grep 'ARC3_PUBLIC_G6_ORDERED_HISTORY_SEPARATOR=' \
            "$GITHUB_WORKSPACE/arc3-public-g6-ordered-history-separator.log"
      - name: Seal exact-head zero-write evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from arc3_public_g6_ordered_history_separator import validate_result

          result = json.loads(Path(
              "evidence/arc3-public-g6-ordered-history-separator/result.json"
          ).read_text())
          validate_result(result, executing_head=os.environ["GITHUB_SHA"])
          assert result["status"] in {"RESPONSE_SEPARATOR_ONLY", "REJECTED"}
          assert result["classification"] in {
              "RESPONSE_SEPARATOR_ONLY", "WARRANTED_NEGATIVE"
          }
          assert len(result["trials"]) == 20
          assert len(result["comparisons"]) == 10
          assert result["target_writes"] == 0
          assert result["submit_clicks"] == 0
          print("ARC3_PUBLIC_G6_ORDERED_HISTORY_SEPARATOR_SEAL=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-g6-ordered-history-separator
          path: |
            evidence/arc3-public-g6-ordered-history-separator/result.json
            arc3-public-g6-ordered-history-separator.log
          if-no-files-found: error
