name: Flash Official16 Readiness

on:
  workflow_dispatch:
  push:
    branches: [arc3-official16-v1]
    paths:
      - '.github/workflows/flash-official16-readiness.yml'
      - 'kaggle/ducktape_metatron_patch.py'
      - 'kaggle/flash_ducktape_patch.py'
      - 'kaggle/flash_autonomous_patch.py'

permissions:
  actions: read
  contents: read

jobs:
  game:
    name: ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        game:
          - tn36-ef4dde99
          - lf52-271a04aa
          - cn04-2fe56bfb
          - bp35-0a0ad940
          - wa30-ee6fef47
          - lp85-305b61c3
          - r11l-495a7899
          - tu93-0768757b
          - sp80-589a99af
          - m0r0-492f87ba
          - vc33-5430563c
          - ar25-0c556536
          - ka59-38d34dbb
          - sc25-635fd71a
          - sk48-d8078629
          - dc22-fdcac232

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"
      DUCKTAPE_PROMOTION_POLICY: constitutional
      DUCKTAPE_GAME_ID: ${{ matrix.game }}
      LOCAL_ANALYZER_PROVIDER: openrouter
      LOCAL_ANALYZER_MODEL_ID: openrouter/free
      LOCAL_ANALYZER_MAX_OUTPUT: "4096"
      LOCAL_ANALYZER_CONTEXT_WINDOW: "32768"
      LOCAL_ANALYZER_TEMPERATURE: "0"
      LOCAL_ANALYZER_TOP_P: "1"
      LOCAL_ANALYZER_TOOL_OUTPUT_TOKENS: "1024"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness

      - name: Apply minimal Flash stack
        run: |
          python kaggle/ducktape_metatron_patch.py --root vendor/duck-harness/ARC3-Inference
          python kaggle/flash_ducktape_patch.py --root vendor/duck-harness/ARC3-Inference
          python kaggle/flash_autonomous_patch.py --root vendor/duck-harness/ARC3-Inference
          echo "FLASH_OFFICIAL16_PATCH=PASS"

      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"

      - name: Download exact public game from ARC API
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: ${{ matrix.game }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode

          env_dir = Path(os.environ["ENV_DIR"])
          env_dir.mkdir(parents=True, exist_ok=True)
          arcade = Arcade(
              operation_mode=OperationMode.NORMAL,
              environments_dir=str(env_dir),
          )
          game_id = os.environ["GAME_ID"]
          env = arcade.make(game_id)
          if env is None:
              raise SystemExit(f"could not download/make {game_id}")
          info = env.environment_info
          print("OFFICIAL_GAME_DOWNLOAD=PASS")
          print("GAME_ID=", info.game_id)
          print("LOCAL_DIR=", info.local_dir)
          print("BASELINES=", info.baseline_actions)
          arcade.close_scorecard()
          PY

      - name: Run frozen Flash policy
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVIRONMENTS_DIR: ${{ github.workspace }}/public-env
        run: |
          rm -rf "$GITHUB_WORKSPACE/out"
          CONFIG_PATH=configs/inference.openrouter.json \
          EXPERIMENT_DIR="$GITHUB_WORKSPACE/out" \
          ENVIRONMENTS_DIR="$GITHUB_WORKSPACE/public-env" \
          GAME=${{ matrix.game }} \
          N_PASSES=1 \
          CONCURRENT_JOBS=1 \
          MAX_ACTIONS=400 \
          MAX_RUNTIME_MINUTES=15 \
          MODEL=openrouter/free \
          LOCAL_ANALYZER_MODEL_ID=openrouter/free \
          RUN_NAME="flash-official16-${{ matrix.game }}" \
          make interactive | tee "$GITHUB_WORKSPACE/run.log"

          SCORE_RUN_DIR="$GITHUB_WORKSPACE/out" make score_run \
            | tee "$GITHUB_WORKSPACE/score.log"

      - name: Seal result
        if: always()
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          game = "${{ matrix.game }}"
          result = {
              "game": game,
              "score": None,
              "levels": None,
              "total_levels": None,
              "state": None,
              "actions": None,
              "reported_tokens": None,
              "won": False,
              "events": {},
              "technical_error": None,
          }

          evaluation = Path("out/evaluation.json")
          if evaluation.exists():
              d = json.loads(evaluation.read_text())
              if d.get("games"):
                  g = d["games"][0]
                  result["score"] = float(d["score"])
                  result["levels"] = float(g["levels_completed_mean"])
                  result["total_levels"] = int(g["total_levels"])

          benchmark = Path("out/benchmark.json")
          if benchmark.exists():
              d = json.loads(benchmark.read_text())
              runs = d.get("game_runs") or []
              if runs:
                  r = runs[0]
                  result["state"] = r.get("state")
                  result["actions"] = len(r.get("history") or [])
                  note = str(r.get("solver_note") or "")
                  m = re.search(r"tokens=(\d+)", note)
                  result["reported_tokens"] = int(m.group(1)) if m else None
                  if note.startswith("error:"):
                      result["technical_error"] = note

          counts = {}
          for lp in Path("out").rglob("ducktape-metatron.jsonl"):
              for line in lp.read_text().splitlines():
                  if line.strip():
                      kind = str(json.loads(line).get("kind"))
                      counts[kind] = counts.get(kind, 0) + 1
          result["events"] = counts
          result["won"] = bool(
              result["total_levels"] is not None
              and result["levels"] == result["total_levels"]
          )

          p = Path(f"result-{game}.json")
          p.write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          print("FLASH_OFFICIAL16_GAME=COMPLETE")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official16-${{ matrix.game }}
          path: |
            result-${{ matrix.game }}.json
            run.log
            score.log
            out/evaluation.json
            out/benchmark.json
            out/**/ducktape-metatron.jsonl
          if-no-files-found: warn

  summarize:
    name: summarize Official16 readiness
    needs: game
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: official16-*
          path: evidence
          merge-multiple: false

      - name: Aggregate
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path

          rows = [
              json.loads(p.read_text())
              for p in sorted(Path("evidence").rglob("result-*.json"))
          ]
          if not rows:
              raise SystemExit("no Official16 results")

          scores = [r["score"] for r in rows if r["score"] is not None]
          level_fracs = [
              r["levels"] / r["total_levels"]
              for r in rows
              if r["levels"] is not None and r["total_levels"]
          ]
          tokens = [r["reported_tokens"] for r in rows if r["reported_tokens"] is not None]
          actions = [r["actions"] for r in rows if r["actions"] is not None]

          summary = {
              "frozen_game_count": 16,
              "result_count": len(rows),
              "wins": sum(bool(r.get("won")) for r in rows),
              "mean_score": statistics.mean(scores) if scores else None,
              "median_score": statistics.median(scores) if scores else None,
              "mean_level_fraction": statistics.mean(level_fracs) if level_fracs else None,
              "mean_actions": statistics.mean(actions) if actions else None,
              "mean_tokens": statistics.mean(tokens) if tokens else None,
              "zero_model_games": sum((r.get("reported_tokens") or 0) == 0 for r in rows),
              "zero_model_wins": sum(
                  bool(r.get("won")) and (r.get("reported_tokens") or 0) == 0
                  for r in rows
              ),
              "technical_errors": [
                  {"game": r["game"], "error": r["technical_error"]}
                  for r in rows if r.get("technical_error")
              ],
              "model_queries": sum(r["events"].get("MODEL_QUERY", 0) for r in rows),
              "probe_compiles": sum(r["events"].get("PROBE_COMPILE", 0) for r in rows),
              "qualified_capabilities": sum(r["events"].get("CAPABILITY", 0) for r in rows),
              "flash_executes": sum(r["events"].get("FLASH_EXECUTE", 0) for r in rows),
              "flash_reclosures": sum(r["events"].get("FLASH_RECLOSE", 0) for r in rows),
              "revocations": sum(r["events"].get("REVOKE", 0) for r in rows),
              "per_game": rows,
              "claim_boundary": (
                  "one frozen pass over the first 16 official public ARC-AGI-3 games; "
                  "not a Kaggle leaderboard submission"
              ),
          }

          Path("flash-official16-readiness-summary.json").write_text(
              json.dumps(summary, indent=2)
          )
          print(json.dumps(summary, indent=2))
          print("FLASH_OFFICIAL16_READINESS=COMPLETE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: flash-official16-readiness-summary
          path: |
            flash-official16-readiness-summary.json
            evidence
          if-no-files-found: error
