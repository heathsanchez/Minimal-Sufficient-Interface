name: literal cross domain inheritance v2
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/literal_cross_domain_inheritance_v2.py'
      - '.github/workflows/literal-cross-domain-inheritance-v2.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run literal cross-domain inheritance gate
        run: python experiments/literal_cross_domain_inheritance_v2.py
