name: Consequential Core

on:
  push:
    branches: [main]
    paths:
      - 'consequential_core.py'
      - 'consequential_certification.py'
      - 'consequential_version_space.py'
      - 'CONSEQUENTIAL_CORE_CONTRACTS.md'
      - 'tests/test_difference_test.py'
      - 'tests/test_difference_parametric_family.py'
      - 'tests/test_consequential_core_contracts.py'
      - 'tests/test_consequential_single_chain.py'
      - '.github/workflows/consequential-core.yml'
  workflow_dispatch:

jobs:
  consequential-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consequential core gates
        run: |
          python -m unittest -v \
            tests.test_difference_test \
            tests.test_difference_parametric_family \
            tests.test_consequential_core_contracts \
            tests.test_consequential_single_chain
