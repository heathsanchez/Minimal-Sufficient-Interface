name: ARC3 ft09 fatal-chain escape
on:
  push:
    branches: [arc3-ft09-fatal-chain-escape-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-ft09-fatal-chain-escape.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arc3-ft09-fatal-chain-escape-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fatal-chain-escape:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/ft09-fatal-chain-escape-results
          python kaggle/scripts/build_agent.py --output kaggle/ft09-fatal-chain-escape-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/ft09-fatal-chain-escape-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/ft09_fatal_chain_escape.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/ft09-fatal-chain-escape-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ft09 world
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/ft09-fatal-chain-escape-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ft09',
              environments_dir='kaggle/ft09-fatal-chain-escape-results/envs',
              manifest='kaggle/ft09-fatal-chain-escape-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Download and verify final exact ft09 bank
        run: |
          gh api /repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10560344965/zip > /tmp/bank.zip
          echo '9a7d4a52f25a006abc15f76e8f4cb3e99fbfdcdb9eb9618f3cbb27c252d31c7d  /tmp/bank.zip' | sha256sum --check
          mkdir -p /tmp/bank
          unzip -q /tmp/bank.zip -d /tmp/bank
          cp /tmp/bank/ft09-dynamic-bank-performance-results/dynamic-exact-effect-bank.json kaggle/ft09-fatal-chain-escape-results/dynamic-exact-effect-bank.json
      - name: Download and verify 54,54 fatal-chain evidence
        run: |
          gh api /repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10561833386/zip > /tmp/progression.zip
          echo 'e129247178e039de8dfcf1d7b33e21cc37abf304f5bf59cfeba0bab64d72d818  /tmp/progression.zip' | sha256sum --check
          mkdir -p /tmp/progression
          unzip -q /tmp/progression.zip -d /tmp/progression
          cp /tmp/progression/ft09-5454-progression-results/ft09-5454-progression.json kaggle/ft09-fatal-chain-escape-results/ft09-5454-progression.json
      - name: Search one-deviation escapes from fatal chain
        run: python -u kaggle/scripts/ft09_fatal_chain_escape.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-ft09-fatal-chain-escape
          path: |
            kaggle/ft09-fatal-chain-escape-results/
            kaggle/scripts/ft09_fatal_chain_escape.py
          if-no-files-found: warn
