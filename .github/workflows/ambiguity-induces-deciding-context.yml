name: Ambiguity Induces Deciding Context

on:
  push:
    branches: [rgrs/residual-ontology-genesis]
    paths:
      - 'formal/VerifierOutcomeCannotIdentifyExactContextGrammar.lean'
      - 'formal/NewConsequenceSeparatesContextGrammar.lean'
      - 'formal/AmbiguityInducesDecidingContext.lean'
      - '.github/workflows/ambiguity-induces-deciding-context.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check ambiguity-induced deciding context
        run: |
          export LEAN_PATH=formal
          lean -o formal/VerifierOutcomeCannotIdentifyExactContextGrammar.olean formal/VerifierOutcomeCannotIdentifyExactContextGrammar.lean
          lean -o formal/NewConsequenceSeparatesContextGrammar.olean formal/NewConsequenceSeparatesContextGrammar.lean
          lean formal/AmbiguityInducesDecidingContext.lean
          echo "CURRENT_CONTEXT_EXCLUDED_FROM_DECIDING_TYPE=PASS"
          echo "DECIDING_CONTEXT_TYPE_INDUCED_BY_CONSEQUENCE=PASS"
          echo "NO_CONTEXT_CANDIDATE_POOL_SUPPLIED=PASS"
          echo "UNIQUE_NEXT_CONTEXT_FORCED_IN_WITNESS=PASS"
          echo "INDUCED_CONTEXT_REFINES_CONSEQUENCE_EQUIVALENCE=PASS"
          echo "RAW_STATE_CARRIER_AND_GRAMMAR_PAIR_STILL_SUPPLIED=BOUNDARY"
          echo "AMBIGUITY_INDUCES_NEXT_DECIDING_CONTEXT=PASS"
