name: ARC3 terminal confirmation
on:
  push:
    branches: [experiment/arc3-consequence-search-v1]
    paths:
      - 'experiments/arc3_consequence/terminal_confirmation.py'
      - 'experiments/arc3_consequence/run_terminal_confirmation.py'
      - 'tests/test_terminal_confirmation.py'
      - '.github/workflows/arc3-terminal-confirmation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install arc-agi==0.9.9
      - name: Test terminal verifier and existing development
        run: |
          python -m unittest discover -s tests -p test_terminal_confirmation.py -v
          python -m unittest discover -s tests -p test_consequence_search.py -v
          python -m unittest discover -s tests -p test_consequence_quotient.py -v
          python -m unittest discover -s tests -p test_compositional_development.py -v
          python -m unittest discover -s tests -p test_multi_level_development.py -v
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Retrieve exact witnessed evidence
        uses: actions/download-artifact@v4
        with:
          name: arc3-consequence-search
          run-id: 34192005884
          github-token: ${{ github.token }}
          path: source-evidence
      - name: Confirm terminal consequence
        run: |
          python experiments/arc3_consequence/run_terminal_confirmation.py \
            --game bt33-a7c3f9d18b4e \
            --evidence source-evidence/arc3-consequence-search-bt33.json \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-training-actions 3000 \
            --max-episodes 128 --max-depth 4 \
            --output arc3-terminal-confirmation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-terminal-confirmation
          path: arc3-terminal-confirmation.json
          if-no-files-found: warn
