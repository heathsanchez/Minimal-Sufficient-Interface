name: ARC3 Public Future Separator Equal Snapshots G3

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-future-separator-equal-snapshots-g3]
    paths:
      - 'experiments/arc3_public_future_separator_equal_snapshots_g3.py'
      - '.github/workflows/arc3-public-future-separator-equal-snapshots-g3.yml'
      - 'experiments/arc3_public_compiled_state_trace_g3.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Search continuation separators between exact-equal snapshots
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-future-separator-equal-snapshots-g3
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_future_separator_equal_snapshots_g3.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-future-separator-equal-snapshots-g3.log"
          grep -E 'ARC3_PUBLIC_FUTURE_SEPARATOR_EQUAL_SNAPSHOTS_G3=(PROTECTED_SEPARATOR|RESPONSE_SEPARATOR_ONLY|NO_SEPARATOR)' "$GITHUB_WORKSPACE/arc3-public-future-separator-equal-snapshots-g3.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-future-separator-equal-snapshots-g3/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert all(x["exact_equal"] for x in d["equal_snapshot_pairs"])
          assert d["alphabet_size"]==41
          assert d["max_suffix_depth"]==2
          assert d["max_g3_live_actions"]<=60
          assert d["status"] in {"PROTECTED_SEPARATOR","RESPONSE_SEPARATOR_ONLY","NO_SEPARATOR"}
          if d["status"]=="PROTECTED_SEPARATOR":
              s=d["protected_separator"]
              assert s is not None and s["left_outcome"]!=s["right_outcome"]
              assert all(x["left"]!=x["right"] for x in s["verification"])
          print("ARC3_PUBLIC_FUTURE_SEPARATOR_EQUAL_SNAPSHOTS_G3_SEAL=PASS")
          print("STATUS=",d["status"])
          print("EQUAL_PAIRS=",d["equal_snapshot_pairs"])
          print("ALPHABET_SIZE=",d["alphabet_size"])
          print("TESTED_SUFFIX_COUNTS=",d["tested_suffix_counts"])
          print("EVALUATIONS=",d["candidate_evaluations"])
          print("PROTECTED_SEPARATOR=",d["protected_separator"])
          print("FIRST_RESPONSE_SEPARATOR=",d["first_response_separator"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-future-separator-equal-snapshots-g3
          path: |
            evidence/arc3-public-future-separator-equal-snapshots-g3/result.json
            arc3-public-future-separator-equal-snapshots-g3.log
          if-no-files-found: error
