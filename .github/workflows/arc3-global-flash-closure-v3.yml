name: ARC3 Global Flash Closure V3
on:
  push:
    branches: [arc3-global-flash-closure-v3]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-global-flash-closure-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-global-flash-closure-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flash-closure-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify frozen MG-ARC5
        run: |
          mkdir -p kaggle/global-flash-closure-results
          python kaggle/scripts/build_agent.py --output kaggle/global-flash-closure-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/global-flash-closure-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/global_flash_closure_v3.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/global-flash-closure-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact public three-game bundle
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/global-flash-closure-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20,ft09,vc33',
              environments_dir='kaggle/global-flash-closure-results/envs',
              manifest='kaggle/global-flash-closure-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Run obstruction-compiled Flash V3 comparison
        run: python -u kaggle/scripts/global_flash_closure_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-global-flash-closure-v3
          path: |
            kaggle/global-flash-closure-results/
            kaggle/scripts/global_flash_closure_v3.py
          if-no-files-found: warn

