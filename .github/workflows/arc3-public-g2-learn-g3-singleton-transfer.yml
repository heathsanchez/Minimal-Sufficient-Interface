name: ARC3 Public G2 Learn G3 Singleton Transfer

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-g2-learn-g3-singleton-transfer]
    paths:
      - 'experiments/arc3_public_g2_learn_g3_singleton_transfer.py'
      - '.github/workflows/arc3-public-g2-learn-g3-singleton-transfer.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Learn G2 causal semantics and transfer to G3
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-g2-learn-g3-singleton-transfer
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_g2_learn_g3_singleton_transfer.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-g2-learn-g3-singleton-transfer.log"
          grep -E 'ARC3_PUBLIC_G2_LEARN_G3_SINGLETON_TRANSFER=(PROMOTED|RESIDUAL)' "$GITHUB_WORKSPACE/arc3-public-g2-learn-g3-singleton-transfer.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-g2-learn-g3-singleton-transfer/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert len(d["g2"]["objects"])==4
          assert len(d["g2"]["surviving_masks"])>=1
          assert d["max_g3_actions"]<=60
          assert d["status"] in {"PROMOTED","RESIDUAL"}
          if d["status"]=="PROMOTED":
              assert d["selected"] is not None
              assert all(x["progressed"] for x in d["verification"])
          print("ARC3_PUBLIC_G2_LEARN_G3_SINGLETON_TRANSFER_SEAL=PASS")
          print("STATUS=",d["status"])
          print("G2_OBJECTS=",d["g2"]["objects"])
          print("G2_INTERVENTIONS=",d["g2"]["interventions"])
          print("SURVIVING_MASKS=",d["g2"]["surviving_masks"])
          print("TESTED=",d["tested_variants"])
          print("SELECTED=",d["selected"])
          print("PROGRESS=",[(x["prefix_len"],x["mask"],x["truth_00_01_10_11"],x["permutation"],x["write_count"]) for x in d["tested"] if x["progressed"]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-g2-learn-g3-singleton-transfer
          path: |
            evidence/arc3-public-g2-learn-g3-singleton-transfer/result.json
            arc3-public-g2-learn-g3-singleton-transfer.log
          if-no-files-found: error
