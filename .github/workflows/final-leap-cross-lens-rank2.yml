name: Final Leap Cross-Lens Rank2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  final-leap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rank-2 cross-lens genesis, intervention, and ablation
        run: python -m unittest tests.test_final_leap_cross_lens_rank2_world -v
