name: Bundy induction V3 calibration Lean check
on:
  push:
    branches: [bundy-critic-induction-genesis-v3]
    paths:
      - 'experiments/bundy_critic_induction_v3/**'
      - '.github/workflows/bundy-critic-induction-v3-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.24.0"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-derived finite discriminator and protected freeze
        run: |
          set -euo pipefail
          python -m experiments.bundy_critic_induction_v3.run > /tmp/v3-result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v3-result.json'))
          assert d['status']=='CANDIDATE_FINITE_DISCRIMINATOR',d
          assert d['orientation']=='right',d
          assert d['protected_proofs_attempted']==0
          assert d['claims']['automatic_induction_critic']=='UNKNOWN'
          print(json.dumps(d,indent=2))
          PY
      - name: Kernel-check calibration invariant and negative orientation
        env:
          LEAN_PATH: experiments/bundy_critic_induction_v3
        run: |
          set -euo pipefail
          lean --version
          lean -o experiments/bundy_critic_induction_v3/FrozenSource.olean experiments/bundy_critic_induction_v3/FrozenSource.lean
          lean experiments/bundy_critic_induction_v3/CalibrationObligations.lean
          lean experiments/bundy_critic_induction_v3/ProtectedReferenceObligations.lean
