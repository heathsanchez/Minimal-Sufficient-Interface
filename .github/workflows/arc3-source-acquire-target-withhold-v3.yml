name: ARC3 source acquire target withhold V3
on:
  push:
    branches: [arc3-source-acquire-target-withhold-v3]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Run ARC contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v

      - name: Build exact offline deliverables
        run: |
          mkdir -p out
          python kaggle/scripts/build_agent.py
          python kaggle/scripts/build_notebook.py
          python -m py_compile kaggle/agent/my_agent.py

      - name: Install pinned public ARC runtime
        run: python -m pip install arc-agi==0.9.9 python-dotenv

      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents

      - run: python kaggle/scripts/slim_framework.py

      - name: Freeze only the declared public development games
        run: |
          python - <<'PY'
          from arc_agi import Arcade, OperationMode
          from pathlib import Path
          games=(
            "ar25-0c556536","ft09-0d8bbf25",
            "re86-8af5384d","vc33-5430563c",
          )
          root=Path("public-environments")
          root.mkdir(exist_ok=True)
          arc=Arcade(operation_mode=OperationMode.NORMAL,
                     environments_dir=str(root.resolve()))
          for game in games:
              env=arc.make(game)
              if env is None:
                  raise SystemExit(f"missing {game}")
              print("SOURCE_TARGET_GAME_READY",game,flush=True)
          arc.close_scorecard()
          PY

      - name: Run source-acquire target-withhold transfer gate
        run: |
          python kaggle/scripts/qualify_relative_transfer_holdout.py \
            --environments public-environments \
            --output out/source-target-withhold.json

      - name: Classify transfer boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("out/source-target-withhold.json")
          d=json.loads(p.read_text())
          summary={
            "schema":"arc3.source-target-transfer-gate@1",
            "promotion_candidate":d["promotion_candidate"],
            "relative_target_uses":d["relative_target_uses"],
            "relative_progress":d["relative_progress"],
            "relative_extension_progress":d["relative_extension_progress"],
            "gains":d["gains"],
            "regressions":d["regressions"],
          }
          summary["classification"]=(
            "PROMOTION_CANDIDATE" if summary["promotion_candidate"] else
            "EXACT_RESIDUAL" if summary["relative_target_uses"] else
            "NO_APPLICABLE_TRANSFER"
          )
          Path("out/source-target-gate.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-source-acquire-target-withhold-v3
          path: |
            out/
            kaggle/agent/my_agent.py
            kaggle/notebooks/submission.ipynb
          if-no-files-found: error
