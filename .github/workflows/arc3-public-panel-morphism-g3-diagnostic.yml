name: ARC3 Public Panel Morphism G3 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-panel-morphism-g3-diagnostic]
    paths:
      - 'experiments/arc3_public_panel_morphism_g3_diagnostic.py'
      - '.github/workflows/arc3-public-panel-morphism-g3-diagnostic.yml'
      - 'experiments/arc3_public_panel_correspondence_g3.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Read G3 panel words
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-panel-morphism-g3-diagnostic
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_panel_morphism_g3_diagnostic.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-panel-morphism-g3-diagnostic.log"
          grep -E 'ARC3_PUBLIC_PANEL_MORPHISM_G3_DIAGNOSTIC=PASS' "$GITHUB_WORKSPACE/arc3-public-panel-morphism-g3-diagnostic.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-panel-morphism-g3-diagnostic/result.json").read_text())
          assert d["status"]=="PASS"
          assert d["model_calls"]==0 and d["source_inspection"] is False
          print("ARC3_PUBLIC_PANEL_MORPHISM_G3_DIAGNOSTIC_SEAL=PASS")
          for v in d["variants"]:
              print("PREFIX",len(v["prefix"]),"LEFT",v["left"],"RIGHT",v["right"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-panel-morphism-g3-diagnostic
          path: |
            evidence/arc3-public-panel-morphism-g3-diagnostic/result.json
            arc3-public-panel-morphism-g3-diagnostic.log
          if-no-files-found: error
