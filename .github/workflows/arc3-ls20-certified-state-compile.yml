name: ARC3 ls20 certified state compile
on:
  push:
    branches: [arc3-ls20-certified-state-compile-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-ls20-certified-state-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-ls20-certified-state-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quotient contracts
        run: python -m unittest kaggle.tests.test_interventional_quotient -v
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/ls20-certified-state-compile-results
          python kaggle/scripts/build_agent.py --output kaggle/ls20-certified-state-compile-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/ls20-certified-state-compile-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/ls20_certified_state_compile.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/ls20-certified-state-compile-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ls20 world
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/ls20-certified-state-compile-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20',
              environments_dir='kaggle/ls20-certified-state-compile-results/envs',
              manifest='kaggle/ls20-certified-state-compile-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Reproduce certificates and compile exact classes
        run: python -u kaggle/scripts/ls20_certified_state_compile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-ls20-certified-state-compile
          path: |
            kaggle/ls20-certified-state-compile-results/
            kaggle/scripts/ls20_certified_state_compile.py
          if-no-files-found: warn
