name: verified consequence genesis formal

on:
  push:
    branches:
      - settlement-frozen-controller-final-boss
    paths:
      - 'formal/*.lean'
      - 'lean/*.lean'
      - '.github/workflows/verified-consequence-genesis-formal.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build unified theorem dependencies
        env:
          LEAN_PATH: lean:formal
        run: |
          lean -o lean/Kernel.olean lean/Kernel.lean
          lean -o lean/MinimalRepair.olean lean/MinimalRepair.lean
          lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
          lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
          lean -o lean/GeneratedStage.olean lean/GeneratedStage.lean
          lean -o formal/VerifiedConsequenceGenesis.olean formal/VerifiedConsequenceGenesis.lean
          lean -o formal/UnifiedDevelopmentalLaw.olean formal/UnifiedDevelopmentalLaw.lean
          lean -o formal/BoundedDevelopmentalCapability.olean formal/BoundedDevelopmentalCapability.lean
          lean -o formal/MultiCandidateDevelopmentalSearch.olean formal/MultiCandidateDevelopmentalSearch.lean
          lean -o formal/GeneratedCandidateDevelopmentalSearch.olean formal/GeneratedCandidateDevelopmentalSearch.lean
          lean -o formal/ConsequenceSelectedDevelopmentalDiscovery.olean formal/ConsequenceSelectedDevelopmentalDiscovery.lean
      - name: Check formal laws
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/VerifiedConsequenceGenesis.lean
          echo "CONSEQUENTIAL_IDENTITY_COARSEST=PASS"
          echo "GOLDEN_REFINEMENT=PASS"
          echo "SEPARATOR_CERTIFICATE=PASS"
          echo "FACTORIZATION_IMPLIES_FIBER_CONSTANCY=PASS"
          echo "CANONICAL_REFINEMENT_UNIVERSAL_PROPERTY=PASS"
          echo "LEAST_SUFFICIENT_REFINEMENT=PASS"
          echo "VERIFIED_CONSEQUENCE_GENESIS_FORMAL=PASS"
      - name: Check unified developmental law
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/UnifiedDevelopmentalLaw.lean
          echo "FACTORIZATION_REPAIR_EQUALS_MEET_REFINEMENT=PASS"
          echo "LEAST_GENERATED_STAGE_EXTENSION=PASS"
          echo "FULL_VERIFIED_DEVELOPMENTAL_CYCLE=PASS"
          echo "UNIFIED_DEVELOPMENTAL_LAW=PASS"
      - name: Check bounded developmental capability
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/BoundedDevelopmentalCapability.lean
          echo "PROMOTION_CHANGES_BOUNDED_CONTROLLER_RESULT=PASS"
          echo "COLD_ABLATION_RETURNS_FAILURE=PASS"
      - name: Check multi-candidate developmental search
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/MultiCandidateDevelopmentalSearch.lean
          echo "FROZEN_MULTICANDIDATE_SEARCH=PASS"
          echo "PROMOTION_CHANGES_MULTICANDIDATE_RESULT=PASS"
      - name: Check grammar-generated developmental search
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/GeneratedCandidateDevelopmentalSearch.lean
          echo "WINNING_DESCENDANT_NOT_SUPPLIED=PASS"
          echo "GRAMMAR_GENERATION_CHANGES_BOUNDED_CAPABILITY=PASS"
      - name: Check consequence-selected developmental discovery
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/ConsequenceSelectedDevelopmentalDiscovery.lean
          echo "ANONYMOUS_PRIMITIVE_POOL=PASS"
          echo "SEPARATOR_SELECTED_FROM_ACTUAL_CONSEQUENCE=PASS"
          echo "NO_WINNING_PRIMITIVE_IDENTITY_SUPPLIED=PASS"
          echo "FULL_CONSEQUENCE_SELECTED_DEVELOPMENTAL_DISCOVERY=PASS"
      - name: Check generic consequential selection closure
        env:
          LEAN_PATH: lean:formal
        run: |
          lean formal/ConsequentialSelectionClosure.lean
          echo "ARBITRARY_FINITE_POOL_SELECTION_SOUND=PASS"
          echo "SELECTED_PRIMITIVE_IS_POOL_MEMBER=PASS"
          echo "SELECTED_PRIMITIVE_ACTUALLY_SEPARATES=PASS"
          echo "NO_SEPARATOR_IFF_ALL_POOL_PRIMITIVES_SILENT=PASS"
          echo "SELECTED_PROMOTION_IDENTITY_IS_ENDOGENOUS=PASS"
          echo "ABSENT_CONSEQUENTIAL_SEPARATION_NO_PROMOTION=PASS"
          echo "POSITIVE_AND_NEGATIVE_DEVELOPMENTAL_LAWS_CLOSED=PASS"
