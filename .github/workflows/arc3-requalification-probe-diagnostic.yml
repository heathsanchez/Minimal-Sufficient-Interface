name: ARC3 requalification probe diagnostic
on:
  push:
    branches: [arc3-certified-requalification-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-requalification-probe-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate
        run: |
          mkdir -p kaggle/requalification-results
          python kaggle/scripts/build_agent.py
          cp kaggle/agent/my_agent.py kaggle/requalification-results/candidate.py
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 42dec1f23e243f9f3e288f57fc73833cde6c3c69
          path: prior-worktree
      - name: Rebuild exact MG-ARC4 prior
        run: |
          python prior-worktree/kaggle/scripts/build_agent.py --output "$PWD/kaggle/requalification-results/prior.py"
          echo '1d9a3d9c130ee049e6428b6c87b80186756dead840086a6b68d7357960009000  kaggle/requalification-results/prior.py' | sha256sum --check
      - name: Install pinned ARC SDK
        run: python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Prepare frozen worlds
        run: python kaggle/scripts/requalification_audit.py prepare
      - name: Run targeted mismatch witness
        run: python kaggle/scripts/requalification_probe_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-requalification-probe-diagnostic
          path: kaggle/requalification-results/probe-diagnostic.json
