name: Failure Generated Consequence Genesis

on:
  push:
    paths:
      - 'lean/FailureGeneratedConsequenceGenesis.lean'
      - '.github/workflows/failure-generated-consequence-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check failure-generated consequence genesis theorem
        env:
          LEAN_PATH: lean
        run: |
          lean lean/FailureGeneratedConsequenceGenesis.lean
          echo "FAILURE_OBJECT_CONTAINS_NO_PROBE_IDENTITY=PASS"
          echo "VERIFIED_FAILURE_GENERATES_SEPARATOR=PASS"
          echo "SAME_FROZEN_GENERATOR_IS_FAILURE_SENSITIVE=PASS"
          echo "VERIFICATION_ABLATION_BLOCKS_UNIVERSAL_NEGATIVE_INFERENCE=PASS"
          echo "FAILURE_GENERATED_CONSEQUENCE_GENESIS=PASS"
