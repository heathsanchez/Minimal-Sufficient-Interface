name: ARC3 restart development
on:
  push:
    branches: [experiment/arc3-probe-exploration-v1]
    paths:
      - 'experiments/arc3_consequence/restart_development.py'
      - 'experiments/arc3_consequence/run_restart.py'
      - 'tests/test_restart_development.py'
      - '.github/workflows/arc3-restart-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - name: Test restart development
        run: |
          python -m unittest discover -s tests -p test_restart_development.py -v
          echo 'RESTART_DEVELOPMENT_TESTS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Run bounded learning and fresh-start ablation
        run: |
          python experiments/arc3_consequence/run_restart.py \
            --game bt11-fd9df0622a1a \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-episodes 512 --max-depth 8 \
            --output arc3-restart-development.json
          echo 'ARC3_RESTART_DEVELOPMENT_OFFLINE=COMPLETED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-restart-development
          path: arc3-restart-development.json
          if-no-files-found: warn
