name: source distinct 100x boss v1
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/source_distinct_100x_boss_v1.py'
      - '.github/workflows/source-distinct-100x-boss-v1.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run source-distinct boss
        run: python experiments/source_distinct_100x_boss_v1.py
