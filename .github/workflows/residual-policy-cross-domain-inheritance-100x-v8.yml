name: residual policy cross domain inheritance 100x v8

on:
  workflow_dispatch:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/residual_policy_cross_domain_inheritance_100x_v8.py'
      - '.github/workflows/residual-policy-cross-domain-inheritance-100x-v8.yml'

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Decide V8
        run: python experiments/residual_policy_cross_domain_inheritance_100x_v8.py
