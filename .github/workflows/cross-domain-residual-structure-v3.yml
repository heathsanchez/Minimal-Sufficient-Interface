name: cross domain residual structure v3
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/cross_domain_residual_structure_v3.py'
      - '.github/workflows/cross-domain-residual-structure-v3.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run residual-structure transfer gate
        run: python experiments/cross_domain_residual_structure_v3.py
