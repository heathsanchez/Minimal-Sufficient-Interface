name: ARC3 Public Port Role Decoder G3

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-port-future-separator-g3]
    paths:
      - 'experiments/arc3_public_port_role_decoder_g3.py'
      - 'tests/test_arc3_public_port_role_decoder_g3.py'
      - '.github/workflows/arc3-public-port-role-decoder-g3.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Unit-test transported port role
        working-directory: vendor/duck-harness/ARC3-Inference
        run: >-
          uv run --with pytest pytest -q
          "$GITHUB_WORKSPACE/tests/test_arc3_public_port_role_decoder_g3.py"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Test color-11-relative port-role decoder
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-port-role-decoder-g3
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_port_role_decoder_g3.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-port-role-decoder-g3.log"
          grep -E 'ARC3_PUBLIC_PORT_ROLE_DECODER_G3=(PROMOTED|RESIDUAL)' \
            "$GITHUB_WORKSPACE/arc3-public-port-role-decoder-g3.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-port-role-decoder-g3/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert d["g2"]["new_mixed_pairs_near_far"]==[[12,14],[14,12]]
          assert d["tested_variants"]<=48
          assert d["max_g3_actions"]<=60
          assert d["status"] in {"PROMOTED","RESIDUAL"}
          if d["status"]=="PROMOTED":
              assert d["selected"] is not None
              assert all(x["progressed"] for x in d["verification"])
          print("ARC3_PUBLIC_PORT_ROLE_DECODER_G3_SEAL=PASS")
          print("STATUS=",d["status"])
          print("G2_SURVIVORS=",d["g2"]["surviving_mask_pairs_near_far"])
          print("TESTED=",d["tested_variants"])
          print("SELECTED=",d["selected"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-port-role-decoder-g3
          path: |
            evidence/arc3-public-port-role-decoder-g3/result.json
            arc3-public-port-role-decoder-g3.log
          if-no-files-found: error
