name: ARC3 Public G6 Hierarchical Program Lift

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-g6-hierarchical-program-lift-v1]
    paths:
      - 'experiments/arc3_public_g6_hierarchical_program_lift.py'
      - 'kaggle/tests/test_g6_hierarchical_program_lift.py'
      - '.github/workflows/arc3-public-g6-hierarchical-program-lift.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install exact Duck environment
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Run full regression suite
        run: PYTHONPATH=kaggle/src:experiments python -m unittest discover -s kaggle/tests -v
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode

          root = Path(os.environ["ENV_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          arcade = Arcade(operation_mode=OperationMode.NORMAL, environments_dir=str(root))
          env = arcade.make(os.environ["GAME_ID"])
          if env is None:
              raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS", env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Run hierarchical program lift gate
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-g6-hierarchical-program-lift
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_g6_hierarchical_program_lift.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-g6-hierarchical-program-lift.log"
          grep 'ARC3_PUBLIC_G6_HIERARCHICAL_PROGRAM_LIFT=' \
            "$GITHUB_WORKSPACE/arc3-public-g6-hierarchical-program-lift.log"
      - name: Seal exact-head evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from arc3_public_g6_hierarchical_program_lift import validate_result

          result = json.loads(Path(
              "evidence/arc3-public-g6-hierarchical-program-lift/result.json"
          ).read_text())
          validate_result(result, executing_head=os.environ["GITHUB_SHA"])
          assert result["classification"] != "NON_EVIDENCE"
          if result["status"] == "PROMOTED":
              assert len(result["verification"]) == 2
          elif result["status"] == "REJECTED":
              assert result["verification"] == []
          else:
              assert result["status"] == "RESIDUAL"
              assert result["target_writes"] == 0
          print("HIERARCHICAL_PROGRAM_LIFT_SEAL=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-g6-hierarchical-program-lift
          path: |
            evidence/arc3-public-g6-hierarchical-program-lift/result.json
            arc3-public-g6-hierarchical-program-lift.log
          if-no-files-found: error
