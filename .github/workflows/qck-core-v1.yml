name: QCK Core v1

on:
  push:
    branches: [qck-core-v1]
    paths:
      - 'qcklean/**'
      - 'docs/superpowers/specs/2026-09-18-qck-core-v1-design.md'
      - 'docs/superpowers/plans/2026-09-18-qck-core-v1.md'
      - 'QCK_CORE_V1.md'
      - '.github/workflows/qck-core-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qck-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: qcklean
        run: |
          lake update
          lake exe cache get
      - name: Reject placeholders and local axioms
        working-directory: qcklean
        run: |
          set -euo pipefail
          found=0
          for file in QCK*.lean; do
            if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|constant|unsafe)([^[:alnum:]_]|$)' "$file"; then
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "Forbidden proof placeholder or local axiom declaration found in QCK source."
            exit 1
          fi
      - name: Build QCK Core
        working-directory: qcklean
        run: lake build QCK
      - name: Check QCK Core interface
        working-directory: qcklean
        run: lake env lean QCKCoreTest.lean
      - name: Compile every QCK Lean source
        working-directory: qcklean
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "checking $file"
            lake env lean "$file"
          done < <(find . -maxdepth 1 -type f -name '*.lean' ! -name 'lakefile.lean' | sort)
      - name: Report QCK theorem axiom surface
        working-directory: qcklean
        run: |
          cat > /tmp/QCKCoreAxiomAudit.lean <<'EOF'
          import QCKCore
          #print axioms QCK.allWordSubstitution
          #print axioms QCK.ker_le_contextNullspace
          #print axioms QCK.canonicalFactor_surjective
          #print axioms QCK.Certificate.comp
          #print axioms QCK.descendedOperation_intertwines
          #print axioms QCK.operation_descends_iff
          #print axioms QCK.operation_defect_witness
          EOF
          lake env lean /tmp/QCKCoreAxiomAudit.lean
