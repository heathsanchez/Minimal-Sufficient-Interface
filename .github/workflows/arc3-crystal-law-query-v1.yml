  cross_game_submission_controls:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install arc-agi==0.9.9 python-dotenv
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - name: Slim official framework imports
        run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Build current Crystal agent
        run: |
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py
      - name: Untouched bt11 transfer control
        run: |
          python kaggle/scripts/play_local.py --offline-environments-dir upstream-arc-agi/test_environment_files --game bt11-fd9df0622a1a --max-steps 128 | tee bt11-crystal.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' bt11-crystal.log
      - name: Qualified bt33 retention control
        run: |
          python kaggle/scripts/play_local.py --offline-environments-dir upstream-arc-agi/test_environment_files --game bt33-a7c3f9d18b4e --max-steps 128 | tee bt33-crystal.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' bt33-crystal.log
      - name: Emit cross-game submission evidence
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          def parse(name):
              s=Path(name).read_text()
              levels=[int(x) for x in re.findall(r'MAX_LEVELS_REACHED=(\d+)',s)]
              return {"max_levels":max(levels) if levels else None,"pass":"ARC3_PUBLIC_SMOKE=PASS" in s}
          out={"schema":"msi.arc3-cross-game-submission-controls-v1","bt11":parse("bt11-crystal.log"),"bt33":parse("bt33-crystal.log"),
               "boundary":"Current self-contained Crystal agent evaluated on untouched bt11 and qualified bt33 using pinned offline public environments. This is a submission control, not evidence that tn36 causal roles transfer across unrelated mechanics."}
          Path("evidence/arc3-cross-game-submission-controls-v1").mkdir(parents=True,exist_ok=True)
          Path("evidence/arc3-cross-game-submission-controls-v1/result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-cross-game-submission-controls-v1
          path: |
            evidence/arc3-cross-game-submission-controls-v1/result.json
            bt11-crystal.log
            bt33-crystal.log
          if-no-files-found: error


