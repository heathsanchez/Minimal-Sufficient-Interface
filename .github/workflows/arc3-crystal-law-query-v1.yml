name: ARC3 Crystal law query V1
on:
  push:
    branches: [arc3-crystal-law-query-v1]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck inherited ARC memory contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
      - name: Run reusable-law transfer gate
        run: python -m unittest kaggle.tests.test_crystal_laws -v
      - name: Run mechanics foundry corpus gate
        run: python -m unittest kaggle.tests.test_mechanics_foundry -v
      - name: Build self-contained ARC agent with Crystal law brain
        run: |
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py
          grep -q 'class ArcCrystalLawBridge' kaggle/agent/my_agent.py
          grep -q 'law:finite-separator-selection@1' kaggle/agent/my_agent.py
      - name: Emit bounded transfer evidence
        run: python kaggle/scripts/qualify_crystal_laws.py
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-crystal-law-query-v1-evidence
          path: evidence/arc3-crystal-law-query-v1/result.json
          if-no-files-found: error
