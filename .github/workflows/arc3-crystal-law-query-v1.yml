name: ARC3 Crystal law query V1
on:
  push:
    branches: [arc3-crystal-law-query-v1]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck inherited ARC memory contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
      - name: Run reusable-law transfer gate
        run: python -m unittest kaggle.tests.test_crystal_laws -v
      - name: Run mechanics foundry corpus gate
        run: python -m unittest kaggle.tests.test_mechanics_foundry -v
      - name: Build self-contained ARC agent with Crystal law brain
        run: |
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py
          grep -q 'class ArcCrystalLawBridge' kaggle/agent/my_agent.py
          grep -q 'law:finite-separator-selection@1' kaggle/agent/my_agent.py
      - name: Emit bounded transfer evidence
        run: python kaggle/scripts/qualify_crystal_laws.py
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-crystal-law-query-v1-evidence
          path: evidence/arc3-crystal-law-query-v1/result.json
          if-no-files-found: error

  historical_real_game:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install pinned Duck environment
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public tn36
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]); root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Replay historical active-probe policy through generic Crystal law
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
        run: |
          PYTHONPATH="${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments"             uv run python "${{ github.workspace }}/experiments/arc3_crystal_real_separator_retrospective_v1.py"
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-crystal-real-separator-retrospective-v1
          path: evidence/arc3-crystal-real-separator-retrospective-v1/result.json
          if-no-files-found: error

