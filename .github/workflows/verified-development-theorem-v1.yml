name: verified development theorem v1

on:
  push:
    branches: [msi/verified-development-theorem-v1]
    paths:
      - 'lean/**'
      - '.github/workflows/verified-development-theorem-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile theorem dependency chain
        env:
          LEAN_PATH: lean
        run: |
          set -euxo pipefail
          lean -o lean/Kernel.olean lean/Kernel.lean
          lean -o lean/Completeness.olean lean/Completeness.lean
          lean -o lean/BehaviouralCongruence.olean lean/BehaviouralCongruence.lean
          lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
          lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
          lean -o lean/GeneratedStage.olean lean/GeneratedStage.lean
          lean -o lean/ResidualRegimeBridge.olean lean/ResidualRegimeBridge.lean
          lean -o lean/FactorizationSufficiency.olean lean/FactorizationSufficiency.lean
          lean -o lean/ResourceIndexedConsequence.olean lean/ResourceIndexedConsequence.lean
          lean -o lean/VerifiedDevelopment.olean lean/VerifiedDevelopment.lean
          lean -o lean/DevelopmentalFailureTaxonomy.olean lean/DevelopmentalFailureTaxonomy.lean
          lean -o lean/FiniteProtectedCompleteness.olean lean/FiniteProtectedCompleteness.lean
          lean -o lean/VerifiedLanguageExtension.olean lean/VerifiedLanguageExtension.lean
          lean -o lean/ResidualInterfaceGenesis.olean lean/ResidualInterfaceGenesis.lean
          lean lean/VerifiedNewProbeGenesis.lean
      - name: Record theorem boundary
        run: |
          echo 'STATIC_ONE_STEP=CHECKED'
          echo 'STRICT_PROMOTION_EXPRESSIBILITY=CHECKED'
          echo 'ANCESTRAL_COMPOUNDING=CHECKED'
          echo 'RESOURCE_PHASE_HORIZON=CHECKED'
          echo 'FACTORIZATION_SUFFICIENCY=CHECKED'
          echo 'FAILURE_TAXONOMY=CHECKED'
          echo 'AMBIGUITY_NO_SEPARATOR=CHECKED'
          echo 'FINITE_PROTECTED_COMPLETENESS=CHECKED'
          echo 'OPAQUE_FAILURE_CLOSED_UNDER_FINITE_COVERED_PROTECTED_FAMILY=CHECKED'
          echo 'VERIFIED_LANGUAGE_EXTENSION=CHECKED'
          echo 'LEAST_ONE_SEED_STAGE_EXTENSION=CHECKED'
          echo 'RESIDUAL_INTERFACE_SUFFICIENCY_IFF_HITTING=CHECKED'
          echo 'UNOBSERVABLE_RESIDUAL_BLOCKS_EVERY_AVAILABLE_BASIS=CHECKED'
          echo 'MINIMAL_RESIDUAL_HITTING_INTERFACE=CHECKED'
          echo 'VERIFIED_NEW_PROBE_GENESIS=CHECKED'
          echo 'DERIVED_PROBE_FORCED_IN_ONE_PROBE_REPAIR=CHECKED'
          echo 'PROBE_ABLATION_RESTORES_OBSTRUCTION=CHECKED'
          echo 'REMAINING_BOUNDARY=endogenous synthesis/completeness of candidate meta-language beyond supplied generated probe family'
