name: verified development theorem v1

on:
  push:
    branches: [msi/verified-development-theorem-v1]
    paths:
      - 'lean/**'
      - '.github/workflows/verified-development-theorem-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile theorem dependency chain
        env:
          LEAN_PATH: lean
        run: |
          set -euxo pipefail
          lean -o lean/Kernel.olean lean/Kernel.lean
          lean -o lean/Completeness.olean lean/Completeness.lean
          lean -o lean/BehaviouralCongruence.olean lean/BehaviouralCongruence.lean
          lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
          lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
          lean -o lean/GeneratedStage.olean lean/GeneratedStage.lean
          lean -o lean/ResidualRegimeBridge.olean lean/ResidualRegimeBridge.lean
          lean -o lean/FactorizationSufficiency.olean lean/FactorizationSufficiency.lean
          lean -o lean/ResourceIndexedConsequence.olean lean/ResourceIndexedConsequence.lean
          lean -o lean/VerifiedDevelopment.olean lean/VerifiedDevelopment.lean
          lean -o lean/DevelopmentalFailureTaxonomy.olean lean/DevelopmentalFailureTaxonomy.lean
          lean -o lean/FiniteProtectedCompleteness.olean lean/FiniteProtectedCompleteness.lean
          lean -o lean/VerifiedLanguageExtension.olean lean/VerifiedLanguageExtension.lean
          lean -o lean/ResidualInterfaceGenesis.olean lean/ResidualInterfaceGenesis.lean
          lean -o lean/VerifiedNewProbeGenesis.olean lean/VerifiedNewProbeGenesis.lean
          lean -o lean/VerifiedNodeTypeGenesis.olean lean/VerifiedNodeTypeGenesis.lean
          lean -o lean/VerifiedConstructorFamilyGenesis.olean lean/VerifiedConstructorFamilyGenesis.lean
          lean -o lean/VerifiedDevelopmentalController.olean lean/VerifiedDevelopmentalController.lean
          lean -o lean/FiniteMetaLanguageExhaustion.olean lean/FiniteMetaLanguageExhaustion.lean
          lean -o lean/ResidualDerivedMetaLanguageGenesis.olean lean/ResidualDerivedMetaLanguageGenesis.lean
          lean -o lean/ResidualDerivedConstructorPrinciple.olean lean/ResidualDerivedConstructorPrinciple.lean
          lean lean/ResidualCompiledSyntaxGenesis.lean
      - name: Record theorem boundary
        run: |
          echo 'STATIC_ONE_STEP=CHECKED'
          echo 'STRICT_PROMOTION_EXPRESSIBILITY=CHECKED'
          echo 'ANCESTRAL_COMPOUNDING=CHECKED'
          echo 'RESOURCE_PHASE_HORIZON=CHECKED'
          echo 'FACTORIZATION_SUFFICIENCY=CHECKED'
          echo 'FAILURE_TAXONOMY=CHECKED'
          echo 'OBSERVATION_AUTHORITY_REGIME=CHECKED'
          echo 'AMBIGUITY_NO_SEPARATOR=CHECKED'
          echo 'FINITE_PROTECTED_COMPLETENESS=CHECKED'
          echo 'OPAQUE_FAILURE_CLOSED_UNDER_FINITE_COVERED_PROTECTED_FAMILY=CHECKED'
          echo 'VERIFIED_LANGUAGE_EXTENSION=CHECKED'
          echo 'LEAST_ONE_SEED_STAGE_EXTENSION=CHECKED'
          echo 'RESIDUAL_INTERFACE_SUFFICIENCY_IFF_HITTING=CHECKED'
          echo 'UNOBSERVABLE_RESIDUAL_BLOCKS_EVERY_AVAILABLE_BASIS=CHECKED'
          echo 'MINIMAL_RESIDUAL_HITTING_INTERFACE=CHECKED'
          echo 'VERIFIED_NEW_PROBE_GENESIS=CHECKED'
          echo 'DERIVED_PROBE_FORCED_IN_ONE_PROBE_REPAIR=CHECKED'
          echo 'PROBE_ABLATION_RESTORES_OBSTRUCTION=CHECKED'
          echo 'DEPTH_INDEPENDENT_SELECTOR_CLOSURE_OBSTRUCTION=CHECKED'
          echo 'VERIFIED_NEW_NODE_TYPE_GENESIS=CHECKED'
          echo 'NODE_ABLATION_RESTORES_OLD_IMPOSSIBILITY=CHECKED'
          echo 'RESIDUAL_SELECTED_INPUTS_LICENSE_LOCAL_VALUE_NODE=CHECKED'
          echo 'RESIDUAL_SELECTED_CONSTRUCTOR_FAMILY=CHECKED'
          echo 'CHEAPER_FAMILY_EXHAUSTION=CHECKED'
          echo 'LOWER_FAMILY_ABLATION_RESTORES_RESIDUAL=CHECKED'
          echo 'CONSEQUENCE_DEPENDENT_FAMILY_SELECTION=CHECKED'
          echo 'CERTIFIED_FIVE_WAY_CONTROLLER=CHECKED'
          echo 'FINITE_COVERED_REGIME_STOPS_OR_SPLITS=CHECKED'
          echo 'OPAQUE_INADEQUACY_FORCES_SPLIT_UNDER_FINITE_COVERAGE=CHECKED'
          echo 'FINITE_META_LANGUAGE_EXHAUSTION=CHECKED'
          echo 'GENERATED_CANDIDATE_IMPOSSIBILITY_AFTER_EXHAUSTION=CHECKED'
          echo 'LICENSED_BEYOND_META_LANGUAGE_GAIN=CHECKED'
          echo 'META_LANGUAGE_ABLATION_RESTORES_EXHAUSTION=CHECKED'
          echo 'RESIDUAL_DERIVED_INTERFACE_ARITY=CHECKED'
          echo 'SMALLER_ARITY_RESIDUAL_EXHAUSTION=CHECKED'
          echo 'MINIMAL_INTERFACE_ARITY_CERTIFIED=CHECKED'
          echo 'ARITY_ABLATION_RESTORES_OBSTRUCTION=CHECKED'
          echo 'RESIDUAL_LICENSES_JOINT_VIEW_CONSTRUCTOR=CHECKED'
          echo 'MINIMAL_CONSTRUCTOR_DEPENDENCY_ARITY=CHECKED'
          echo 'CONSTRUCTOR_DEPENDENCY_ABLATION=CHECKED'
          echo 'SEMANTIC_CONSTRUCTOR_PRINCIPLE_DERIVED=CHECKED'
          echo 'RESIDUAL_COMPILED_RECURSIVE_SYNTAX=CHECKED'
          echo 'COMPILED_SYNTAX_SEMANTICS_EXACT=CHECKED'
          echo 'COMPILED_SYNTAX_ESCAPES_EXHAUSTED_FAMILY=CHECKED'
          echo 'STRICT_SYNTAX_GENESIS_WITHOUT_ARITY_MENU=CHECKED'
          echo 'SYNTAX_ABLATION_RESTORES_VERIFIED_RESIDUAL=CHECKED'
          echo 'FINAL_BOUNDARY=fixed universal recursive substrate remains necessary; ex-nihilo invention outside every possible metalanguage is not an executable requirement'
