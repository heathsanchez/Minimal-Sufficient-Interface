name: verified development theorem v1

on:
  push:
    branches: [msi/verified-development-theorem-v1]
    paths:
      - 'lean/**'
      - '.github/workflows/verified-development-theorem-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile theorem dependency chain
        env:
          LEAN_PATH: lean
        run: |
          set -euxo pipefail
          lean -o lean/BehaviouralCongruence.olean lean/BehaviouralCongruence.lean
          lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
          lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
          lean -o lean/GeneratedStage.olean lean/GeneratedStage.lean
          lean -o lean/ResidualRegimeBridge.olean lean/ResidualRegimeBridge.lean
          lean -o lean/FactorizationSufficiency.olean lean/FactorizationSufficiency.lean
          lean -o lean/ResourceIndexedConsequence.olean lean/ResourceIndexedConsequence.lean
          lean lean/VerifiedDevelopment.lean
      - name: Record theorem boundary
        run: |
          echo 'STATIC_ONE_STEP=CHECKED'
          echo 'TWO_GENERATION_SHAPE=CHECKED'
          echo 'RESOURCE_PHASE_HORIZON=CHECKED'
          echo 'FACTORIZATION_SUFFICIENCY=CHECKED'
          echo 'REMAINING_BOUNDARY=Failure(B)->exists c,Residual(B,c)'
