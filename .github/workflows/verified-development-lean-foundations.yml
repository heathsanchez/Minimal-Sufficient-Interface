name: Verified Development Lean Foundations
on:
  push:
    branches: [verified-development-lean-foundations-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-foundations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check foundational and worked-example Lean sources
        env:
          LEAN_PATH: lean
        run: |
          set -euo pipefail
          lean --version
          lean -o lean/BehaviouralCongruence.olean lean/BehaviouralCongruence.lean
          lean -o lean/ScopedCertificates.olean lean/ScopedCertificates.lean
          lean -o lean/VerifiedDevelopmentCore.olean lean/VerifiedDevelopmentCore.lean
          lean lean/VerifiedDevelopmentExample.lean
          lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
          lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
          lean lean/CanonicalRefinement.lean
