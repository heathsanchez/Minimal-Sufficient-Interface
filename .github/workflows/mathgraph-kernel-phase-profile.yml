name: MathGraph Kernel Phase Profile

on:
  push:
    branches: [experiment/executable-lean-tight-loop]
    paths: [".github/workflows/mathgraph-kernel-phase-profile.yml"]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare identical exported theorem
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git /tmp/arena
          cat > /tmp/arena/tests/mathgraph-loop-probe.lean <<'EOF'
          import Std
          namespace LoopProbe
          theorem forced_new_separator
              {Obj Obs : Type} (p q : Obj) (B0 B1 : (Obj → Obs) → Prop)
              (hcollapse : ∀ b, B0 b → b p = b q)
              (hresolve : ∃ b, B1 b ∧ b p ≠ b q) :
              ∃ b, B1 b ∧ ¬ B0 b ∧ b p ≠ b q := by
            rcases hresolve with ⟨b, hB1, hsep⟩
            exact ⟨b, hB1, (fun hB0 => hsep (hcollapse b hB0)), hsep⟩
          end LoopProbe
          EOF
          cat > /tmp/arena/tests/mathgraph-loop-probe.yaml <<'EOF'
          description: Verified-prefix suffix profile.
          leanfile: tests/mathgraph-loop-probe.lean
          outcome: accept
          export-decls:
            - LoopProbe.forced_new_separator
          EOF
          cd /tmp/arena
          uv run lka.py build-test mathgraph-loop-probe
          cp _build/tests/mathgraph-loop-probe.ndjson /tmp/loop-valid.ndjson
      - name: Build experimental kernel
        run: |
          git clone --depth 1 --branch experiment/incremental-ai-loop https://github.com/metalogiclabs/mathgraph-lean-kernel /tmp/mathgraph
          cd /tmp/mathgraph
          cargo build --release
          cat > /tmp/valid.json <<'EOF'
          {"export_file_path":"/tmp/loop-valid.ndjson","use_stdin":false,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}
          EOF
          target/release/sokonanoda /tmp/valid.json >/dev/null
      - name: Compare full replay with verified-prefix last-declaration check
        run: |
          cd /tmp/mathgraph
          echo FULL_REPLAY
          target/release/sokonanoda --profile-repeat 10000 /tmp/valid.json
          echo VERIFIED_PREFIX_LAST
          target/release/sokonanoda --profile-last-repeat 10000 /tmp/valid.json
      - name: Construct invalid final theorem without changing prefix
        run: |
          python3 - <<'PY'
          import json
          src='/tmp/loop-valid.ndjson'
          dst='/tmp/loop-invalid.ndjson'
          rows=[]
          target=None
          with open(src) as f:
              for i,line in enumerate(f):
                  obj=json.loads(line)
                  rows.append(obj)
                  if 'thm' in obj:
                      target=i
          if target is None:
              raise SystemExit('no theorem record found')
          thm=rows[target]['thm']
          old_value=thm['value']
          thm['value']=thm['type']
          print('MUTATED_THM_ROW',target,'OLD_VALUE',old_value,'NEW_VALUE',thm['value'])
          with open(dst,'w') as f:
              for obj in rows:
                  f.write(json.dumps(obj,separators=(',',':'))+'\n')
          PY
          cat > /tmp/invalid.json <<'EOF'
          {"export_file_path":"/tmp/loop-invalid.ndjson","use_stdin":false,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}
          EOF
      - name: Require full replay and suffix path to reject same corrupted final theorem
        run: |
          cd /tmp/mathgraph
          set +e
          target/release/sokonanoda /tmp/invalid.json >/tmp/full.out 2>/tmp/full.err
          FULL=$?
          target/release/sokonanoda --profile-last-repeat 1 /tmp/invalid.json >/tmp/last.out 2>/tmp/last.err
          LAST=$?
          set -e
          echo "INVALID_FULL_EXIT=$FULL"
          echo "INVALID_LAST_EXIT=$LAST"
          echo "FULL_ERR=$(tail -1 /tmp/full.err)"
          echo "LAST_ERR=$(tail -1 /tmp/last.err)"
          test "$FULL" -ne 0
          test "$LAST" -ne 0
          test "$FULL" -eq "$LAST"
