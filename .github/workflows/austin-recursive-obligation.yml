name: Austin recursive obligation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover promotion schemas from source laws
        run: |
          python experiments/austin_promotion_compiler.py
          python -m unittest tests.test_austin_promotion_compiler -v
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Replay discovered obligations in Lean
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/AustinRecursiveObligation.lean
