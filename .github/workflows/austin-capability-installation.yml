name: Austin capability installation
on:
  push:
    branches: [austin-capability-installation-v1]
    paths:
      - 'experiments/austin_capability_installation.py'
      - 'experiments/austin_promotion_compiler.py'
      - 'experiments/austin_completion_development.py'
      - 'tests/test_austin_capability_installation.py'
      - 'tests/test_austin_completion_development.py'
      - 'tests/open_development_test.py'
      - 'lean/LemmaSynthesis/AustinCapabilityInstallation.lean'
      - 'lean/LemmaSynthesis/AustinCompletionDevelopment.lean'
      - '.github/workflows/austin-capability-installation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run baseline, transfer and completion tests
        run: |
          python -m unittest discover -s tests -p open_development_test.py -v
          python -m unittest discover -s tests -p test_austin_capability_installation.py -v
          python -m unittest discover -s tests -p test_austin_completion_development.py -v
      - name: Replay generated source
        run: |
          python - <<'PY'
          import hashlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('experiments').resolve()))
          import austin_capability_installation as d
          import austin_completion_development as c
          original = Path('lean/LemmaSynthesis/AustinCapabilityInstallation.lean').read_bytes()
          assert d.lean_source().encode() == original, 'Transport source mismatch'
          target = Path('lean/LemmaSynthesis/AustinCompletionDevelopment.lean')
          generated = c.lean_source().encode()
          if target.exists():
              assert target.read_bytes() == generated, 'Completion source mismatch'
          else:
              target.write_bytes(generated)
          assert target.read_bytes() == generated
          print('SOURCE_REPLAY=PASS')
          print('COMPLETION_SHA256=' + hashlib.sha256(generated).hexdigest())
          PY
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
      - name: Check generated transport and completion proofs
        shell: bash
        run: |
          set -euo pipefail
          LEAN_PATH=lean lean lean/LemmaSynthesis/AustinCapabilityInstallation.lean
          LEAN_PATH=lean lean lean/LemmaSynthesis/AustinCompletionDevelopment.lean
          echo 'AUSTIN_COMPLETION_LEAN=PASS'
