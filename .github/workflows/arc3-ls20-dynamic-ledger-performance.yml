name: ARC3 ls20 dynamic ledger performance
on:
  push:
    branches: [arc3-ls20-dynamic-ledger-performance-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-ls20-dynamic-ledger-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arc3-ls20-dynamic-ledger-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dynamic-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/ls20-dynamic-ledger-performance-results
          python kaggle/scripts/build_agent.py --output kaggle/ls20-dynamic-ledger-performance-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/ls20-dynamic-ledger-performance-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/ls20_dynamic_ledger_performance.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/ls20-dynamic-ledger-performance-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ls20 world
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/ls20-dynamic-ledger-performance-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20',
              environments_dir='kaggle/ls20-dynamic-ledger-performance-results/envs',
              manifest='kaggle/ls20-dynamic-ledger-performance-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Download and verify pinned V4 exact replay ledger
        run: |
          gh api /repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10549644700/zip > /tmp/v4.zip
          echo '6c321c28e3b4a58c427f13603c9267a966874803185880477d33d956e640aa13  /tmp/v4.zip' | sha256sum --check
          mkdir -p /tmp/v4
          unzip -q /tmp/v4.zip -d /tmp/v4
          cp /tmp/v4/component-explore-harvest-v4-results/exact-replay-ledger.json kaggle/ls20-dynamic-ledger-performance-results/exact-replay-ledger.json
      - name: Run four retained-evidence performance generations
        run: python -u kaggle/scripts/ls20_dynamic_ledger_performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-ls20-dynamic-ledger-performance
          path: |
            kaggle/ls20-dynamic-ledger-performance-results/
            kaggle/scripts/ls20_dynamic_ledger_performance.py
          if-no-files-found: warn
