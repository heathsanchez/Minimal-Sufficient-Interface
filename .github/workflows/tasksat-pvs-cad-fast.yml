name: TaskSAT PVS CAD Fast Gate

on:
  workflow_dispatch:
  push:
    branches:
      - tasksat-pvs-cad-semantic-law-v1
    paths:
      - "experiments/tasksat_semantic_drift_cad.pvs"
      - "experiments/tasksat_semantic_drift_cad.cmds"
      - "experiments/tasksat_range_bounds_contract_audit.py"
      - "experiments/tasksat_contract_compliant_assignment_audit.py"
      - "experiments/tasksat_bounds_assignment_repair.py"
      - ".github/workflows/tasksat-pvs-cad-fast.yml"

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out audit repo
        uses: actions/checkout@v4

      - name: Check out verified pvs_cad
        uses: actions/checkout@v4
        with:
          repository: j-tanner-slagel/pvs_cad
          ref: 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          path: vendor/pvs_cad

      - name: Check out pinned NASALib
        uses: actions/checkout@v4
        with:
          repository: nasa/pvslib
          ref: e426f69dc2680ad575491f93c5a51739ec8b25fa
          path: vendor/pvslib

      - name: Check out pinned TaskSAT
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/tasksat
          ref: f9d6063b45967a3fea578c47f54806aadaafe1b0
          path: vendor/tasksat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PVS 8.1.2 x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pvs-dist
          curl -L --fail --retry 3 https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz -o "$RUNNER_TEMP/pvs.tgz"
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  $RUNNER_TEMP/pvs.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pvs.tgz" -C vendor/pvs-dist
          PVS_BIN=$(find "$GITHUB_WORKSPACE/vendor/pvs-dist" -type f -name pvs -perm -u+x | head -1)
          test -n "$PVS_BIN"
          PVS_DIR=$(dirname "$PVS_BIN")
          echo "PVS_BIN=$PVS_BIN" >> "$GITHUB_ENV"
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          "$PVS_BIN" -raw -version

      - name: Install pinned TaskSAT
        run: python -m pip install -e vendor/tasksat

      - name: Audit containment contract
        run: >-
          python experiments/tasksat_range_bounds_contract_audit.py vendor/tasksat
          --out results/tasksat_range_bounds_contract_audit.json

      - name: Reproduce contract-compliant divergence
        run: >-
          python experiments/tasksat_contract_compliant_assignment_audit.py vendor/tasksat
          --expect unsat
          --out results/tasksat_contract_witness_before_repair.json

      - name: Apply candidate repair
        run: >-
          python experiments/tasksat_bounds_assignment_repair.py vendor/tasksat
          --out results/tasksat_reclamp_repair.json

      - name: Recheck contract-compliant witness after repair
        run: >-
          python experiments/tasksat_contract_compliant_assignment_audit.py vendor/tasksat
          --expect sat
          --out results/tasksat_contract_witness_after_repair.json

      - name: Configure pvs_cad
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_fast_scratch
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          cp experiments/tasksat_semantic_drift_cad.pvs vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_drift_cad.cmds vendor/pvs_cad/cad/
          bash vendor/pvs_cad/tools/setup.sh

      - name: Start one PVS server and typecheck audit theory
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_fast_scratch
          PVS_PORT: "23456"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/cli/srv.sh tasksat_semantic_drift_cad

      - name: Prove all observable-validity laws on warm PVS server
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_fast_scratch
          PVS_PORT: "23456"
          PC_TIMEOUT: "300"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          mkdir -p results
          bash vendor/pvs_cad/tools/cliprove.sh "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_drift_cad.pvs" tasksat_semantic_drift_cad "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_drift_cad.cmds" | tee results/tasksat_pvs_cad_fast.txt
          test "$(grep -c ' QED$' results/tasksat_pvs_cad_fast.txt)" -eq 8

      - name: Capture exact evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "FAST VERIFIED GATE"
            echo "TaskSAT=f9d6063b45967a3fea578c47f54806aadaafe1b0"
            echo "pvs_cad=8750362e99c2ba0e9a0307dcaa39b9766c562feb"
            echo "NASALib=e426f69dc2680ad575491f93c5a51739ec8b25fa"
            echo "PVS=pvs8.1.2"
            echo "PVS_asset_sha256=5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b"
            echo
            cat results/tasksat_pvs_cad_fast.txt
          } > results/tasksat_pvs_cad_fast_evidence.txt

      - name: Upload fast-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: tasksat-pvs-cad-fast-gate
          path: |
            results/tasksat_pvs_cad_fast.txt
            results/tasksat_pvs_cad_fast_evidence.txt
            results/tasksat_range_bounds_contract_audit.json
            results/tasksat_contract_witness_before_repair.json
            results/tasksat_contract_witness_after_repair.json
            results/tasksat_reclamp_repair.json
          if-no-files-found: error
