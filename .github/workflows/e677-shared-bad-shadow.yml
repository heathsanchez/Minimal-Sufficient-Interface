name: E677 shared Bad-shadow first-order probe

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-bad-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate authoritative frontier
        run: python frontier_contract.py
      - name: Route from authoritative residual
        id: router
        run: python frontier_router.py --github-output
      - name: Record non-applicability
        if: steps.router.outputs.route != 'SIZE_FREE_RENEWAL'
        run: echo "SHARED_BAD_SHADOW_SKIPPED_ROUTE=${{ steps.router.outputs.route }}"
      - name: Install exact solver
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: pip install z3-solver
      - name: Compile probe
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python -m py_compile e677_linked_two_mark_probe.py e677_shared_bad_shadow_probe.py
      - name: Run shared Bad-shadow theory
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python e677_shared_bad_shadow_probe.py
      - name: Verify classified transition
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/e677_shared_bad_shadow_probe.json'))
          for b in ('ZIPPER','GCROSS'):
              assert x['results'][b]['result'] in {'sat','unsat','unknown'}
          assert x['finite_model_claimed'] is False
          assert x['finite_counterexample_claimed'] is False
          assert x['global_e677_implication_claimed'] is False
          assert x['proposed_transition']['classification'] in {'PROMOTE','PARK','REQUIRE_ATTACHMENT'}
          print('SHADOW_ZIPPER='+x['results']['ZIPPER']['result'])
          print('SHADOW_GCROSS='+x['results']['GCROSS']['result'])
          print('SHADOW_TRANSITION='+x['proposed_transition']['classification'])
          print('SHADOW_RESIDUAL='+x['proposed_transition']['residual'])
          print('SHARED_BAD_SHADOW_TRANSITION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        with:
          name: e677-shared-bad-shadow
          path: artifacts/e677_shared_bad_shadow_probe.json
