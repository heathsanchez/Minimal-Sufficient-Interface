name: ARC3 consequence quotient
on:
  push:
    branches: [experiment/arc3-unrestricted-prefix-search-v1]
    paths:
      - 'experiments/arc3_consequence/consequence_quotient.py'
      - 'experiments/arc3_consequence/run_consequence_quotient.py'
      - 'tests/test_consequence_quotient.py'
      - '.github/workflows/arc3-consequence-quotient.yml'
  workflow_dispatch:
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install arc-agi==0.9.9
      - name: Test reversible quotient
        run: python -m unittest discover -s tests -p test_consequence_quotient.py -v
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Develop and compare
        run: |
          python experiments/arc3_consequence/run_consequence_quotient.py \
            --game bt33-a7c3f9d18b4e \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-episodes 2048 --max-depth 32 \
            --max-training-actions 20000 --max-levels 5 --horizon 4 \
            --output arc3-consequence-quotient.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-consequence-quotient
          path: arc3-consequence-quotient.json
          if-no-files-found: warn
