name: DuckTape Metatron promotion law

on:
  workflow_dispatch:
  push:
    branches: [arc3-ducktape-metatron-v1]
    paths:
      - 'kaggle/ducktape_metatron_patch.py'
      - '.github/workflows/ducktape-metatron-promotion.yml'

permissions:
  actions: read
  contents: read

jobs:
  experiment:
    name: ${{ matrix.policy }} t${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {policy: withheld, trial: 1}
          - {policy: raw, trial: 1}
          - {policy: constitutional, trial: 1}
          - {policy: withheld, trial: 2}
          - {policy: raw, trial: 2}
          - {policy: constitutional, trial: 2}
          - {policy: withheld, trial: 3}
          - {policy: raw, trial: 3}
          - {policy: constitutional, trial: 3}

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"
      LOCAL_ANALYZER_TEMPERATURE: "0"
      LOCAL_ANALYZER_TOP_P: "1"
      LOCAL_ANALYZER_TOOL_OUTPUT_TOKENS: "1024"
      DUCKTAPE_PROMOTION_POLICY: ${{ matrix.policy }}
      DUCKTAPE_GAME_ID: bt11

    steps:
      - uses: actions/checkout@v4

      - name: Require configured model key
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "DUCKTAPE_METATRON_BLOCKED=no_model_key"
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness

      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: vendor/ARC-AGI

      - name: Apply Metatron promotion-law patch
        run: |
          python kaggle/ducktape_metatron_patch.py \
            --root vendor/duck-harness/ARC3-Inference
          grep -q 'DuckTapeToolAgent' \
            vendor/duck-harness/ARC3-Inference/inference/framework/solver.py
          test -f vendor/duck-harness/ARC3-Inference/inference/agent/ducktape_metatron.py
          echo "DUCKTAPE_METATRON_PATCH=PASS"

      - name: Admit pinned bt11 to Duck selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("vendor/duck-harness/ARC3-Inference/inference/framework/kaggle.py")
          text = p.read_text()
          marker = "DUCK_HARNESS_PUBLIC_GAME_IDS: tuple[str, ...] = (\n"
          row = '    "bt11-fd9df0622a1a",\n'
          assert marker in text
          if row not in text:
              p.write_text(text.replace(marker, marker + row, 1))
          PY

      - name: Install public Duck from lockfile
        working-directory: vendor/duck-harness/ARC3-Inference
        run: |
          uv sync --locked --python "$(command -v python)"
          uv run python - <<'PY'
          from inference.agent.ducktape_metatron import DuckTapeToolAgent
          print("DUCKTAPE_METATRON_IMPORT=PASS")
          PY

      - name: Run matched promotion policy
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVIRONMENTS_DIR: ${{ github.workspace }}/vendor/ARC-AGI/test_environment_files
        run: |
          rm -rf "$GITHUB_WORKSPACE/out"
          CONFIG_PATH=configs/inference.openrouter.json \
          EXPERIMENT_DIR="$GITHUB_WORKSPACE/out" \
          ENVIRONMENTS_DIR="$GITHUB_WORKSPACE/vendor/ARC-AGI/test_environment_files" \
          GAME=bt11 \
          N_PASSES=1 \
          CONCURRENT_JOBS=1 \
          MAX_ACTIONS=180 \
          MAX_RUNTIME_MINUTES=12 \
          RUN_NAME="dt-metatron-${DUCKTAPE_PROMOTION_POLICY}-t${{ matrix.trial }}" \
          make interactive | tee "$GITHUB_WORKSPACE/run.log"
          SCORE_RUN_DIR="$GITHUB_WORKSPACE/out" make score_run \
            | tee "$GITHUB_WORKSPACE/score.log"

      - name: Seal policy result and causal controls
        if: always()
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          policy = "${{ matrix.policy }}"
          trial = int("${{ matrix.trial }}")
          root = Path("out")
          result = {
              "policy": policy,
              "trial": trial,
              "source": {
                  "public_duck_head": "7652836056c59e044f093e3c13ed7438c814169e",
                  "arc_agi_head": "f12822c4d550121c35a275008d964afbbed47d2f",
              },
              "game": "bt11-fd9df0622a1a",
              "model": "Qwen/Qwen3.6-27B",
              "temperature": 0,
              "max_actions": 180,
              "max_runtime_minutes": 12,
              "score": None,
              "levels": None,
              "state": None,
              "actions": None,
              "reported_tokens": None,
              "events": {},
              "verifications": [],
          }

          evaluation = root / "evaluation.json"
          if evaluation.exists():
              data = json.loads(evaluation.read_text())
              if data.get("games"):
                  game = data["games"][0]
                  result["score"] = float(data["score"])
                  result["levels"] = float(game["levels_completed_mean"])

          benchmark = root / "benchmark.json"
          if benchmark.exists():
              data = json.loads(benchmark.read_text())
              runs = data.get("game_runs") or []
              if runs:
                  run = runs[0]
                  result["state"] = run.get("state")
                  result["actions"] = len(run.get("history") or [])
                  note = str(run.get("solver_note") or "")
                  m = re.search(r"tokens=(\d+)", note)
                  result["reported_tokens"] = int(m.group(1)) if m else None

          counts = {}
          for p in root.rglob("ducktape-metatron.jsonl"):
              for line in p.read_text().splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  kind = str(event.get("kind"))
                  counts[kind] = counts.get(kind, 0) + 1
                  if kind == "VERIFICATION":
                      payload = dict(event.get("payload") or {})
                      result["verifications"].append(payload)

          result["events"] = counts
          result["won"] = bool(result.get("levels") == 5 or result.get("state") == "won")
          result["qualified_capabilities"] = counts.get("CAPABILITY", 0)
          result["candidates"] = counts.get("CANDIDATE", 0)
          result["rejections"] = counts.get("REJECT", 0)
          result["all_constitutional_controls_pass"] = bool(
              policy != "constitutional"
              or (
                  result["verifications"]
                  and all(
                      v.get("future_withholding") == "PASS"
                      and v.get("knockout") == "PASS"
                      and v.get("semantic_sham") == "PASS"
                      and v.get("restart") == "PASS"
                      and v.get("sealed_semantics") == "IDENTICAL"
                      for v in result["verifications"]
                      if v.get("status") == "PASS"
                  )
              )
          )

          out = Path(f"result-{policy}-t{trial}.json")
          out.write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          print("DUCKTAPE_METATRON_ARM=COMPLETE")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mt-${{ matrix.policy }}-t${{ matrix.trial }}
          path: |
            result-${{ matrix.policy }}-t${{ matrix.trial }}.json
            run.log
            score.log
            out/evaluation.json
            out/benchmark.json
            out/**/ducktape-metatron.jsonl
          if-no-files-found: warn

  summarize:
    name: summarize Metatron promotion law
    needs: experiment
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mt-*
          path: evidence
          merge-multiple: false

      - name: Aggregate promotion-law experiment
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path

          rows = [
              json.loads(p.read_text())
              for p in sorted(Path("evidence").rglob("result-*.json"))
          ]
          if not rows:
              raise SystemExit("no promotion-law results")

          arms = {}
          for policy in ("withheld", "raw", "constitutional"):
              group = [r for r in rows if r["policy"] == policy]
              scores = [r["score"] for r in group if r["score"] is not None]
              levels = [r["levels"] for r in group if r["levels"] is not None]
              actions = [r["actions"] for r in group if r["actions"] is not None]
              tokens = [r["reported_tokens"] for r in group if r["reported_tokens"] is not None]
              arms[policy] = {
                  "n": len(group),
                  "wins": sum(bool(r.get("won")) for r in group),
                  "mean_score": statistics.mean(scores) if scores else None,
                  "median_score": statistics.median(scores) if scores else None,
                  "mean_levels": statistics.mean(levels) if levels else None,
                  "median_levels": statistics.median(levels) if levels else None,
                  "mean_actions": statistics.mean(actions) if actions else None,
                  "mean_reported_tokens": statistics.mean(tokens) if tokens else None,
                  "total_candidates": sum(int(r.get("candidates") or 0) for r in group),
                  "total_qualified_capabilities": sum(
                      int(r.get("qualified_capabilities") or 0) for r in group
                  ),
                  "total_rejections": sum(int(r.get("rejections") or 0) for r in group),
                  "trials": group,
              }

          def delta(a, b, key):
              x, y = arms[a].get(key), arms[b].get(key)
              return None if x is None or y is None else x-y

          summary = {
              "design": {
                  "metatron_rule": (
                      "success stages a candidate; only independently verified "
                      "candidates may become model-visible capabilities"
                  ),
                  "controls": [
                      "FUTURE_WITHHOLDING",
                      "KNOCKOUT",
                      "SEMANTIC_SHAM",
                      "RESTART",
                      "SEALED_SEMANTICS=IDENTICAL",
                  ],
                  "policies": {
                      "withheld": "stage candidate, never promote",
                      "raw": "stage candidate, promote without verification",
                      "constitutional": (
                          "stage candidate, shadow-test on next protected future, "
                          "promote only after positive/sham/restart/seal gate"
                      ),
                  },
                  "game": "bt11-fd9df0622a1a",
                  "trials_per_policy": 3,
                  "model": "Qwen/Qwen3.6-27B",
                  "temperature": 0,
              },
              "arms": arms,
              "contrasts": {
                  "constitutional_minus_withheld_score": delta(
                      "constitutional", "withheld", "mean_score"
                  ),
                  "constitutional_minus_raw_score": delta(
                      "constitutional", "raw", "mean_score"
                  ),
                  "constitutional_minus_withheld_levels": delta(
                      "constitutional", "withheld", "mean_levels"
                  ),
                  "constitutional_minus_raw_levels": delta(
                      "constitutional", "raw", "mean_levels"
                  ),
              },
          }
          Path("ducktape-metatron-promotion-summary.json").write_text(
              json.dumps(summary, indent=2)
          )
          print(json.dumps(summary, indent=2))
          print("DUCKTAPE_METATRON_PROMOTION=COMPLETE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ducktape-metatron-promotion-summary
          path: |
            ducktape-metatron-promotion-summary.json
            evidence
          if-no-files-found: error
