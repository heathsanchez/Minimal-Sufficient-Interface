name: Kernel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive finite kernel tests
        run: python -m unittest discover -s tests -v
      - name: Capability bridge witness
        run: python examples/capability_bridge.py
