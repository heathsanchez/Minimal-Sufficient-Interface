name: Kernel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive finite kernel tests
        run: python -m unittest discover -s tests -v
      - name: Capability bridge witness
        env:
          PYTHONPATH: .
        run: python examples/capability_bridge.py
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check Lean kernel theorems
        env:
          LEAN_PATH: lean
        run: lean -o lean/Kernel.olean lean/Kernel.lean
      - name: Check unique minimal repair theorem
        env:
          LEAN_PATH: lean
        run: lean lean/MinimalRepair.lean
      - name: Check Lean completeness theorem
        env:
          LEAN_PATH: lean
        run: lean lean/Completeness.lean
      - name: Check Lean behavioural congruence theorem
        env:
          LEAN_PATH: lean
        run: lean lean/BehaviouralCongruence.lean
      - name: Check Lean typed behavioural congruence theorem
        env:
          LEAN_PATH: lean
        run: lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
      - name: Check Lean developmental category theorem
        env:
          LEAN_PATH: lean
        run: lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
      - name: Check least generated regime extension theorem
        env:
          LEAN_PATH: lean
        run: lean lean/GeneratedStage.lean
      - name: Check Lean arithmetic direction obstruction
        env:
          LEAN_PATH: lean
        run: lean lean/ArithmeticDirection.lean
      - name: Check finite search completeness boundary
        env:
          LEAN_PATH: lean
        run: lean lean/FiniteSearchCompletenessBoundary.lean
      - name: Check failure-generated consequence genesis
        env:
          LEAN_PATH: lean
        run: lean lean/FailureGeneratedConsequenceGenesis.lean
      - name: Check Lean falsifiers
        env:
          LEAN_PATH: lean
        run: lean lean/Falsifiers.lean
      - name: Check policy reflexivity PROXY (Test 3A-proxy)
        env:
          LEAN_PATH: lean
        run: |
          lean -o lean/ConstitutionalFailedFactorization.olean lean/ConstitutionalFailedFactorization.lean
          lean -o lean/ConstitutionalRealizationAndRecursion.olean lean/ConstitutionalRealizationAndRecursion.lean
          lean lean/PolicyReflexivity.lean
      - name: Check genuine policy reflexivity (Test 3A)
        env:
          LEAN_PATH: lean
        run: lean -o lean/GenuinePolicyReflexivity.olean lean/GenuinePolicyReflexivity.lean
      - name: Check forced kind genesis (Test 3B)
        env:
          LEAN_PATH: lean
        run: lean lean/ForcedKindGenesis.lean
      - name: Check residual-induced role discovery (strong D2)
        env:
          LEAN_PATH: lean
        run: lean lean/ResidualInducedRoleDiscovery.lean
      - name: Check observational separation (general kernel)
        env:
          LEAN_PATH: lean
        run: lean -o lean/ObservationalSeparation.olean lean/ObservationalSeparation.lean
      - name: Check residual miner (executable search)
        env:
          LEAN_PATH: lean
        run: lean lean/ResidualMiner.lean
      - name: Check ontology extension (new domain)
        env:
          LEAN_PATH: lean
        run: lean lean/OntologyExtension.lean
      - name: Check developmental chain (3 generations)
        env:
          LEAN_PATH: lean
        run: lean lean/DevelopmentalChain.lean
      - name: Check heterogeneous chain (kind tower)
        env:
          LEAN_PATH: lean
        run: lean lean/HeterogeneousChain.lean
      - name: Check generative tower (nested domains)
        env:
          LEAN_PATH: lean
        run: lean lean/GenerativeTower.lean
      - name: Check dependent universe (type-changing update)
        env:
          LEAN_PATH: lean
        run: lean lean/DependentUniverse.lean
      - name: Check self-contained world (certified transition)
        env:
          LEAN_PATH: lean
        run: lean lean/SelfContainedWorld.lean
      - name: Check residual-derived repair synthesis
        env:
          LEAN_PATH: lean
        run: lean lean/ResidualSynthesis.lean
      - name: Check constructor-language genesis
        env:
          LEAN_PATH: lean
        run: lean lean/CtorGenesis.lean
      - name: Check self-hosting generator evolution
        env:
          LEAN_PATH: lean
        run: lean lean/SelfHosting.lean
      - name: Check full-language self-hosting (branching, reconvergence, MSI)
        env:
          LEAN_PATH: lean
        run: lean lean/FullLangSelfHosting.lean
      - name: Check unified developmental transition (completeness boundary)
        env:
          LEAN_PATH: lean
        run: lean lean/UnifiedStep.lean
      - name: Check residual-induced context calculus
        env:
          LEAN_PATH: lean
        run: lean lean/ContextGenesis.lean
      - name: Check domain-generic developmental kernel (role derivation + convergence)
        env:
          LEAN_PATH: lean
        run: lean lean/DomainGenericKernel.lean
      - name: Check necessity, equivalence, certified cross-domain transition
        env:
          LEAN_PATH: lean
        run: lean lean/Closure.lean
      - name: Check frozen induction falsification target (residual-derived generalization)
        env:
          LEAN_PATH: lean
        run: lean lean/InductionFalsification/Phase2to4.lean
      - name: Check generic lemma-schema synthesis (reverse calibration, frozen)
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/GenericLemmaSynthesis.lean
      - name: Check frozen lemma-synthesis falsification target 2
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/Target2Result.lean
      - name: Check signature-generic typed term calculus
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/SignatureGenericTerm.lean
