name: Austin solver core A/B
on:
  push:
    paths:
      - 'experiments/austin_solver_core_ab.py'
      - '.github/workflows/austin-solver-core-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      STAGE2_SHA: 10f49d22f4030c3925aa5b2633ed73fd10a78cff
      SOURCE_BLOB: 05aa1c7d1d301d6d178b5ff9e1364cd41fe7fd3c
      ARCHIVED_SHA256: 42c96092bad4b03ce13ab80df927675b65ab65225bff1d971ff328949a6ef7f4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin actual repository source, not archived candidate
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/heathsanchez/equational-theories-lean-stage2.git /tmp/stage2
          git -C /tmp/stage2 checkout "$STAGE2_SHA"
          test "$(git -C /tmp/stage2 rev-parse HEAD)" = "$STAGE2_SHA"
          git -C /tmp/stage2 rev-parse HEAD:submissions/mathgraph/solver.py > /tmp/source-blob
          test "$(cat /tmp/source-blob)" = "$SOURCE_BLOB"
          cp /tmp/stage2/submissions/mathgraph/solver.py /tmp/solver.py
          python -m py_compile /tmp/solver.py
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          data = Path('/tmp/solver.py').read_bytes()
          actual = hashlib.sha256(data).hexdigest()
          print('PINNED_SOURCE_SHA256=' + actual)
          print('PINNED_SOURCE_BYTES=' + str(len(data)))
          print('ARCHIVED_SHA256=' + os.environ['ARCHIVED_SHA256'])
          print('ARCHIVED_SOLVER_IDENTITY=' + ('PASS' if actual == os.environ['ARCHIVED_SHA256'] else 'NOT_ESTABLISHED'))
          print('PINNED_SOURCE_IDENTITY=PASS')
          PY
      - name: Run matched source-only solver-core comparison
        run: |
          python experiments/austin_solver_core_ab.py --solver /tmp/solver.py --output /tmp/austin-ab --seconds 10
      - name: Install pinned Lean
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.1
      - name: Kernel-check all replayed certificates
        env:
          LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
        run: |
          set -euo pipefail
          mkdir -p .austin-lean
          export LEAN_PATH="$PWD/.austin-lean"
          lean --version
          for name in E40909 E11116; do
            cp "/tmp/austin-ab/${name}_JudgeProblem.lean" .austin-lean/JudgeProblem.lean
            lean -o .austin-lean/JudgeProblem.olean .austin-lean/JudgeProblem.lean
            for proof in /tmp/austin-ab/${name}_*.lean; do
              case "$proof" in *_JudgeProblem.lean) continue;; esac
              cp "$proof" .austin-lean/Replay.lean
              lean .austin-lean/Replay.lean
              echo "KERNEL_REPLAY_PASS=$(basename "$proof")"
            done
          done
          echo 'AUSTIN_SOLVER_CORE_LEAN=PASS'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: austin-solver-core-ab
          path: /tmp/austin-ab/
          if-no-files-found: ignore
