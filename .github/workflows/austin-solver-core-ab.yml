name: Austin solver core A/B
on:
  push:
    paths:
      - 'experiments/austin_solver_core_ab.py'
      - '.github/workflows/austin-solver-core-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      STAGE2_SHA: 10f49d22f4030c3925aa5b2633ed73fd10a78cff
      FROZEN_SHA256: 42c96092bad4b03ce13ab80df927675b65ab65225bff1d971ff328949a6ef7f4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact frozen solver
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/heathsanchez/equational-theories-lean-stage2.git /tmp/stage2
          git -C /tmp/stage2 checkout "$STAGE2_SHA"
          test "$(git -C /tmp/stage2 rev-parse HEAD)" = "$STAGE2_SHA"
          cd /tmp/stage2
          python experiments/mathgraph/build_projection_closure_schematic.py --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/solver.py'); s = p.read_text()
          a = 'frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b = 'given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a) == 1 and s.count(b) == 1
          p.write_text(s.replace(a, 'frontier_seconds = 30.0').replace(b, 'given_seconds = 10.0'))
          PY
          python experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          python -m py_compile /tmp/solver.py
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p = Path('/tmp/solver.py'); data = p.read_bytes()
          actual = hashlib.sha256(data).hexdigest()
          print('FROZEN_SOLVER_SHA256=' + actual)
          print('FROZEN_SOLVER_BYTES=' + str(len(data)))
          assert actual == os.environ['FROZEN_SHA256'], 'Frozen solver reconstruction differs; comparison forbidden'
          assert len(data) == 423718, 'Frozen solver size differs'
          print('FROZEN_SOLVER_IDENTITY=PASS')
          PY
      - name: Run matched source-only solver-core comparison
        run: |
          python experiments/austin_solver_core_ab.py --solver /tmp/solver.py --output /tmp/austin-ab --seconds 10
      - name: Install pinned Lean
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.1
      - name: Kernel-check all replayed certificates
        run: |
          set -euo pipefail
          mkdir -p /tmp/austin-lean
          for name in E40909 E11116; do
            cp "/tmp/austin-ab/${name}_JudgeProblem.lean" /tmp/austin-lean/JudgeProblem.lean
            LEAN_PATH=/tmp/austin-lean lean -o /tmp/austin-lean/JudgeProblem.olean /tmp/austin-lean/JudgeProblem.lean
            for proof in /tmp/austin-ab/${name}_*.lean; do
              case "$proof" in *_JudgeProblem.lean) continue;; esac
              LEAN_PATH=/tmp/austin-lean lean "$proof"
              echo "KERNEL_REPLAY_PASS=$(basename "$proof")"
            done
          done
          echo 'AUSTIN_SOLVER_CORE_LEAN=PASS'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: austin-solver-core-ab
          path: /tmp/austin-ab/
          if-no-files-found: ignore
