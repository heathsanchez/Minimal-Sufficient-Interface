name: ARC3 Public G3 Visual Diagnostic V1

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-g3-visual-diagnostic-v1]
    paths:
      - 'experiments/arc3_public_g3_visual_diagnostic_v1.py'
      - '.github/workflows/arc3-public-g3-visual-diagnostic-v1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Capture G3 black-box frames and components
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-g3-visual-diagnostic-v1
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_g3_visual_diagnostic_v1.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-g3-visual-diagnostic-v1.log"
          grep 'ARC3_PUBLIC_G3_VISUAL_DIAGNOSTIC_V1=PASS' "$GITHUB_WORKSPACE/arc3-public-g3-visual-diagnostic-v1.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-g3-visual-diagnostic-v1/result.json").read_text())
          assert d["status"]=="PASS"
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert len(d["trace"])==6
          print("ARC3_PUBLIC_G3_VISUAL_DIAGNOSTIC_V1_SEAL=PASS")
          print("BAR_COUNTS=",[(x["name"],len(x["bars"]["left"]),len(x["bars"]["right"])) for x in d["trace"]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-public-g3-visual-diagnostic-v1
          path: |
            evidence/arc3-public-g3-visual-diagnostic-v1/
            arc3-public-g3-visual-diagnostic-v1.log
          if-no-files-found: error
