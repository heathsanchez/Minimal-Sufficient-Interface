name: ARC3 frozen cross-game transfer
on:
  push:
    branches: [experiment/arc3-cross-game-transfer-v1]
    paths: ['.github/workflows/arc3-cross-game-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen controller source
        run: |
          git diff --exit-code dd567ec83c044da46fb1a44dd39c5ffc2c397929 HEAD -- experiments/arc3_consequence experiments/convergence/finite_consequence.py tests/test_compositional_development.py tests/test_multi_level_development.py
          echo 'FROZEN_CONTROLLER=PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - name: Qualify frozen controller
        run: |
          python -m unittest discover -s tests -p test_compositional_development.py -v
          python -m unittest discover -s tests -p test_multi_level_development.py -v
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Run unchanged controller on second game
        run: |
          mkdir -p arc3-transfer-results
          python experiments/arc3_consequence/run_compositional.py \
            --game bt33-a7c3f9d18b4e \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-episodes 512 --max-depth 32 \
            --max-training-actions 3000 --max-levels 3 \
            --output arc3-transfer-results/bt33.json \
            > arc3-transfer-results/bt33.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('arc3-transfer-results/bt33.json').read_text())
          d=r['development']
          summary={
              'game':r['game'], 'status':r['status'], 'improved':r['improved'],
              'development_status':d['status'], 'stages':len(d['stages']),
              'training_episodes':d['training_episodes'],
              'training_actions':d['training_actions'],
              'cold':{k:r['cold'][k] for k in ('actions','levels_completed','score','state')},
              'warm':{k:r['warm'][k] for k in ('actions','levels_completed','score','state')},
          }
          print('ARC3_CROSS_GAME='+json.dumps(summary,sort_keys=True))
          Path('arc3-transfer-results/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-cross-game-transfer
          path: arc3-transfer-results/
          if-no-files-found: warn
