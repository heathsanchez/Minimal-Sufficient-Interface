name: ARC3 Public Purple Geometry G3
on:
  workflow_dispatch:
  push:
    branches: [arc3-public-purple-geometry-g3]
    paths:
      - 'experiments/arc3_public_purple_geometry_g3.py'
      - '.github/workflows/arc3-public-purple-geometry-g3.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.12'}
      - run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download game
        working-directory: vendor/duck-harness/ARC3-Inference
        env: {ENV_DIR: ${{ github.workspace }}/public-env, GAME_ID: tn36-ef4dde99}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade,OperationMode
          p=Path(os.environ["ENV_DIR"]);p.mkdir(parents=True,exist_ok=True)
          a=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(p));e=a.make(os.environ["GAME_ID"])
          assert e is not None;a.close_scorecard()
          PY
      - name: Test purple geometry
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-purple-geometry-g3
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_purple_geometry_g3.py" | tee "$GITHUB_WORKSPACE/purple-geometry.log"
          grep -E 'ARC3_PUBLIC_PURPLE_GEOMETRY_G3=(PROMOTED|RESIDUAL)' "$GITHUB_WORKSPACE/purple-geometry.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-purple-geometry-g3/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert d["status"] in {"PROMOTED","RESIDUAL"}
          if d["status"]=="PROMOTED":assert all(x["progressed"] for x in d["verification"])
          print("STATUS=",d["status"]);print("TESTED=",len(d["tested"]));print("SELECTED=",d["selected"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-purple-geometry-g3
          path: |
            evidence/arc3-public-purple-geometry-g3/result.json
            purple-geometry.log
          if-no-files-found: error
