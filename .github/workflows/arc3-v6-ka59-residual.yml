name: ARC3 V6 ka59 Exact Residual
on:
  push:
    branches: [arc3-causal-role-rebinding-v1]
    paths:
      - experiments/arc3_latent_control_tournament_v6.py
      - .github/workflows/arc3-v6-ka59-residual.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch pinned replay corpus
        run: |
          git clone --quiet https://github.com/Tufalabs/duck-harness.git /tmp/duck
          git -C /tmp/duck checkout --quiet 7652836056c59e044f093e3c13ed7438c814169e
      - name: Tournament latent coordinates on exact residual only
        run: |
          mkdir -p out
          PYTHONPATH=experiments python experiments/arc3_latent_control_tournament_v6.py \
            --events-dir /tmp/duck/example-run/artifacts \
            --game-prefix ka59-38d34dbb \
            --output out/arc3-v6-ka59-residual.json
          cat out/arc3-v6-ka59-residual.json
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-v6-ka59-residual
          path: out/
          if-no-files-found: error
