name: Residual regime bridge

on:
  push:
    paths:
      - 'lean/ResidualRegimeBridge.lean'
      - 'lean/BehaviouralCongruence.lean'
      - '.github/workflows/residual-regime-bridge.yml'
  pull_request:
    paths:
      - 'lean/ResidualRegimeBridge.lean'
      - 'lean/BehaviouralCongruence.lean'
      - '.github/workflows/residual-regime-bridge.yml'

permissions:
  contents: read

jobs:
  residual-minimal-repair-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile residual-to-regime theorem
        env:
          LEAN_PATH: lean
        run: |
          lean -o lean/BehaviouralCongruence.olean lean/BehaviouralCongruence.lean
          lean lean/ResidualRegimeBridge.lean
