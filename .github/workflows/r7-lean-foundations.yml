name: R7 Lean Foundations
on:
  push:
    branches: [r7-daniel-lean-foundations-v1]
  pull_request:
    paths:
      - 'lean/CanonicalRefinement.lean'
      - 'lean/ScopedCertificates.lean'
      - '.github/workflows/r7-lean-foundations.yml'
      - 'papers/R7_Lean_Foundations.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-foundations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify exact R7 Lean declarations
        env:
          LEAN_PATH: lean
        run: |
          set -euo pipefail
          lean --version
          lean -o lean/TypedBehaviouralCongruence.olean lean/TypedBehaviouralCongruence.lean
          lean -o lean/DevelopmentalCategory.olean lean/DevelopmentalCategory.lean
          lean lean/CanonicalRefinement.lean
          lean lean/ScopedCertificates.lean
