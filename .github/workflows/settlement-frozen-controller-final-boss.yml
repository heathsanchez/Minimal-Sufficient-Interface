name: settlement frozen controller final boss
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/settlement_frozen_controller_final_boss.py'
      - '.github/workflows/settlement-frozen-controller-final-boss.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen-controller settlement gate
        run: python experiments/settlement_frozen_controller_final_boss.py
