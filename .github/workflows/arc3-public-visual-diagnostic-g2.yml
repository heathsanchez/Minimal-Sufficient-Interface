name: ARC3 Public Visual Diagnostic G2

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-generational-frontier-g2]
    paths:
      - 'experiments/arc3_public_visual_diagnostic_g2.py'
      - '.github/workflows/arc3-public-visual-diagnostic-g2.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv and Pillow
        run: |
          python -m pip install --disable-pip-version-check uv pillow
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Capture visible boards
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-visual-diagnostic-g2
        run: |
          uv run --with pillow python "$GITHUB_WORKSPACE/experiments/arc3_public_visual_diagnostic_g2.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-visual-diagnostic-g2.log"
          grep -q 'ARC3_PUBLIC_VISUAL_DIAGNOSTIC_G2=PASS' "$GITHUB_WORKSPACE/arc3-public-visual-diagnostic-g2.log"
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-public-visual-diagnostic-g2
          path: |
            evidence/arc3-public-visual-diagnostic-g2/*.png
            arc3-public-visual-diagnostic-g2.log
          if-no-files-found: error
