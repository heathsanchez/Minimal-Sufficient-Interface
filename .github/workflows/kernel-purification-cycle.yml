name: Kernel Purification Cycle

on:
  push:
    branches: [remove-finite-open-development-v16, kernel-purification-cycle-1]
    paths:
      - 'formal/KernelPurificationCycle.lean'
      - 'formal/KernelPurificationCycle2.lean'
      - 'formal/KernelPurificationCycle3.lean'
      - 'formal/KernelPurificationCycle4.lean'
      - 'formal/KernelPurificationCycle5.lean'
      - 'formal/KernelPurificationCycle6.lean'
      - 'formal/KernelPurificationCycle7.lean'
      - 'formal/KernelPurificationCycle8.lean'
      - 'formal/KernelPurificationCycle9.lean'
      - 'formal/KernelPurificationCycle10.lean'
      - 'formal/KernelPurificationCycle11.lean'
      - 'formal/KernelPurificationCycle12.lean'
      - '.github/workflows/kernel-purification-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependencies
        env: {LEAN_PATH: formal}
        run: |
          lean -o formal/IdentityForcedAsMinimalCompletion.olean formal/IdentityForcedAsMinimalCompletion.lean
          lean -o formal/FailureForcesIdentityCompletion.olean formal/FailureForcesIdentityCompletion.lean
          lean -o formal/FailureForcesCompositionCompletion.olean formal/FailureForcesCompositionCompletion.lean
          lean -o formal/ResidualGeneratedProbeGenesis.olean formal/ResidualGeneratedProbeGenesis.lean
          lean -o formal/VerifiedConsequenceGenesis.olean formal/VerifiedConsequenceGenesis.lean
          lean -o formal/ReachabilityGeneratesConsequence.olean formal/ReachabilityGeneratesConsequence.lean
          lean -o formal/KernelPurificationCycle.olean formal/KernelPurificationCycle.lean
          lean -o formal/KernelPurificationCycle2.olean formal/KernelPurificationCycle2.lean
          lean -o formal/KernelPurificationCycle3.olean formal/KernelPurificationCycle3.lean
          lean -o formal/KernelPurificationCycle4.olean formal/KernelPurificationCycle4.lean
          lean -o formal/KernelPurificationCycle5.olean formal/KernelPurificationCycle5.lean
          lean -o formal/KernelPurificationCycle6.olean formal/KernelPurificationCycle6.lean
          lean -o formal/KernelPurificationCycle7.olean formal/KernelPurificationCycle7.lean
          lean -o formal/KernelPurificationCycle8.olean formal/KernelPurificationCycle8.lean
          lean -o formal/KernelPurificationCycle9.olean formal/KernelPurificationCycle9.lean
          lean -o formal/KernelPurificationCycle10.olean formal/KernelPurificationCycle10.lean
          lean -o formal/KernelPurificationCycle11.olean formal/KernelPurificationCycle11.lean
      - name: Run cycles 1 through 8
        env: {LEAN_PATH: formal}
        run: |
          lean formal/KernelPurificationCycle.lean
          echo "KERNEL_PURIFICATION_CYCLE_1=PASS"
          lean formal/KernelPurificationCycle2.lean
          echo "KERNEL_PURIFICATION_CYCLE_2=PASS"
          lean formal/KernelPurificationCycle3.lean
          echo "KERNEL_PURIFICATION_CYCLE_3=PASS"
          lean formal/KernelPurificationCycle4.lean
          echo "KERNEL_PURIFICATION_CYCLE_4=PASS"
          lean formal/KernelPurificationCycle5.lean
          echo "KERNEL_PURIFICATION_CYCLE_5=PASS"
          lean formal/KernelPurificationCycle6.lean
          echo "KERNEL_PURIFICATION_CYCLE_6=PASS"
          lean formal/KernelPurificationCycle7.lean
          echo "FULL_MISMATCH_SUPPORT_IS_CANONICAL=PASS"
          echo "ARBITRARY_WITNESS_SELECTION_ELIMINATED=PASS"
          echo "KERNEL_PURIFICATION_CYCLE_7=PASS"
          lean formal/KernelPurificationCycle8.lean
          echo "BOOLEAN_SUPPORT_ALPHABET_ELIMINATED=PASS"
          echo "PROPOSITIONAL_CONSEQUENCE_SUPPORT_SUFFICIENT=PASS"
          echo "KERNEL_PURIFICATION_CYCLE_8=PASS"
      - name: Run ninth kernel purification cycle
        env: {LEAN_PATH: formal}
        run: |
          lean formal/KernelPurificationCycle9.lean
          echo "RESIDUAL_GENERATES_CONSEQUENCE_COORDINATE=PASS"
          echo "GENERATED_COORDINATE_GENUINELY_NEW_UNDER_BLINDNESS=PASS"
          echo "OLD_COORDINATES_RETAINED=PASS"
          echo "FREE_LANGUAGE_EXTENSION_UNIVERSALITY=PASS"
          echo "CANDIDATE_COORDINATE_MENU_ELIMINATED=PASS"
          echo "KERNEL_PURIFICATION_CYCLE_9=PASS"
      - name: Run tenth kernel purification cycle
        env: {LEAN_PATH: formal}
        run: |
          lean formal/KernelPurificationCycle10.lean
          echo "GLOBAL_NONFACTORIZATION_LOCALIZES_WITHOUT_SUPPLIED_PAIR=PASS"
          echo "FULL_NONFACTORIZATION_SUPPORT_IS_CANONICAL=PASS"
          echo "SUPPORT_GENERATES_OWN_CONSEQUENCE_COORDINATES=PASS"
          echo "FAILED_PAIR_SELECTION_ELIMINATED=PASS"
          echo "FULL_LANGUAGE_EXTENSION_IS_FREE=PASS"
          echo "KERNEL_PURIFICATION_CYCLE_10=PASS"
      - name: Run eleventh kernel purification cycle
        env: {LEAN_PATH: formal}
        run: |
          lean formal/KernelPurificationCycle11.lean
          echo "INTERACTION_FAILURE_GENERATES_REQUIRED_CONSEQUENCE=PASS"
          echo "SUPPLIED_REQUIRED_CONSEQUENCE_ELIMINATED=PASS"
          echo "FAILURE_GENERATED_CONSEQUENCE_FORCES_NONFACTORIZATION=PASS"
          echo "FAILURE_GENERATES_FULL_RESIDUAL_LANGUAGE=PASS"
          echo "REVERSE_TRANSPORT_ABLATION_BLOCKS_GENERATED_SEPARATION=PASS"
          echo "KERNEL_PURIFICATION_CYCLE_11=PASS"
      - name: Run twelfth kernel purification cycle
        env: {LEAN_PATH: formal}
        run: |
          lean formal/KernelPurificationCycle12.lean
          echo "FAILURE_GENERATES_CONSEQUENCE_AND_REPAIR=PASS"
          echo "LEAST_REFINEMENT_RESTORES_FACTORIZATION=PASS"
          echo "OLD_REPRESENTATION_AND_LANGUAGE_PRESERVED=PASS"
          echo "TRIGGERING_OBLIGATION_CLOSED_AFTER_REPAIR=PASS"
          echo "ONE_FULL_DEVELOPMENTAL_TURN=PASS"
          echo "KERNEL_PURIFICATION_CYCLE_12=PASS"
