name: Cross-Lens Hidden World

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-lens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Four-lens hidden cyclic world convergence
        run: python -m unittest tests.test_cross_lens_hidden_cyclic_world -v
