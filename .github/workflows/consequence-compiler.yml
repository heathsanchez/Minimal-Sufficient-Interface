name: Consequence Compiler

on:
  push:
    branches:
      - consequence-compiler
      - constitutional-failed-factorization
      - residual-driven-realizer-synthesis
    paths:
      - 'consequence_compiler.py'
      - 'realizer_synthesis.py'
      - 'consequential_core.py'
      - 'tests/test_consequence_compiler_cross_domain.py'
      - 'tests/test_residual_driven_realizer_synthesis.py'
      - 'docs/CONSEQUENCE_COMPILER.md'
      - '.github/workflows/consequence-compiler.yml'
  workflow_dispatch:

jobs:
  cross-domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generic compiler cross-domain controls
        run: python -m unittest tests.test_consequence_compiler_cross_domain -v
      - name: Residual-driven realizer synthesis controls
        run: python -m unittest tests.test_residual_driven_realizer_synthesis -v
