name: Verifier Induces Behavioral Hypothesis Space

on:
  push:
    branches:
      - rgrs/universe-genesis-positive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check verifier-induced behavioral hypothesis space
        run: |
          export LEAN_PATH=formal
          lean formal/VerifierInducesBehavioralHypothesisSpace.lean
          echo "RAW_CANDIDATES_COMPILED_TO_BEHAVIOR_CLASSES=PASS"
          echo "CLASS_EQUALITY_IFF_VERIFIER_PROFILE_EQUALITY=PASS"
          echo "VERIFIER_DISTINCTIONS_FORCE_CLASS_DISTINCTIONS=PASS"
          echo "VERIFIER_INDISTINGUISHABILITY_COLLAPSES_CANDIDATES=PASS"
          echo "FULL_SEMANTIC_FUNCTION_SPACE_NOT_HYPOTHESIS_ONTOLOGY=PASS"
          echo "EMPTY_COVERAGE_FORCES_NEW_INDUCED_CLASS=PASS"
          echo "NO_UNRELATED_BEHAVIOR_CLASS_ADDED=PASS"
          echo "FREE_INDUCED_LANGUAGE_COMPLETION_UNIVERSAL=PASS"
          echo "RAW_CANDIDATE_CARRIER_AND_VERIFIER_CONTEXT_FAMILY_STILL_SUPPLIED=BOUNDARY"
          echo "VERIFIER_INDUCED_BEHAVIOR_FEEDS_LANGUAGE_GENESIS=PASS"
