name: TaskSAT Semantic Boundary Audit

on:
  workflow_dispatch:
  push:
    branches:
      - tasksat-semantic-boundary-audit-v1
    paths:
      - "experiments/tasksat_bounds_assignment_audit.py"
      - "tests/test_tasksat_bounds_assignment_audit.py"
      - "TASKSAT_SEMANTIC_BOUNDARY_AUDIT.md"
      - ".github/workflows/tasksat-semantic-boundary-audit.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit repo
        uses: actions/checkout@v4

      - name: Check out pinned TaskSAT
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/tasksat
          ref: f9d6063b45967a3fea578c47f54806aadaafe1b0
          path: vendor/tasksat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TaskSAT audit dependencies
        run: python -m pip install lark==1.3.1 ply==3.11 z3-solver==4.15.4.0

      - name: Check minimized algebraic separator
        run: python -m unittest -v tests.test_tasksat_bounds_assignment_audit

      - name: Reproduce against pinned TaskSAT
        run: >-
          python experiments/tasksat_bounds_assignment_audit.py vendor/tasksat
          --out results/tasksat_bounds_assignment_audit.json

      - name: Upload exact audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: tasksat-semantic-boundary-audit
          path: results/tasksat_bounds_assignment_audit.json
          if-no-files-found: error
