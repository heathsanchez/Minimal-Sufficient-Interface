name: Shared runtime ARC3 transfer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned public ARC toolkit
        run: python -m pip install --require-hashes -r experiments/arc3_shared_runtime/requirements.lock
      - name: Checkout immutable ARC3 discovery harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 68e37033f3ae1e86e992dfe8d982aef9133612aa
          path: frozen-arc3
          persist-credentials: false
      - name: Checkout immutable public ARC environments
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc
          persist-credentials: false
      - name: Checkout immutable shared replay-gated runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 4f03be5acc34ce23775c19cd7f291ba001bf8b67
          path: frozen-runtime
          persist-credentials: false
      - name: Install checksum-verified Lean 4.24.0 distribution
        run: |
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst -o /tmp/lean.tar.zst
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec /tmp/lean.tar.zst | sha256sum -c -
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo "/tmp/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Compile shared developmental implementation
        run: |
          printf '%s  %s\n' 7fccc94a5d9cabefe36f05fdc3c89cc1d8535b6ec9c8f7e68e50ea0a78022db3 frozen-runtime/lean/LemmaSynthesis/SynthesisCore.lean | sha256sum -c -
          mkdir -p /tmp/shared-runtime-olean/LemmaSynthesis
          LEAN_PATH=frozen-runtime/lean lean \
            -o /tmp/shared-runtime-olean/LemmaSynthesis/SynthesisCore.olean \
            frozen-runtime/lean/LemmaSynthesis/SynthesisCore.lean
      - name: Qualify frozen harness and orchestration controls
        env:
          LEAN_PATH: /tmp/shared-runtime-olean
        run: |
          python -m unittest discover -s frozen-arc3/tests -p test_parameterized_actions.py -v
          python -m unittest discover -s frozen-arc3/tests -p test_compositional_development.py -v
          python -m unittest discover -s frozen-arc3/tests -p test_multi_level_development.py -v
          python -m unittest tests.test_arc3_shared_runtime_transfer -v
      - name: Discover, replay-gate, retain, and deploy on bt33
        env:
          LEAN_PATH: /tmp/shared-runtime-olean
        run: |
          python experiments/arc3_shared_runtime/run_transfer.py \
            --frozen-harness frozen-arc3 \
            --upstream-arc upstream-arc \
            --shared-runtime frozen-runtime \
            --lean-path /tmp/shared-runtime-olean \
            --game bt33-a7c3f9d18b4e \
            --max-actions 120 --max-episodes 512 --max-depth 32 \
            --max-training-actions 3000 --max-levels 3 \
            --stride 8 --max-grounded-actions 256 \
            --certificate arc3-shared-runtime-certificate.lean \
            --output arc3-shared-runtime-transfer.json
      - name: Independently replay with the immutable ARC3 controller
        run: |
          python frozen-arc3/experiments/arc3_consequence/run_parameterized.py \
            --environments-dir upstream-arc/test_environment_files \
            --game bt33-a7c3f9d18b4e \
            --max-actions 120 --max-episodes 512 --max-depth 32 \
            --max-training-actions 3000 --max-levels 3 \
            --stride 8 --max-grounded-actions 256 \
            --output frozen-independent-replay.json
      - name: Cross-check independently produced evidence
        run: |
          git merge-base --is-ancestor 4f03be5acc34ce23775c19cd7f291ba001bf8b67 "$GITHUB_SHA"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          result = json.loads(Path('arc3-shared-runtime-transfer.json').read_text())
          frozen = json.loads(Path('frozen-independent-replay.json').read_text())
          certificate = Path('arc3-shared-runtime-certificate.lean').read_bytes()
          failures = []
          def require(condition, message):
              if not condition:
                  failures.append(message)
          require(result['status'] == 'VERIFIED_SHARED_RUNTIME_TRANSFER', 'shared transfer status')
          require(result['model_calls'] == 0, 'model calls')
          require(result['cold']['levels_completed'] == 0, 'cold level count')
          require(result['candidate_replay']['levels_completed'] > result['cold']['levels_completed'], 'candidate replay gain')
          require(result['warm']['levels_completed'] > result['cold']['levels_completed'], 'retained deployment gain')
          require(result['sham_replay']['levels_completed'] <= result['cold']['levels_completed'], 'sham control')
          require(result['ablation']['levels_completed'] <= result['cold']['levels_completed'], 'exact ablation control')
          require(result['retained']['gate_marker'] == 'ARC3_SHARED_GATE_PASS', 'Lean gate marker')
          candidate_payload = json.dumps(result['retained']['program'], separators=(',', ':')).encode()
          require(hashlib.sha256(candidate_payload).hexdigest() == result['retained']['program_sha256'], 'retained program digest')
          require(hashlib.sha256(certificate).hexdigest() == result['retained']['certificate_sha256'], 'certificate digest')
          require(result['frozen_sources'] == {
              'arc3_harness': '68e37033f3ae1e86e992dfe8d982aef9133612aa',
              'arc_agi': '0.9.9',
              'shared_runtime_parent': '4f03be5acc34ce23775c19cd7f291ba001bf8b67',
              'upstream_arc': 'f12822c4d550121c35a275008d964afbbed47d2f',
          }, 'frozen source identities')
          require(result['bounds'] == {
              'max_actions': 120, 'max_episodes': 512, 'max_depth': 32,
              'max_training_actions': 3000, 'max_levels': 3,
              'stride': 8, 'max_grounded_actions': 256,
          }, 'fixed bounds')
          require(frozen['status'] == 'COMPARABLE' and frozen['improved'], 'immutable controller result')
          require(frozen['model_calls'] == 0, 'immutable controller model calls')
          require(frozen['initial_sha256'] == result['public_initial_sha256'], 'public initial observation')
          require(frozen['cold']['trace_sha256'] == result['cold']['trace_sha256'], 'cold trace')
          require(frozen['warm']['trace_sha256'] == result['warm']['trace_sha256'], 'warm trace')
          require(frozen['development']['options'][0] == result['retained']['program'], 'acquired option')
          require(frozen['development']['evidence_sha256'] == result['development']['evidence_sha256'], 'discovery evidence')
          require(result['development']['status'] == frozen['development']['status'], 'discovery status')
          require(not result['development']['status'].startswith(('INCONCLUSIVE', 'UNSUPPORTED')), 'conclusive discovery')
          starts = [result[name]['initial_sha256'] for name in
                    ('cold', 'sham_replay', 'candidate_replay', 'warm', 'ablation')]
          starts.append(result['development']['initial_sha256'])
          require(all(value == result['public_initial_sha256'] for value in starts), 'all initial observations')
          if failures:
              raise SystemExit('independent evidence mismatch: ' + ', '.join(failures))
          paths = [
              Path('arc3-shared-runtime-transfer.json'),
              Path('arc3-shared-runtime-certificate.lean'),
              Path('frozen-independent-replay.json'),
          ]
          provenance = {
              'event_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'shared_runtime_source_sha256': '7fccc94a5d9cabefe36f05fdc3c89cc1d8535b6ec9c8f7e68e50ea0a78022db3',
              'artifacts': {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in paths},
          }
          Path('arc3-shared-runtime-provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n'
          )
          print('SHARED_RUNTIME_ARC3_TRANSFER_PASS')
          PY
          sha256sum arc3-shared-runtime-transfer.json arc3-shared-runtime-certificate.lean frozen-independent-replay.json arc3-shared-runtime-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-runtime-arc3-transfer-${{ github.run_id }}
          if-no-files-found: error
          path: |
            arc3-shared-runtime-transfer.json
            arc3-shared-runtime-certificate.lean
            frozen-independent-replay.json
            arc3-shared-runtime-provenance.json
