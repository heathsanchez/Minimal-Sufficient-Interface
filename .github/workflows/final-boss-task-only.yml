name: Final Boss Task-Only Category Genesis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  final-boss:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Task-only categorical genesis
        run: python -m unittest tests.test_final_boss_task_only_category_genesis -v
