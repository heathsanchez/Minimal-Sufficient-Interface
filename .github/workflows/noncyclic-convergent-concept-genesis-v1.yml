name: noncyclic convergent concept genesis v1

on:
  push:
    branches:
      - noncyclic-convergent-concept-genesis-v1
  workflow_dispatch:

jobs:
  final-boss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Non-cyclic convergent concept genesis
        run: python -m unittest tests.test_noncyclic_convergent_concept_genesis -v
