name: ARC3 closed feedback
on:
  push:
    branches: [experiment/arc3-closed-feedback-v1]
    paths:
      - 'experiments/arc3_consequence/closed_feedback.py'
      - 'experiments/arc3_consequence/run_closed_feedback.py'
      - 'tests/test_closed_feedback.py'
      - '.github/workflows/arc3-closed-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install arc-agi==0.9.9
      - name: Exact source and unit qualification
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('experiments/arc3_consequence/closed_feedback.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '54019b6898c7e69ee0ec4505a7a30b962be7d8898438c21b4c9e797f1314cdb9'
          print('SOURCE_REPLAY=PASS')
          PY
          python -m unittest discover -s tests -p test_closed_feedback.py -v
          python -m unittest discover -s tests -p test_terminal_confirmation.py -v
          python -m unittest discover -s tests -p test_consequence_search.py -v
          python -m unittest discover -s tests -p test_parameterized_actions.py -v
          python -m unittest discover -s tests -p test_compositional_development.py -v
          python -m unittest discover -s tests -p test_multi_level_development.py -v
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - uses: actions/download-artifact@v4
        with:
          name: arc3-consequence-search
          run-id: 34192005884
          github-token: ${{ github.token }}
          path: source-evidence
      - name: Check frozen source evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'bt33':'bf8a69009a641fe20d02ee495a2a7ddef76ee1fc88ab42e766ccfe9e333bea99','bt11':'27fd2be09143a57ec42ce26138c1cfb14bffd3cca8fcd34df18ff68c91c8f674'}
          for game,sha in expected.items():
              p=Path('source-evidence/arc3-consequence-search-'+game+'.json')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
          print('SOURCE_EVIDENCE=PASS')
          PY
      - name: Run actual second-game feedback ablation
        run: |
          python experiments/arc3_consequence/run_closed_feedback.py \
            --game bt33-a7c3f9d18b4e \
            --evidence source-evidence/arc3-consequence-search-bt33.json \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-training-actions 10000 --max-episodes 1024 \
            --max-depth 32 --stride 8 --max-grounded-actions 256 \
            --output arc3-closed-feedback-bt33.json
      - name: Preserve frozen positive control
        run: |
          python experiments/arc3_consequence/run_closed_feedback.py \
            --game bt11-fd9df0622a1a \
            --evidence source-evidence/arc3-consequence-search-bt11.json \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-training-actions 10000 --max-episodes 1024 \
            --max-depth 32 --stride 8 --max-grounded-actions 256 \
            --output arc3-closed-feedback-bt11.json
      - name: Check evidence and scientific status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for game in ('bt33','bt11'):
              d=json.loads(Path('arc3-closed-feedback-'+game+'.json').read_text())
              assert d['status']=='COMPARABLE'
              assert d['model_calls']==0 and not d['competition_submission']
              for arm in d['arms'].values():
                  assert arm['development']['training_actions'] <= d['bounds']['max_training_actions']
                  assert arm['development']['training_episodes'] <= d['bounds']['max_episodes']
                  assert arm['deployment']['actions'] <= d['bounds']['budget']
                  if arm['verified_win']:assert arm['deployment']['state']=='WIN'
              if game=='bt11':
                  assert all(a['verified_win'] and a['deployment']['levels_completed']==5 for a in d['arms'].values())
              print(game,'SCIENTIFIC_STATUS='+str(d['improved']))
          print('CLOSED_FEEDBACK_QUALIFICATION=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-closed-feedback
          path: arc3-closed-feedback-*.json
          if-no-files-found: warn
