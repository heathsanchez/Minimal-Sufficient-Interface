name: Lean Mathlib verify merger->root

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build MergerRoot against Mathlib
        working-directory: mathlib
        run: |
          lake update mathlib
          lake exe cache get
          lake build MergerRoot
