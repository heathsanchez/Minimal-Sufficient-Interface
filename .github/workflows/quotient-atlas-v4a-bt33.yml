name: Quotient Atlas V4a bt33

on:
  workflow_dispatch:
  push:
    branches: [arc3-quotient-atlas-v4]
    paths:
      - 'kaggle/quotient_atlas_v4_patch.py'
      - '.github/workflows/quotient-atlas-v4a-bt33.yml'

permissions:
  actions: read
  contents: read

jobs:
  bt33:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONUNBUFFERED: "1"
      DUCKTAPE_PROMOTION_POLICY: withheld
      DUCKTAPE_GAME_ID: bt33
      LOCAL_ANALYZER_PROVIDER: openrouter
      LOCAL_ANALYZER_MODEL_ID: Qwen/Qwen3.6-27B
      LOCAL_ANALYZER_MAX_OUTPUT: "4096"
      LOCAL_ANALYZER_CONTEXT_WINDOW: "32768"
      LOCAL_ANALYZER_ENABLE_THINKING: "true"
      LOCAL_ANALYZER_TEMPERATURE: "0"
      LOCAL_ANALYZER_TOP_P: "1"
      LOCAL_ANALYZER_TOOL_STEPS: "12"
      LOCAL_ANALYZER_TOOL_TIMEOUT: "30"
      LOCAL_ANALYZER_TOOL_OUTPUT_TOKENS: "1024"
      LOCAL_ANALYZER_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Require funded OpenRouter credential
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY_MISSING"; exit 2; }
          echo "OPENROUTER_API_KEY_PRESENT=PASS"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: vendor/ARC-AGI
      - name: Apply V4a stack
        run: |
          python kaggle/ducktape_metatron_patch.py --root vendor/duck-harness/ARC3-Inference
          python kaggle/flash_ducktape_patch.py --root vendor/duck-harness/ARC3-Inference
          python kaggle/consequence_nucleus_patch.py --root vendor/duck-harness/ARC3-Inference
          python kaggle/consequence_first_leaderboard_patch.py --root vendor/duck-harness/ARC3-Inference
          python kaggle/quotient_atlas_v4_patch.py --root vendor/duck-harness/ARC3-Inference
          echo "QUOTIENT_ATLAS_V4_STACK=PASS"
      - name: Prepare bt33 fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("vendor/duck-harness/ARC3-Inference/inference/framework/kaggle.py")
          text=p.read_text()
          marker="DUCK_HARNESS_PUBLIC_GAME_IDS: tuple[str, ...] = (\n"
          row='    "bt33-a7c3f9d18b4e",\n'
          if row not in text:
              text=text.replace(marker,marker+row,1)
          p.write_text(text)
          m=Path("vendor/ARC-AGI/test_environment_files/game2/subdir/metadata.json")
          data=json.loads(m.read_text())
          data["baseline_actions"]=[4,8,16,20,24]
          m.write_text(json.dumps(data,indent=2)+"\n")
          print("BT33_FIXTURE=PASS")
          PY
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: |
          uv sync --locked --python "$(command -v python)"
          uv run python - <<'PY'
          from inference.agent.quotient_atlas_v4 import QuotientAtlasV4Agent
          print("QUOTIENT_ATLAS_V4_IMPORT=PASS")
          PY
      - name: Run bt33 V4a
        working-directory: vendor/duck-harness/ARC3-Inference
        run: |
          rm -rf "$GITHUB_WORKSPACE/out"
          START=$(date +%s)
          CONFIG_PATH=configs/inference.openrouter.json \
          EXPERIMENT_DIR="$GITHUB_WORKSPACE/out" \
          ENVIRONMENTS_DIR="$GITHUB_WORKSPACE/vendor/ARC-AGI/test_environment_files" \
          GAME=bt33 \
          N_PASSES=1 \
          CONCURRENT_JOBS=1 \
          MAX_ACTIONS=90 \
          MAX_RUNTIME_MINUTES=12 \
          MODEL=Qwen/Qwen3.6-27B \
          LOCAL_ANALYZER_MODEL_ID=Qwen/Qwen3.6-27B \
          ANALYZER_TIMEOUT=120 \
          RUN_NAME=quotient-atlas-v4a-bt33 \
          make interactive | tee "$GITHUB_WORKSPACE/run.log"
          END=$(date +%s)
          echo $((END-START)) > "$GITHUB_WORKSPACE/wallclock_seconds.txt"
          SCORE_RUN_DIR="$GITHUB_WORKSPACE/out" make score_run | tee "$GITHUB_WORKSPACE/score.log"
      - name: Seal V4a
        if: always()
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          result={"game":"bt33","model":"Qwen/Qwen3.6-27B","score":None,"levels":None,"total_levels":None,
                  "state":None,"actions":None,"reported_tokens":None,"wallclock_seconds":None,
                  "events":{},"request_errors":0,"payment_errors":0,"rate_limit_errors":0}
          p=Path("out/evaluation.json")
          if p.exists():
              d=json.loads(p.read_text())
              if d.get("games"):
                  g=d["games"][0]
                  result["score"]=float(d["score"])
                  result["levels"]=float(g["levels_completed_mean"])
                  result["total_levels"]=int(g["total_levels"])
          p=Path("out/benchmark.json")
          if p.exists():
              d=json.loads(p.read_text()); runs=d.get("game_runs") or []
              if runs:
                  r=runs[0]
                  result["state"]=r.get("state")
                  result["actions"]=len(r.get("history") or [])
                  m=re.search(r"tokens=(\d+)",str(r.get("solver_note") or ""))
                  result["reported_tokens"]=int(m.group(1)) if m else None
          w=Path("wallclock_seconds.txt")
          if w.exists():
              result["wallclock_seconds"]=int(w.read_text().strip())
          log=Path("run.log").read_text(errors="replace") if Path("run.log").exists() else ""
          result["request_errors"]=log.count("analyzer request failed")
          result["payment_errors"]=log.count("402 Client Error")
          result["rate_limit_errors"]=log.count("429 Client Error")
          counts={}
          records=[]
          for lp in Path("out").rglob("ducktape-metatron.jsonl"):
              for line in lp.read_text().splitlines():
                  if not line.strip(): continue
                  obj=json.loads(line); k=str(obj.get("kind"))
                  counts[k]=counts.get(k,0)+1
                  if k in {"ATLAS_STAGE","ATLAS_CAPABILITY","ATLAS_REQUALIFY","TRANSFER_EXECUTE","QUOTIENT_RESIDUAL","MODEL_QUERY"}:
                      records.append(obj)
          result["events"]=counts
          result["key_records"]=records
          result["gate"]={
              "capability_ignited": counts.get("ATLAS_CAPABILITY",0) >= 1,
              "transfer_executed": counts.get("TRANSFER_EXECUTE",0) >= 1,
              "zero_request_errors": result["request_errors"]==0,
              "different_representation_witnesses": any(
                  x.get("kind")=="ATLAS_CAPABILITY" and len(set((x.get("payload") or {}).get("witnesses") or x.get("witnesses") or [])) >= 2
                  for x in records
              ),
          }
          Path("quotient-atlas-v4a-bt33-result.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          print("QUOTIENT_ATLAS_V4A_BT33=COMPLETE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotient-atlas-v4a-bt33
          path: |
            quotient-atlas-v4a-bt33-result.json
            run.log
            score.log
            wallclock_seconds.txt
            out/evaluation.json
            out/benchmark.json
            out/**/ducktape-metatron.jsonl
          if-no-files-found: warn
