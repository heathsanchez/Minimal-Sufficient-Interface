name: ARC3 delayed continuation separator
on:
  push:
    branches: [experiment/arc3-delayed-separator-v1]
    paths:
      - 'experiments/unified_development/arc3_delayed_separator.py'
      - 'experiments/unified_development/test_arc3_delayed_separator.py'
      - '.github/workflows/unified-arc3-delayed-separator.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 68e37033f3ae1e86e992dfe8d982aef9133612aa
          path: frozen-msi
      - name: Prepare immutable controller sources
        run: |
          mkdir -p frozen-src
          cp frozen-msi/experiments/arc3_consequence/{agent,restart_development,multi_level_development,compositional_development,parameterized_actions}.py frozen-src/
          cp frozen-msi/experiments/convergence/finite_consequence.py frozen-src/
      - uses: actions/download-artifact@v4
        with:
          name: arc3-shared-transfer
          run-id: 34240189934
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-evidence
      - uses: actions/download-artifact@v4
        with:
          name: arc3-consequence-search
          run-id: 34192005884
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archive-evidence
      - uses: actions/download-artifact@v4
        with:
          name: arc3-archive-transfer
          run-id: 34272649151
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: transfer-evidence
      - uses: actions/download-artifact@v4
        with:
          name: arc3-stage4-probe
          run-id: 34277495372
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: residual-evidence
      - name: Verify evidence and run regressions
        env:
          MSI_FROZEN_DIR: ${{ github.workspace }}/frozen-src
          MSI_SOURCE_EVIDENCE: ${{ github.workspace }}/source-evidence/arc3-shared-transfer.json
          MSI_ARCHIVE_EVIDENCE: ${{ github.workspace }}/archive-evidence/arc3-consequence-search-bt33.json
          MSI_TRANSFER_EVIDENCE: ${{ github.workspace }}/transfer-evidence/arc3-archive-transfer.json
          MSI_STAGE_EVIDENCE: ${{ github.workspace }}/transfer-evidence/archive-gate/stage-3/evidence.json
          MSI_RESIDUAL_EVIDENCE: ${{ github.workspace }}/residual-evidence/arc3-stage4-probe.json
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            'archive-evidence/arc3-consequence-search-bt33.json':'bf8a69009a641fe20d02ee495a2a7ddef76ee1fc88ab42e766ccfe9e333bea99',
            'transfer-evidence/arc3-archive-transfer.json':'0eba01df78865553b1be566d1544e77ef2d6a5006cb1b312d7c04e8c6c0eff51',
            'residual-evidence/arc3-stage4-probe.json':'9c0ae1e1efbd4cbe269e7b619370a65c579bc25f2a7a83c980800763c2572197'}
          for name,expected in checks.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          PY
          python -m py_compile experiments/unified_development/arc3_delayed_separator.py
          python -m unittest discover -s experiments/unified_development -p test_arc3_delayed_separator.py -v
          python -m unittest discover -s experiments/unified_development -p test_arc3_stage4_separator.py -v
          python -m unittest discover -s experiments/unified_development -p test_arc3_stage4_probe.py -v
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Test real-game continuation consequences
        env:
          MSI_FROZEN_DIR: ${{ github.workspace }}/frozen-src
        run: |
          python experiments/unified_development/arc3_delayed_separator.py \
            --source-evidence source-evidence/arc3-shared-transfer.json \
            --archive-evidence archive-evidence/arc3-consequence-search-bt33.json \
            --transfer-evidence transfer-evidence/arc3-archive-transfer.json \
            --stage-evidence transfer-evidence/archive-gate/stage-3/evidence.json \
            --residual-evidence residual-evidence/arc3-stage4-probe.json \
            --frozen-dir frozen-src \
            --environments-dir upstream-arc-agi/test_environment_files \
            --game bt33-a7c3f9d18b4e \
            --output arc3-delayed-separator.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('arc3-delayed-separator.json').read_text())
          assert r['model_calls']==0 and not r['competition_submission']
          assert r['training_actions']<=1200 and r['training_episodes']<=64
          assert r['source_run']==34240189934 and r['archive_run']==34192005884
          assert r['transfer_run']==34272649151 and r['residual_run']==34277495372
          assert r['archived_levels']==3 and r['new_discoveries']==0
          assert r['installed_options']==0 and not r['terminal_win']
          assert r['status'] in ('REPLAY_CONFIRMED_SEPARATOR','NO_SEPARATOR_WITHIN_BOUND','TRAINING_BOUND_EXHAUSTED','INCONCLUSIVE_REPLAY','INCONCLUSIVE_CONFIRMATION','INCONCLUSIVE_CONFIRMATION_BUDGET')
          if r['status']=='REPLAY_CONFIRMED_SEPARATOR':
              assert r['witnesses'] and r['witnesses'][0]['first_divergence']>=2
          print('ARC3_DELAYED_SEPARATOR_QUALIFICATION='+json.dumps({k:r.get(k) for k in ('status','training_actions','training_episodes','diagnostic_actions','attempted_pairs','archived_levels','new_discoveries')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-delayed-separator
          path: arc3-delayed-separator.json
          if-no-files-found: warn
