name: ARC3 QCKN Flash Multigame V2

on:
  push:
    branches: [arc3-qckn-flash-multigame-v2]
    paths:
      - 'kaggle/src/metalogic_arc3/flash_*.py'
      - 'kaggle/tests/test_flash_compiler.py'
      - 'kaggle/scripts/arc3_flash_multigame_v2.py'
      - '.github/workflows/arc3-qckn-flash-multigame-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pinned retained artifacts
        run: |
          test "$(gh api repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10564626208 --jq .digest)" = "sha256:22748bb909fae8087e90bc51bd26780466dd153dd1974782515e676d0d24bd05"
          test "$(gh api repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10569651788 --jq .digest)" = "sha256:4e00a55675ea50c5f5b772b670d8651345ef712a053b4e7c283423b448fabdc2"

      - name: Reuse exact evidence without reacquisition
        run: |
          mkdir -p kaggle/flash-v2-inputs/ft09 kaggle/flash-v2-inputs/v2 kaggle/qckn-flash-multigame-v2-results
          gh run download 35387362885 -R heathsanchez/Minimal-Sufficient-Interface -n arc3-ft09-fatal-basin-certificate -D kaggle/flash-v2-inputs/ft09
          gh run download 35398347557 -R heathsanchez/Minimal-Sufficient-Interface -n arc3-global-flash-closure-v2 -D kaggle/flash-v2-inputs/v2

      - name: Flash compiler contracts
        env:
          PYTHONPATH: kaggle/src
        run: python -m unittest discover -s kaggle/tests -p 'test_flash_compiler.py' -v

      - name: Run online refutation compounding control
        env:
          PYTHONPATH: kaggle/src
        run: |
          python -u kaggle/scripts/arc3_flash_multigame_v2.py             --ft09-dir kaggle/flash-v2-inputs/ft09             --v2-dir kaggle/flash-v2-inputs/v2             --out kaggle/qckn-flash-multigame-v2-results

      - name: Qualification
        run: |
          python - <<'PY'
          import json
          p='kaggle/qckn-flash-multigame-v2-results/online-refutation.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_ONLINE_REFUTATION_COMPOUNDING'
          assert r['independent']['destination_verifier_calls']==8
          assert r['flash']['destination_verifier_calls']==1
          assert r['flash']['upfront_blocked'] is False
          assert r['ablation']['destination_verifier_calls']==8
          assert r['delta']['destination_verifier_calls_eliminated']==7
          print('QCKN_FLASH_MULTIGAME_V2_QUALIFIED=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-qckn-flash-multigame-v2
          path: |
            kaggle/qckn-flash-multigame-v2-results/
            kaggle/src/metalogic_arc3/flash_ledger.py
            kaggle/src/metalogic_arc3/flash_closure.py
            kaggle/tests/test_flash_compiler.py
            kaggle/scripts/arc3_flash_multigame_v2.py
          if-no-files-found: error
