name: Finite Executable Distinguishing Future

on:
  push:
    branches:
      - purify-developmental-kernel-v1
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependency certificates
        env:
          LEAN_PATH: formal
        run: |
          lean -o formal/IdentityForcedAsMinimalCompletion.olean formal/IdentityForcedAsMinimalCompletion.lean
          lean -o formal/FailureForcesIdentityCompletion.olean formal/FailureForcesIdentityCompletion.lean
          lean -o formal/FailureForcesCompositionCompletion.olean formal/FailureForcesCompositionCompletion.lean
          lean -o formal/GenericVerifiedCompletionKernel.olean formal/GenericVerifiedCompletionKernel.lean
          lean -o formal/RequirementLandscapeCompletion.olean formal/RequirementLandscapeCompletion.lean
          lean -o formal/ConsequentialCompletionCoupling.olean formal/ConsequentialCompletionCoupling.lean
          lean -o formal/VerifierDoesNotDeterminePointwiseRequirement.olean formal/VerifierDoesNotDeterminePointwiseRequirement.lean
          lean -o formal/BehavioralRepairVersionSpace.olean formal/BehavioralRepairVersionSpace.lean
          lean -o formal/AmbiguityGeneratesDistinguishingExperiment.olean formal/AmbiguityGeneratesDistinguishingExperiment.lean
          lean -o formal/InequivalenceForcesDistinguishingFuture.olean formal/InequivalenceForcesDistinguishingFuture.lean
      - name: Check finite executable distinguishing future
        env:
          LEAN_PATH: formal
        run: |
          lean formal/FiniteExecutableDistinguishingFuture.lean
          echo "FINITE_CERTIFIED_FUTURE_INTERFACE=PASS"
          echo "EXECUTABLE_RECURSIVE_SEPARATOR_SEARCH=PASS"
          echo "RETURNED_SEPARATOR_SOUND=PASS"
          echo "FINITE_SEARCH_COMPLETE=PASS"
          echo "CLASSICAL_CHOICE_REMOVED_FROM_GENERATOR=PASS"
          echo "SEMANTIC_INEQUIVALENCE_FORCES_COMPUTED_SEPARATOR=PASS"
          echo "EXTERNAL_OUTCOME_DECIDES_PAIR=PASS"
          echo "WITNESS_COMPUTES_ALPHA=PASS"
          echo "PURIFICATION_CYCLE_9=PASS"
