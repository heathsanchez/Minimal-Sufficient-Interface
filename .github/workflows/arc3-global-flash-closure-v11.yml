name: ARC3 Global Flash Closure V11
on:
  push:
    branches: [arc3-global-flash-closure-v11]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-global-flash-closure-v11.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arc3-global-flash-closure-v11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flash-closure-v11:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify frozen MG-ARC5
        run: |
          mkdir -p kaggle/global-flash-closure-results/inputs
          python kaggle/scripts/build_agent.py --output kaggle/global-flash-closure-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/global-flash-closure-results/agent.py' | sha256sum --check
          python -m py_compile             kaggle/scripts/global_flash_closure_v7.py             kaggle/scripts/global_flash_closure_v10.py             kaggle/scripts/global_flash_closure_v11.py             kaggle/src/metalogic_arc3/flash_ledger.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/global-flash-closure-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Fetch and verify ft09 negative capability
        run: |
          gh api /repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10564626208/zip > /tmp/ft09-fatal.zip
          echo '22748bb909fae8087e90bc51bd26780466dd153dd1974782515e676d0d24bd05  /tmp/ft09-fatal.zip' | sha256sum --check
          unzip -j /tmp/ft09-fatal.zip '*/ft09-fatal-basin-certificate.json' -d kaggle/global-flash-closure-results/inputs
      - name: Prepare exact public three-game bundle
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/global-flash-closure-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20,ft09,vc33',
              environments_dir='kaggle/global-flash-closure-results/envs',
              manifest='kaggle/global-flash-closure-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Run equal-outcome Flash V11 acquisition test
        run: python -u kaggle/scripts/global_flash_closure_v11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-global-flash-closure-v11
          path: |
            kaggle/global-flash-closure-results/
            kaggle/scripts/global_flash_closure_v7.py
            kaggle/scripts/global_flash_closure_v10.py
            kaggle/scripts/global_flash_closure_v11.py
          if-no-files-found: warn
