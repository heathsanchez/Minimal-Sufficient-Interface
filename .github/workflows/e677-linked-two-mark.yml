name: E677 linked two-mark size-free probe

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-two-mark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate authoritative frontier
        run: python frontier_contract.py
      - name: Route from authoritative residual
        id: router
        run: python frontier_router.py --github-output
      - name: Record non-applicability
        if: steps.router.outputs.route != 'SIZE_FREE_RENEWAL'
        run: echo "LINKED_TWO_MARK_SKIPPED_ROUTE=${{ steps.router.outputs.route }}"
      - name: Install exact solver
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: pip install z3-solver
      - name: Compile linked probe
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python -m py_compile e677_linked_two_mark_probe.py
      - name: Run linked two-mark test
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python e677_linked_two_mark_probe.py
      - name: Verify classified transition
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/e677_linked_two_mark_probe.json'))
          assert x['named_elements']==19
          assert x['named_bad_inputs']==9
          assert x['ground_e677_pair_count']==361
          assert x['no_fixer_instance_count']==171
          for b in ('ZIPPER','GCROSS'):
              assert x['results'][b]['shell']=='sat'
              assert x['results'][b]['mixed'] in {'sat','unsat'}
          assert x['finite_magma_claimed'] is False
          assert x['counterexample_claimed'] is False
          assert x['global_e677_implication_claimed'] is False
          assert x['proposed_transition']['classification'] in {'PROMOTE','PARK'}
          print('TWO_MARK_ZIPPER='+x['results']['ZIPPER']['mixed'])
          print('TWO_MARK_GCROSS='+x['results']['GCROSS']['mixed'])
          print('TWO_MARK_TRANSITION='+x['proposed_transition']['classification'])
          print('TWO_MARK_RESIDUAL='+x['proposed_transition']['residual'])
          print('LINKED_TWO_MARK_TRANSITION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        with:
          name: e677-linked-two-mark
          path: artifacts/e677_linked_two_mark_probe.json
