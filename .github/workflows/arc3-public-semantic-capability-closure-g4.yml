name: ARC3 Public Semantic Capability Closure G4

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-semantic-capability-closure-g4]
    paths:
      - 'kaggle/src/metalogic_arc3/semantic_path.py'
      - 'kaggle/tests/test_semantic_path.py'
      - 'experiments/arc3_public_online_path_capability_g3.py'
      - '.github/workflows/arc3-public-semantic-capability-closure-g4.yml'

permissions:
  contents: read

concurrency:
  group: arc3-public-semantic-capability-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Test typed capability closure and generated agent
        run: >-
          PYTHONPATH=kaggle/src python -m unittest
          kaggle.tests.test_semantic_path kaggle.tests.test_build_agent -v
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root = Path(os.environ["ENV_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          arcade = Arcade(operation_mode=OperationMode.NORMAL, environments_dir=str(root))
          env = arcade.make(os.environ["GAME_ID"])
          if env is None:
              raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS", env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Replay G3 twice and close successor interfaces
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-semantic-capability-closure-g4
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_online_path_capability_g3.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-semantic-capability-closure-g4.log"
          grep 'ARC3_PUBLIC_ONLINE_PATH_CAPABILITY_G3=PROMOTED' \
            "$GITHUB_WORKSPACE/arc3-public-semantic-capability-closure-g4.log"
      - name: Seal exact claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(
              "evidence/arc3-public-semantic-capability-closure-g4/result.json"
          ).read_text())
          assert result["status"] == "PROMOTED"
          assert result["model_calls"] == 0
          assert result["source_inspection"] is False
          assert result["successor_interface_status"] == "EXACT_RESIDUAL"
          assert result["successor_missing_interface"] == "shape.subcell-docking-pose@1"
          assert len(result["replays"]) == 2
          for replay in result["replays"]:
              assert replay["progressed"]
              assert replay["path"] == "URRRUR"
              assert replay["action_count"] <= result["action_budget"]
              closure = replay["successor_closure"]
              assert closure["closed_interfaces"] == [
                  "observation.current-frame@1",
                  "board.tiled-grid@1",
              ]
              assert closure["residual"] == {
                  "missing_interface": "shape.subcell-docking-pose@1",
                  "reason": "subcell_docking_geometry",
              }
          print("ARC3_PUBLIC_SEMANTIC_CAPABILITY_CLOSURE_G4=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-semantic-capability-closure-g4
          path: |
            evidence/arc3-public-semantic-capability-closure-g4/result.json
            arc3-public-semantic-capability-closure-g4.log
          if-no-files-found: error
