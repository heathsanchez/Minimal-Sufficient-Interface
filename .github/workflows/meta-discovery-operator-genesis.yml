name: meta discovery operator genesis
on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/meta_discovery_operator_genesis.py'
      - '.github/workflows/meta-discovery-operator-genesis.yml'
  workflow_dispatch:
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run recursive method-genesis gate
        run: python experiments/meta_discovery_operator_genesis.py
