name: Verified interface compilation

on:
  push:
    paths:
      - 'tests/test_verified_interface_compilation.py'
      - 'lean/AdderInterfaceCompilation.lean'
      - 'VERIFIED_INTERFACE_COMPILATION.md'
      - '.github/workflows/verified-interface-compilation.yml'
  pull_request:
    paths:
      - 'tests/test_verified_interface_compilation.py'
      - 'lean/AdderInterfaceCompilation.lean'
      - 'VERIFIED_INTERFACE_COMPILATION.md'
      - '.github/workflows/verified-interface-compilation.yml'

permissions:
  contents: read

jobs:
  compile-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Residual-driven synthesis, controls, and recursive census
        run: python -m unittest tests.test_verified_interface_compilation -v
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check generated-interface semantics and recursive composition
        run: lean lean/AdderInterfaceCompilation.lean

