name: Lean External Capability Synthesis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  external-capability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Budgeted capability synthesis from learned interface
        env:
          PYTHONPATH: experiments
        run: python experiments/lean_external_capability_synthesis.py
