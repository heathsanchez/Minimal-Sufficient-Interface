name: ARC3 action quotient transfer
on:
  push:
    branches: [arc3-action-quotient-transfer-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-action-quotient-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-action-quotient-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/action-quotient-transfer-results
          python kaggle/scripts/build_agent.py --output kaggle/action-quotient-transfer-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/action-quotient-transfer-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/action_quotient_transfer.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/action-quotient-transfer-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ft09 world
        run: |
          mkdir -p kaggle/agent
          cp kaggle/action-quotient-transfer-results/agent.py kaggle/agent/my_agent.py
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ft09',
              environments_dir='kaggle/action-quotient-transfer-results/envs',
              manifest='kaggle/action-quotient-transfer-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Learn on two states and test eight held states
        run: python -u kaggle/scripts/action_quotient_transfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-action-quotient-transfer
          path: |
            kaggle/action-quotient-transfer-results/
            kaggle/scripts/action_quotient_transfer.py
            kaggle/scripts/action_quotient_diagnostic.py
          if-no-files-found: warn
