name: ARC3 ls20 Level-1 deep frontier V2
on:
  push:
    branches: [arc3-ls20-level1-deep-frontier-v2]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-ls20-level1-deep-frontier-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arc3-ls20-level1-deep-frontier-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deep-frontier-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/ls20-level1-deep-frontier-v2-results
          python kaggle/scripts/build_agent.py --output kaggle/ls20-level1-deep-frontier-v2-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/ls20-level1-deep-frontier-v2-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/ls20_level1_targeted_frontier.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/ls20-level1-deep-frontier-v2-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ls20 world
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/ls20-level1-deep-frontier-v2-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20',
              environments_dir='kaggle/ls20-level1-deep-frontier-v2-results/envs',
              manifest='kaggle/ls20-level1-deep-frontier-v2-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Download and verify retained deep-frontier ledger
        run: |
          gh api /repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10563060745/zip > /tmp/deep.zip
          echo '48d10be00dce5b4bd9de77bfb4c5650bad936c6d3c9dc23b6fb103e38fe6e4a8  /tmp/deep.zip' | sha256sum --check
          mkdir -p /tmp/deep
          unzip -q /tmp/deep.zip -d /tmp/deep
          cp /tmp/deep/ls20-level1-deep-frontier-results/deep-frontier-exact-replay-ledger.json kaggle/ls20-level1-deep-frontier-v2-results/level-compounded-exact-replay-ledger.json
      - name: Probe deepest frontier with compiled shortest replay routes
        run: python -u kaggle/scripts/ls20_level1_targeted_frontier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-ls20-level1-deep-frontier-v2
          path: |
            kaggle/ls20-level1-deep-frontier-v2-results/
            kaggle/scripts/ls20_level1_targeted_frontier.py
          if-no-files-found: warn
