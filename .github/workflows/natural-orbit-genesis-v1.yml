name: natural orbit genesis v1

on:
  push:
    branches: [natural-orbit-genesis-v1]
    paths:
      - 'experiments/natural_orbit_genesis_v1.py'
      - '.github/workflows/natural-orbit-genesis-v1.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen natural-domain gate
        run: python experiments/natural_orbit_genesis_v1.py
