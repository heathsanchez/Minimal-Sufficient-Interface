name: ARC3 parameterized actions
on:
  push:
    branches: [experiment/arc3-parameterized-actions-v1]
    paths:
      - '.github/workflows/arc3-parameterized-actions.yml'
      - 'experiments/arc3_consequence/parameterized_actions.py'
      - 'experiments/arc3_consequence/run_parameterized.py'
      - 'tests/test_parameterized_actions.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - name: Test action grounding and frozen controller
        run: |
          python -m unittest discover -s tests -p test_parameterized_actions.py -v
          python -m unittest discover -s tests -p test_compositional_development.py -v
          python -m unittest discover -s tests -p test_multi_level_development.py -v
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Run second-game development and fresh-start ablation
        run: |
          python experiments/arc3_consequence/run_parameterized.py \
            --game bt33-a7c3f9d18b4e \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-episodes 512 --max-depth 32 \
            --max-training-actions 3000 --max-levels 3 \
            --stride 8 --max-grounded-actions 256 \
            --output arc3-parameterized.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('arc3-parameterized.json').read_text())
          assert r['status'] in ('COMPARABLE','INCONCLUSIVE_UNMATCHED_START','UNSUPPORTED_ACTION_INTERFACE')
          assert r['model_calls']==0
          print('PARAMETERIZED_QUALIFICATION='+json.dumps({k:r[k] for k in ('status','improved','development','grounded_actions','unsupported_action_ids')},sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-parameterized
          path: arc3-parameterized.json
