name: ARC3 causal affordance
on:
  push:
    branches: [arc3-causal-affordance-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-causal-affordance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ARC contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
