name: ARC3 Public G5 Multicolor Endpoint

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-g5-multicolor-overlay]
    paths:
      - 'kaggle/src/metalogic_arc3/semantic_path.py'
      - 'kaggle/tests/test_semantic_path.py'
      - 'experiments/arc3_public_g5_factorized_docking.py'
      - 'experiments/arc3_public_online_multicolor_g5.py'
      - '.github/workflows/arc3-public-g5-multicolor-endpoint.yml'

permissions:
  contents: read

concurrency:
  group: arc3-public-g5-multicolor-endpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Test generated capability
        run: PYTHONPATH=kaggle/src python -m unittest discover -s kaggle/tests -v
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root = Path(os.environ["ENV_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          arcade = Arcade(operation_mode=OperationMode.NORMAL, environments_dir=str(root))
          env = arcade.make(os.environ["GAME_ID"])
          if env is None:
              raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS", env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Qualify G5 semantics and replay G1 through G5 twice
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          PYTHONPATH: ${{ github.workspace }}/kaggle/src:${{ github.workspace }}/experiments
        run: |
          OUTDIR="$GITHUB_WORKSPACE/evidence/arc3-public-g5-factorized-docking" \
            uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_g5_factorized_docking.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-g5-factorized-docking.log"
          grep 'ARC3_PUBLIC_G5_FACTORIZED_DOCKING=PROMOTED' \
            "$GITHUB_WORKSPACE/arc3-public-g5-factorized-docking.log"
          OUTDIR="$GITHUB_WORKSPACE/evidence/arc3-public-online-multicolor-g5" \
            uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_online_multicolor_g5.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-online-multicolor-g5.log"
          grep 'ARC3_PUBLIC_ONLINE_MULTICOLOR_G5=PROMOTED' \
            "$GITHUB_WORKSPACE/arc3-public-online-multicolor-g5.log"
      - name: Seal exact claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(
              "evidence/arc3-public-online-multicolor-g5/result.json"
          ).read_text())
          assert result["status"] == "PROMOTED"
          assert result["model_calls"] == 0
          assert result["source_inspection"] is False
          assert len(result["replays"]) == 2
          for replay in result["replays"]:
              assert replay["progressed"]
              assert replay["paths"] == ["URRRUR", "ILDDDD", "XDDDTS"]
              assert replay["g5_probe_ports"] == [None, None, None, None, 1]
              assert replay["level"] == 5
              assert replay["successor_closure"] == {
                  "closed_interfaces": [
                      "observation.current-frame@1",
                      "board.tiled-grid@1",
                      "shape.docking-translation@1",
                      "board.route-problem@1",
                  ],
                  "plan": None,
                  "residual": {
                      "missing_interface": "control.direction-role@1",
                      "reason": "selector_direction_geometry",
                  },
              }
          print("ARC3_PUBLIC_G5_MULTICOLOR_ENDPOINT=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-g5-multicolor-endpoint
          path: |
            evidence/arc3-public-g5-factorized-docking/result.json
            evidence/arc3-public-online-multicolor-g5/result.json
            arc3-public-g5-factorized-docking.log
            arc3-public-online-multicolor-g5.log
          if-no-files-found: error
