name: natural orbit recursive genesis v3

on:
  push:
    branches: [natural-orbit-genesis-v1]
    paths:
      - 'experiments/natural_orbit_recursive_genesis_v3.py'
      - '.github/workflows/natural-orbit-recursive-genesis-v3.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run raw-observation recursive physics gate
        run: python experiments/natural_orbit_recursive_genesis_v3.py
