name: Lean External Task-Only Genesis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  external-lean-genesis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: External Lean task-only latent interface genesis
        run: python experiments/lean_external_task_only_genesis.py
