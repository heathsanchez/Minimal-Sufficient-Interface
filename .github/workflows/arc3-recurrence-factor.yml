name: ARC3 recurrence factor
on:
  push:
    branches: [arc3-recurrence-factor-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-recurrence-factor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-recurrence-factor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
      - name: Build standalone candidate and offline notebook
        run: |
          mkdir -p kaggle/recurrence-factor-results
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py kaggle/scripts/recurrence_factor_audit.py
          cp kaggle/agent/my_agent.py kaggle/recurrence-factor-results/candidate.py
          python kaggle/scripts/build_notebook.py
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 07fe94a80edfbb295049d4140aef14ef2b47524b
          path: prior-worktree
      - name: Rebuild and verify exact MG-ARC5 prior
        run: |
          python prior-worktree/kaggle/scripts/build_agent.py --output "$PWD/kaggle/recurrence-factor-results/prior.py"
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/recurrence-factor-results/prior.py' | sha256sum --check
      - name: Install pinned ARC SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/recurrence-factor-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Freeze identical worlds before evaluation
        run: python kaggle/scripts/recurrence_factor_audit.py prepare
      - name: Run MG-ARC8, exact MG-ARC5 prior and no-factor ablation
        run: python kaggle/scripts/recurrence_factor_audit.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-recurrence-factor
          path: |
            kaggle/recurrence-factor-results/
            kaggle/agent/my_agent.py
            kaggle/notebooks/submission.ipynb
            kaggle/src/
            kaggle/scripts/
            kaggle/tests/
            kaggle/provenance/
          if-no-files-found: warn
