name: E677 FORK G-CROSS unique-fixer attachment

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unique-fixer-attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate authoritative frontier
        run: python frontier_contract.py
      - name: Route from authoritative residual
        id: router
        run: python frontier_router.py --github-output
      - name: Record non-applicability
        if: steps.router.outputs.route != 'SIZE_FREE_RENEWAL'
        run: echo "UNIQUE_FIXER_ATTACHMENT_SKIPPED_ROUTE=${{ steps.router.outputs.route }}"
      - name: Install exact solver
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: pip install z3-solver
      - name: Compile probes
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python -m py_compile e677_fork_gcross_ground_e677_probe.py e677_fork_gcross_unique_fixer_attachment_probe.py
      - name: Test unique-fixer attachment
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python e677_fork_gcross_unique_fixer_attachment_probe.py
      - name: Verify classified transition
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/e677_fork_gcross_unique_fixer_attachment_probe.json'))
          assert x['previous_single_mark_replay']=='sat'
          assert x['no_fixer_shell_only']=='sat'
          assert x['no_fixer_instance_count']==66
          assert x['ground_e677_pair_count']==121
          assert x['finite_magma_claimed'] is False
          assert x['counterexample_claimed'] is False
          assert x['global_e677_implication_claimed'] is False
          assert x['proposed_transition']['classification'] in {'PROMOTE','PARK'}
          print('UNIQUE_FIXER_ATTACHED_RESULT='+x['unique_fixer_attached_result'])
          print('UNIQUE_FIXER_TRANSITION='+x['proposed_transition']['classification'])
          print('UNIQUE_FIXER_RESIDUAL='+x['proposed_transition']['residual'])
          print('UNIQUE_FIXER_ATTACHMENT_TRANSITION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        with:
          name: e677-fork-gcross-unique-fixer
          path: artifacts/e677_fork_gcross_unique_fixer_attachment_probe.json
