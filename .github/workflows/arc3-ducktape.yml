name: ARC3 DuckTape qualification
on:
  push:
    branches: [arc3-ducktape-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-ducktape.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove DuckTape never pays twice
        run: |
          python -m unittest             kaggle.tests.test_memory_controller.MemoryGraphControllerContracts.test_ducktape_never_pays_twice_for_known_terminal_leaf             -v
          echo 'DUCKTAPE_NEVER_PAY_TWICE=PASS'

      - name: Run complete Kaggle contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v

      - name: Build self-contained DuckTape agent
        run: |
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py
          grep -q 'DUCKTAPE-ARC3' kaggle/agent/my_agent.py
          grep -q 'ducktape-v1' kaggle/agent/my_agent.py
          cp kaggle/agent/my_agent.py /tmp/ducktape-agent.py
          echo 'DUCKTAPE_BUNDLE=PASS'

      - name: Build offline CPU notebook
        run: python kaggle/scripts/build_notebook.py

      - name: Inspect offline bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          agent = Path('kaggle/agent/my_agent.py').read_text()
          nb = json.loads(Path('kaggle/notebooks/submission.ipynb').read_text())
          assert 'class MyAgent' in agent
          assert 'class ArcMemoryGraph' in agent
          assert 'DUCKTAPE-ARC3' in agent
          assert 'self._log: Log' in agent
          lower = agent.lower()
          for forbidden in ('requests', 'openai', 'anthropic', 'subprocess', 'socket', 'urllib'):
              assert forbidden not in lower, forbidden
          k = nb['metadata']['kaggle']
          assert k['accelerator'] == 'none'
          assert k['isInternetEnabled'] is False
          assert k['isGpuEnabled'] is False
          print('DUCKTAPE_OFFLINE_BUNDLE=PASS')
          PY

      - name: Install pinned ARC runtime
        run: python -m pip install arc-agi==0.9.9 python-dotenv

      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents

      - name: Slim official framework imports
        run: python kaggle/scripts/slim_framework.py

      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi

      - name: Public ARC non-regression - bt33
        run: |
          cp /tmp/ducktape-agent.py kaggle/agent/my_agent.py
          python kaggle/scripts/play_local.py             --offline-environments-dir upstream-arc-agi/test_environment_files             --game bt33-a7c3f9d18b4e             --max-steps 32 | tee ducktape-bt33.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' ducktape-bt33.log
          levels="$(grep -o 'MAX_LEVELS_REACHED=[0-9]*' ducktape-bt33.log | tail -1 | cut -d= -f2)"
          test -n "$levels"
          test "$levels" -ge 3
          echo "DUCKTAPE_BT33_LEVELS=$levels"
          echo 'DUCKTAPE_PUBLIC_BT33=PASS'

      - name: Public causal knockout - bt11 without DuckTape
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kaggle/agent/my_agent.py')
          text = Path('/tmp/ducktape-agent.py').read_text()
          needle = 'self.controller = MemoryGraphController(action_ids)'
          replacement = 'self.controller = MemoryGraphController(action_ids, preserve_memory=False)'
          assert text.count(needle) == 1
          p.write_text(text.replace(needle, replacement, 1))
          PY
          python kaggle/scripts/play_local.py             --offline-environments-dir upstream-arc-agi/test_environment_files             --game bt11-fd9df0622a1a             --max-steps 128 | tee ducktape-ablation-bt11.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' ducktape-ablation-bt11.log
          ablation_levels="$(grep -o 'MAX_LEVELS_REACHED=[0-9]*' ducktape-ablation-bt11.log | tail -1 | cut -d= -f2)"
          test -n "$ablation_levels"
          echo "DUCKTAPE_ABLATION_BT11_LEVELS=$ablation_levels"
          echo "$ablation_levels" > /tmp/ducktape-ablation-levels

      - name: Public causal positive - bt11 with DuckTape
        run: |
          cp /tmp/ducktape-agent.py kaggle/agent/my_agent.py
          python kaggle/scripts/play_local.py             --offline-environments-dir upstream-arc-agi/test_environment_files             --game bt11-fd9df0622a1a             --max-steps 128 | tee ducktape-bt11.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' ducktape-bt11.log
          levels="$(grep -o 'MAX_LEVELS_REACHED=[0-9]*' ducktape-bt11.log | tail -1 | cut -d= -f2)"
          ablation_levels="$(cat /tmp/ducktape-ablation-levels)"
          test -n "$levels"
          test "$levels" -gt "$ablation_levels"
          echo "DUCKTAPE_BT11_LEVELS=$levels"
          echo "DUCKTAPE_CAUSAL_GAIN_LEVELS=$((levels - ablation_levels))"
          echo 'DUCKTAPE_PUBLIC_CAUSAL_GAIN=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-ducktape-bundle
          path: |
            kaggle/agent/my_agent.py
            kaggle/notebooks/submission.ipynb
            kaggle/notebooks/kernel-metadata.json
            ducktape-bt33.log
            ducktape-ablation-bt11.log
            ducktape-bt11.log
          if-no-files-found: error
