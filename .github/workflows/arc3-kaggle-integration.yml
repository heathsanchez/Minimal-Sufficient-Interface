name: ARC3 Kaggle integration
on:
  push:
    branches: [arc3-kaggle-integration-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-kaggle-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run integration contracts
        run: python -m unittest discover -s kaggle/tests -p 'test_*.py' -v
      - name: Build self-contained agent
        run: |
          python kaggle/scripts/build_agent.py
          python -m py_compile kaggle/agent/my_agent.py
      - name: Build offline CPU notebook
        run: python kaggle/scripts/build_notebook.py
      - name: Inspect generated bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          agent = Path('kaggle/agent/my_agent.py').read_text()
          nb = json.loads(Path('kaggle/notebooks/submission.ipynb').read_text())
          meta = json.loads(Path('kaggle/notebooks/kernel-metadata.json').read_text())
          assert 'class MyAgent' in agent
          assert 'class OnlineController' in agent
          assert 'class ArchivedCapability' in agent
          assert 'BUILD_PROVENANCE' in agent
          lower = agent.lower()
          for forbidden in ('requests', 'openai', 'anthropic', 'subprocess', 'socket', 'urllib'):
              assert forbidden not in lower, forbidden
          k = nb['metadata']['kaggle']
          assert k['accelerator'] == 'none'
          assert k['isInternetEnabled'] is False
          assert k['isGpuEnabled'] is False
          assert meta['enable_gpu'] is False
          assert meta['enable_internet'] is False
          print('ARC3_KAGGLE_BUNDLE=PASS')
          PY
      - name: Install pinned ARC runtime
        run: python -m pip install arc-agi==0.9.9 python-dotenv
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - name: Slim official framework imports
        run: python kaggle/scripts/slim_framework.py
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Reproduce archived three-level capability and enter Level 4
        run: |
          python kaggle/scripts/play_local.py \
            --offline-environments-dir upstream-arc-agi/test_environment_files \
            --game bt33-a7c3f9d18b4e \
            --max-steps 32 | tee arc3-public-smoke.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' arc3-public-smoke.log
          levels="$(grep -o 'MAX_LEVELS_REACHED=[0-9]*' arc3-public-smoke.log | tail -1 | cut -d= -f2)"
          test -n "$levels"
          test "$levels" -ge 3
          echo 'ARC3_ARCHIVED_THREE_LEVELS=PASS'
          echo 'ARC3_LEVEL4_FRONTIER=PASS'
          echo 'ARC3_GENERATED_AGENT_PUBLIC_ENV=PASS'
      - name: Measure untouched bt11 generalization baseline
        run: |
          python kaggle/scripts/play_local.py \
            --offline-environments-dir upstream-arc-agi/test_environment_files \
            --game bt11-fd9df0622a1a \
            --max-steps 128 | tee arc3-untouched-bt11.log
          grep -q 'ARC3_PUBLIC_SMOKE=PASS' arc3-untouched-bt11.log
          bt11_levels="$(grep -o 'MAX_LEVELS_REACHED=[0-9]*' arc3-untouched-bt11.log | tail -1 | cut -d= -f2)"
          test -n "$bt11_levels"
          echo "ARC3_UNTOUCHED_BT11_LEVELS=$bt11_levels"
          echo 'ARC3_UNTOUCHED_BT11_EXECUTED=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-kaggle-bundle
          path: |
            kaggle/agent/my_agent.py
            kaggle/notebooks/submission.ipynb
            kaggle/notebooks/kernel-metadata.json
            kaggle/provenance/sources.json
            arc3-public-smoke.log
            arc3-untouched-bt11.log
          if-no-files-found: error
