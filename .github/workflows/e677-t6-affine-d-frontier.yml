name: E677 T6 affine D frontier

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affine-d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate authoritative frontier first
        run: python frontier_contract.py
      - name: Route from authoritative residual
        id: router
        run: python frontier_router.py --github-output
      - name: Record clean non-applicability
        if: steps.router.outputs.route != 'AFFINE_D'
        run: echo "AFFINE_WORKFLOW_SKIPPED_ROUTE=${{ steps.router.outputs.route }}"
      - name: Compile affine frontier probe
        if: steps.router.outputs.route == 'AFFINE_D'
        run: python -m py_compile phase_T6_affine_D_frontier_probe.py
      - name: Test remaining affine D class
        if: steps.router.outputs.route == 'AFFINE_D'
        run: python phase_T6_affine_D_frontier_probe.py
      - name: Verify affine transition
        if: steps.router.outputs.route == 'AFFINE_D'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/phase_T6_affine_D_frontier_probe.json'))
          assert x['affine_labelled_maps']==42 and x['normalized_affine_D_count']==6
          assert x['phase_states']==141 and x['normalized_D_phase_pairs']==846
          assert x['full_seven_row_core_claimed'] is False and x['e677_implication_solved_claimed'] is False
          assert x['proposed_transition']['classification'] in {'PROMOTE','REQUIRE_ATTACHMENT'}
          print('AFFINE_FRONTIER_TRANSITION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.router.outputs.route == 'AFFINE_D'
        with:
          name: e677-t6-affine-d-frontier
          path: artifacts/phase_T6_affine_D_frontier_probe.json
