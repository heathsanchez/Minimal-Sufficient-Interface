name: E677 FORK G-CROSS ground E677

on:
  push:
    branches: [recursive-discovery-compiler-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-gcross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate authoritative frontier
        run: python frontier_contract.py
      - name: Route from authoritative residual
        id: router
        run: python frontier_router.py --github-output
      - name: Record non-applicability
        if: steps.router.outputs.route != 'SIZE_FREE_RENEWAL'
        run: echo "FORK_GCROSS_SKIPPED_ROUTE=${{ steps.router.outputs.route }}"
      - name: Install exact solver
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: pip install z3-solver
      - name: Compile probe
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python -m py_compile e677_fork_gcross_ground_e677_probe.py
      - name: Run exact ground consequence test
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: python e677_fork_gcross_ground_e677_probe.py
      - name: Verify classified transition
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/e677_fork_gcross_ground_e677_probe.json'))
          assert x['base_shell']=='sat'
          assert x['ground_e677_pair_count']==121
          assert x['finite_magma_claimed'] is False
          assert x['counterexample_claimed'] is False
          assert x['global_e677_implication_claimed'] is False
          assert x['proposed_transition']['classification'] in {'PROMOTE','PARK','REQUIRE_ATTACHMENT'}
          print('FORK_GCROSS_MIXED_RESULT='+x['mixed_result'])
          print('FORK_GCROSS_TRANSITION='+x['proposed_transition']['classification'])
          print('FORK_GCROSS_RESIDUAL='+x['proposed_transition']['residual'])
          print('FORK_GCROSS_TRANSITION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.router.outputs.route == 'SIZE_FREE_RENEWAL'
        with:
          name: e677-fork-gcross-ground-e677
          path: artifacts/e677_fork_gcross_ground_e677_probe.json
