name: ARC3 prefix search extension
on:
  push:
    branches: [experiment/arc3-unrestricted-prefix-search-v1]
    paths: [.github/workflows/arc3-prefix-search-extension.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Run unchanged search with extended resource bound
        run: |
          python experiments/arc3_consequence/run_parameterized.py \
            --game bt33-a7c3f9d18b4e \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --max-episodes 2048 --max-depth 32 \
            --max-training-actions 20000 --max-levels 5 \
            --stride 8 --max-grounded-actions 256 \
            --output arc3-prefix-extension.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('arc3-prefix-extension.json').read_text())
          assert r['model_calls']==0
          assert r['status'] in ('COMPARABLE','INCONCLUSIVE_UNMATCHED_START','UNSUPPORTED_ACTION_INTERFACE')
          print('PREFIX_EXTENSION='+json.dumps({k:r[k] for k in ('status','improved','development','grounded_actions')},sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-prefix-extension
          path: arc3-prefix-extension.json
          if-no-files-found: warn
