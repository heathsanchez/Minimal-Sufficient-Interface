name: ARC3 QCKN Flash Multigame V3

on:
  push:
    branches: [arc3-qckn-flash-multigame-v3]
    paths:
      - 'kaggle/src/metalogic_arc3/flash_*.py'
      - 'kaggle/tests/test_flash_compiler.py'
      - 'kaggle/scripts/arc3_flash_multigame_v2.py'
      - 'kaggle/scripts/arc3_flash_multigame_v3.py'
      - '.github/workflows/arc3-qckn-flash-multigame-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned retained artifacts
        run: |
          test "$(gh api repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10564626208 --jq .digest)" = "sha256:22748bb909fae8087e90bc51bd26780466dd153dd1974782515e676d0d24bd05"
          test "$(gh api repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10569651788 --jq .digest)" = "sha256:4e00a55675ea50c5f5b772b670d8651345ef712a053b4e7c283423b448fabdc2"
      - name: Reuse exact evidence without reacquisition
        run: |
          mkdir -p kaggle/flash-v3-inputs/ft09 kaggle/flash-v3-inputs/v2 kaggle/qckn-flash-multigame-v3-results
          gh run download 35387362885 -R heathsanchez/Minimal-Sufficient-Interface -n arc3-ft09-fatal-basin-certificate -D kaggle/flash-v3-inputs/ft09
          gh run download 35398347557 -R heathsanchez/Minimal-Sufficient-Interface -n arc3-global-flash-closure-v2 -D kaggle/flash-v3-inputs/v2
      - name: Flash restart contracts
        env:
          PYTHONPATH: kaggle/src
        run: python -m unittest discover -s kaggle/tests -p 'test_flash_compiler.py' -v
      - name: Run restart refutation compounding
        env:
          PYTHONPATH: kaggle/src
        run: |
          python -u kaggle/scripts/arc3_flash_multigame_v3.py             --ft09-dir kaggle/flash-v3-inputs/ft09             --v2-dir kaggle/flash-v3-inputs/v2             --out kaggle/qckn-flash-multigame-v3-results
      - name: Qualification
        run: |
          python - <<'PY'
          import json
          r=json.load(open('kaggle/qckn-flash-multigame-v3-results/restart-refutation.json'))
          assert r['verdict']=='PASS_RESTARTED_REFUTATION_COMPOUNDING'
          assert r['first_generation']['destination_verifier_calls']==1
          assert r['restart']['destination_verifier_calls_after_restart']==0
          assert r['restart']['blocked_after_restart']==8
          assert r['restart']['changed_scope_blocked'] is False
          assert r['ablation']['destination_verifier_calls_restored']==1
          assert r['stale_control']['destination_evidence_rejected'] is True
          print('QCKN_FLASH_MULTIGAME_V3_QUALIFIED=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-qckn-flash-multigame-v3
          path: |
            kaggle/qckn-flash-multigame-v3-results/
            kaggle/src/metalogic_arc3/flash_closure.py
            kaggle/tests/test_flash_compiler.py
            kaggle/scripts/arc3_flash_multigame_v3.py
          if-no-files-found: error
