name: synthesized policy program cross domain v9

on:
  push:
    branches: [settlement-frozen-controller-final-boss]
    paths:
      - 'experiments/synthesized_policy_program_cross_domain_v9.py'
      - '.github/workflows/synthesized-policy-program-cross-domain-v9.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run V9 synthesized policy program cross-domain test
        run: python experiments/synthesized_policy_program_cross_domain_v9.py
