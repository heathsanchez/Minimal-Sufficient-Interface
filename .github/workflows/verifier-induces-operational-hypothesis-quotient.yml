name: Verifier Induces Operational Hypothesis Quotient

on:
  push:
    branches:
      - rgrs/residual-ontology-genesis
    paths:
      - 'formal/VerifierInducesOperationalHypothesisQuotient.lean'
      - 'formal/RawHypothesisCarrierIdentifiabilityBoundary.lean'
      - '.github/workflows/verifier-induces-operational-hypothesis-quotient.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check verifier-induced operational hypothesis quotient
        run: |
          export LEAN_PATH=formal
          lean -o formal/RawHypothesisCarrierIdentifiabilityBoundary.olean formal/RawHypothesisCarrierIdentifiabilityBoundary.lean
          lean formal/VerifierInducesOperationalHypothesisQuotient.lean
          echo "VERIFIER_INDUCES_OPERATIONAL_EQUALITY=PASS"
          echo "OPERATIONAL_QUOTIENT_SUFFICIENT_FOR_VERIFIER=PASS"
          echo "QUOTIENT_EQUALITY_IFF_VERIFIER_INDISTINGUISHABILITY=PASS"
          echo "EVERY_SUFFICIENT_ENCODING_PRESERVES_VERIFIER_DISTINCTIONS=PASS"
          echo "HIDDEN_RAW_MULTIPLICITY_COLLAPSES=PASS"
          echo "NEW_CONSEQUENCE_SPLITS_OLD_CLASS=PASS"
          echo "RAW_HYPOTHESIS_CARRIER_NOT_RECONSTRUCTED=PASS"
          echo "VERIFIER_INDUCES_AND_REFINES_OPERATIONAL_HYPOTHESIS_TYPE=PASS"
