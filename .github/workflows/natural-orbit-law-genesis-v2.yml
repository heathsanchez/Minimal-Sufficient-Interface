name: natural orbit law genesis v2

on:
  push:
    branches: [natural-orbit-genesis-v1]
    paths:
      - 'experiments/natural_orbit_law_genesis_v2.py'
      - '.github/workflows/natural-orbit-law-genesis-v2.yml'
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run generic-alphabet natural-law gate
        run: python experiments/natural_orbit_law_genesis_v2.py
