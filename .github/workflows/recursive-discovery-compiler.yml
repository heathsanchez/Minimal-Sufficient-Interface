name: Recursive discovery compiler

on:
  push:
    branches:
      - recursive-discovery-compiler-v2-live-attachment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e677-bounded-recursive-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile recursive_discovery_compiler.py verified_join_reify.py developmental_operating_system.py developmental_os_causal_qualification.py developmental_process_tournament.py model_worker_backend.py e677_recursive_discovery_run.py e677_recursive_discovery_run_v5.py e677_verified_join_reify_run.py e677_developmental_os_run.py e677_live_frontier_attachment_probe.py four_row_total13_ablation.py column_symbol_cycle_probe.py partition_derangement_probe.py shifted_realizability_quotient_probe.py phase_invariant_derivation_probe.py phase_unary_theorem_certificate.py phase_cross_order_generalization_probe.py phase_pair_responsibility_probe.py phase_symbolic_theorem_certificate.py phase_block_feasibility_probe.py
      - name: Run causal process qualification
        run: python developmental_os_causal_qualification.py
      - name: Run matched outer process tournament
        run: python developmental_process_tournament.py
      - name: Run five-generation recursive discovery compiler
        run: python e677_recursive_discovery_run_v5.py
      - name: Replay compact prior structural certificate
        run: python four_row_total13_ablation.py
      - name: Verify cycle representation independently
        run: python column_symbol_cycle_probe.py
      - name: Enumerate exact partition-derangement frontier
        run: python partition_derangement_probe.py
      - name: Search quotient preserving shifted realizability
        run: python shifted_realizability_quotient_probe.py
      - name: Derive compact invariant from phase quotient
        run: python phase_invariant_derivation_probe.py
      - name: Independently certify irredundant unary phase theorem
        run: python phase_unary_theorem_certificate.py
      - name: Test unary phase law across orders 3 through 8
        run: python phase_cross_order_generalization_probe.py
      - name: Extract minimal row-pair cores for phase exclusions
        run: python phase_pair_responsibility_probe.py
      - name: Certify symbolic phase theorem
        run: python phase_symbolic_theorem_certificate.py
      - name: Derive local block feasibility from phase theorem
        run: python phase_block_feasibility_probe.py
      - name: Gate attachment to the live E677 T6 frontier
        run: python e677_live_frontier_attachment_probe.py
      - name: Run verified JOIN reify assembly with phase feedback
        run: python e677_verified_join_reify_run.py
      - name: Run cumulative developmental operating system
        run: python e677_developmental_os_run.py
      - name: Verify machine-readable state
        run: |
          python - <<'PY'
          import ast, json
          d=json.load(open('artifacts/e677_recursive_discovery_state.json'))
          assert len(d['generations']) == 5 and len(d['verified']) == 4 and len(d['low_leverage']) == 1 and len(d['rejected']) == 0
          p=json.load(open('artifacts/partition_derangement_probe.json'))
          assert p['shifted_saturated_states'] > 0 and len(p['shifted_profile_counts']) == 11
          for key in p['shifted_profile_counts']:
              v=ast.literal_eval(key); assert sum(v)==14; assert v[0]==v[5] and v[1]==v[4] and v[2]==v[3]
          q=json.load(open('artifacts/shifted_realizability_quotient_probe.json'))
          assert q['total_states']==p['total_saturated_states'] and q['shifted_states']==p['shifted_saturated_states'] and q['coarsest_tested_pure_quotient']=='phase'
          inv=json.load(open('artifacts/phase_invariant_derivation_probe.json'))
          assert inv['states']==q['total_states'] and inv['shifted']==q['shifted_states'] and inv['unary_false_positive_states']==0 and inv['unary_false_negative_states']==0
          thm=json.load(open('artifacts/phase_unary_theorem_certificate.json'))
          assert thm['total_states']==16146 and thm['shifted_states']==141 and thm['false_positives']==0 and thm['false_negatives']==0 and thm['unary_irredundant']
          gen=json.load(open('artifacts/phase_cross_order_generalization_probe.json'))
          assert gen['all_tested_exact'] and [x['n'] for x in gen['orders']] == [3,4,5,6,7,8]
          resp=json.load(open('artifacts/phase_pair_responsibility_probe.json'))
          assert resp['all_formula_matches'] and resp['all_symbolic_cores_stable_n6_to_n8']
          sym=json.load(open('artifacts/phase_symbolic_theorem_certificate.json'))
          assert sym['symbolic_complete_n_ge_4'] and all(x['match'] for x in sym['finite_replay_orders_3_to_8'].values())
          blk=json.load(open('artifacts/phase_block_feasibility_probe.json'))
          assert blk['reconstructs_entire_shifted_frontier'] and blk['legal_partition_derangement_states']==141
          attach=json.load(open('artifacts/e677_live_frontier_attachment_probe.json'))
          assert attach['attachment_status']=='MECHANISM_ONLY'
          assert attach['mechanism_attachment_verified'] and not attach['direct_theorem_attachment_verified']
          assert 'four_row_saturated_reconstruction' in attach['missing_source_assumptions_at_live_frontier']
          j=json.load(open('artifacts/e677_verified_join_reify_state.json'))
          assert len(j['candidates'])==3 and len(j['promoted'])==3
          o=json.load(open('artifacts/e677_developmental_os_state.json'))
          assert o['residual_type']=='DERIVATION'
          assert o['strongest_residual_provenance']['source']=='live-frontier-attachment'
          assert o['residual'].startswith('Derive or refute a seven-row T6 phase-labelled')
          actions=[x['id'] for x in o['action_queue']]
          assert 'act:derive' in actions and actions[0]=='act:derive' and not o['process_residuals']
          print('RECURSIVE_DISCOVERY_COMPILER_VERIFIED')
          print('DEVELOPMENTAL_OS_VERIFIED')
          print('STRONGEST_RESIDUAL_ROUTING_VERIFIED')
          print('LIVE_FRONTIER_ATTACHMENT=' + attach['attachment_status'])
          print('PHASE_SYMBOLIC_N_GE_4=' + str(sym['symbolic_complete_n_ge_4']))
          print('PHASE_LOCAL_RECONSTRUCTION=' + str(blk['legal_partition_derangement_states']))
          print('ATTACHMENT_RESIDUAL=' + attach['residual'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e677-recursive-discovery-state-v2
          path: |
            artifacts/e677_recursive_discovery_state.json
            artifacts/e677_verified_join_reify_state.json
            artifacts/e677_developmental_os_state.json
            artifacts/e677_live_frontier_attachment_probe.json
            artifacts/four_row_total13_ablation.json
            artifacts/column_symbol_cycle_probe.json
            artifacts/partition_derangement_probe.json
            artifacts/shifted_realizability_quotient_probe.json
            artifacts/phase_invariant_derivation_probe.json
            artifacts/phase_unary_theorem_certificate.json
            artifacts/phase_cross_order_generalization_probe.json
            artifacts/phase_pair_responsibility_probe.json
            artifacts/phase_symbolic_theorem_certificate.json
            artifacts/phase_block_feasibility_probe.json
