name: Recursive discovery compiler

on:
  push:
    branches:
      - recursive-discovery-compiler-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e677-bounded-recursive-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite verifier
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.3.0
      - name: Compile Python sources
        run: python -m py_compile recursive_discovery_compiler.py model_worker_backend.py e677_recursive_discovery_run.py four_row_total13_ablation.py shifted_profile_orientation_probe.py shifted_orientation_core_probe.py column_symbol_cycle_probe.py
      - name: Run four-generation recursive discovery compiler
        run: python e677_recursive_discovery_run.py
      - name: Replay compact prior structural certificate
        run: python four_row_total13_ablation.py
      - name: Test saturated-profile residual against shifted constraints
        run: python shifted_profile_orientation_probe.py
      - name: Find minimal shifted-family UNSAT cores
        run: python shifted_orientation_core_probe.py
      - name: Verify column-symbol cycle representation
        run: python column_symbol_cycle_probe.py
      - name: Verify machine-readable state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/e677_recursive_discovery_state.json'))
          assert len(d['generations']) == 4
          assert len(d['verified']) == 3
          assert len(d['low_leverage']) == 1
          s=json.load(open('artifacts/shifted_profile_orientation_probe.json'))
          counts={k:v['sat_count'] for k,v in s['types'].items()}
          assert counts == {'3-2-2':1,'4-3-0':4,'5-2-0':3,'7-0-0':3}
          c=json.load(open('artifacts/shifted_orientation_core_probe.json'))
          assert all(row['minimal_unsat_cores'] for rows in c['results'].values() for row in rows)
          r=json.load(open('artifacts/column_symbol_cycle_probe.json'))
          assert all(r['derived'].values())
          assert {k:v['count'] for k,v in r['profiles'].items()} == {'7-0-0':4,'5-2-0':2,'4-3-0':2,'3-2-2':1}
          print('RECURSIVE_DISCOVERY_COMPILER_VERIFIED')
          print('state_sha256=' + d['state_sha256'])
          print('shifted_profile_sat_counts=' + str(counts))
          print('COLUMN_SYMBOL_CYCLE_REPRESENTATION_VERIFIED')
          print('cycle_signature_counts=' + str({k:v['count'] for k,v in r['profiles'].items()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e677-recursive-discovery-state
          path: |
            artifacts/e677_recursive_discovery_state.json
            artifacts/four_row_total13_ablation.json
            artifacts/shifted_profile_orientation_probe.json
            artifacts/shifted_orientation_core_probe.json
            artifacts/column_symbol_cycle_probe.json
