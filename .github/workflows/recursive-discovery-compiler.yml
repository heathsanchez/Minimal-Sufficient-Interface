name: Recursive discovery compiler

on:
  push:
    branches:
      - recursive-discovery-compiler-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e677-bounded-recursive-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite verifier
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.3.0
      - name: Compile Python sources
        run: python -m py_compile recursive_discovery_compiler.py model_worker_backend.py e677_recursive_discovery_run.py four_row_local_probe.py four_row_total13_ablation.py
      - name: Run three-generation recursive discovery compiler
        run: python e677_recursive_discovery_run.py
      - name: Independently replay four-row SAT residual
        run: python four_row_local_probe.py
      - name: Independently replay total-13 causal certificate
        run: python four_row_total13_ablation.py
      - name: Verify machine-readable state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/e677_recursive_discovery_state.json'))
          assert len(d['generations']) == 3
          assert len(d['verified']) == 2
          assert len(d['low_leverage']) == 1
          assert len(d['rejected']) == 0
          assert d['residuals'][-1].startswith('Classify the full six-edge four-row agreement profile')
          p=json.load(open('artifacts/four_row_local_probe.json'))
          assert p['upper_bound_14_proved_unsat'] is True
          assert p['min_total_pair_agreement'] == 0
          assert p['max_total_pair_agreement'] == 14
          assert p['missing_totals_0_to_14'] == [13]
          assert p['total13_unsat_primary'] is True
          assert p['total13_unsat_independent_encoding'] is True
          a=json.load(open('artifacts/four_row_total13_ablation.json'))
          assert a['proof_certificate']['contradiction'] is True
          assert a['shifted_constraints_used_in_proof'] is False
          assert a['no_triple_used_in_proof'] is True
          checks=a['witness_without_no_triple']['checks']
          assert checks == {
              'all_rows_permutations': True,
              'no_triple': False,
              'shifted_disagreement': True,
              'total_pair_agreement': 13,
          }
          print('RECURSIVE_DISCOVERY_COMPILER_VERIFIED')
          print('state_sha256=' + d['state_sha256'])
          print('compiled_generations=' + str(len(d['generations'])))
          print('four_row_missing_totals=' + str(p['missing_totals_0_to_14']))
          print('TOTAL13_EXCLUSION_REPRODUCED')
          print('SHIFTED_ABLATED_FROM_TOTAL13_PROOF')
          print('NO_TRIPLE_NECESSITY_WITNESS_VERIFIED')
          print('next_residual=' + d['residuals'][-1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e677-recursive-discovery-state
          path: |
            artifacts/e677_recursive_discovery_state.json
            artifacts/four_row_local_probe.json
            artifacts/four_row_total13_ablation.json
