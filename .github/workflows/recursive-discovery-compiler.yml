name: Recursive discovery compiler

on:
  push:
    branches:
      - recursive-discovery-compiler-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e677-bounded-recursive-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite verifier
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.3.0
      - name: Compile Python sources
        run: python -m py_compile recursive_discovery_compiler.py model_worker_backend.py e677_recursive_discovery_run.py four_row_local_probe.py
      - name: Replay verified recursive discovery compiler
        run: python e677_recursive_discovery_run.py
      - name: Run next blind four-row residual probe
        run: python four_row_local_probe.py
      - name: Verify machine-readable state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/e677_recursive_discovery_state.json'))
          assert len(d['generations']) == 2
          assert len(d['verified']) == 1
          assert len(d['low_leverage']) == 1
          assert len(d['rejected']) == 0
          assert d['residuals'][-1].startswith('Classify four-row weighted agreement graphs')
          p=json.load(open('artifacts/four_row_local_probe.json'))
          assert p['upper_bound_14_proved_unsat'] is True
          assert p['max_total_pair_agreement'] <= 14
          print('RECURSIVE_DISCOVERY_COMPILER_VERIFIED')
          print('state_sha256=' + d['state_sha256'])
          print('four_row_min_total=' + str(p['min_total_pair_agreement']))
          print('four_row_max_total=' + str(p['max_total_pair_agreement']))
          print('four_row_attainable_totals=' + str(p['attainable_totals_0_to_14']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e677-recursive-discovery-state
          path: |
            artifacts/e677_recursive_discovery_state.json
            artifacts/four_row_local_probe.json
