name: Verified Boundary Completion Kernel

on:
  push:
    branches: [purify-developmental-kernel-v1]
    paths:
      - 'formal/VerifiedBoundaryCompletionKernel.lean'
      - 'formal/FailureForcesIdentityCompletion.lean'
      - 'formal/FailureForcesCompositionCompletion.lean'
      - 'formal/IdentityForcedAsMinimalCompletion.lean'
      - '.github/workflows/verified-boundary-completion-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependency certificates
        env:
          LEAN_PATH: formal
        run: |
          lean -o formal/IdentityForcedAsMinimalCompletion.olean formal/IdentityForcedAsMinimalCompletion.lean
          lean -o formal/FailureForcesIdentityCompletion.olean formal/FailureForcesIdentityCompletion.lean
          lean -o formal/FailureForcesCompositionCompletion.olean formal/FailureForcesCompositionCompletion.lean
      - name: Check purified boundary completion kernel
        env:
          LEAN_PATH: formal
        run: |
          lean formal/VerifiedBoundaryCompletionKernel.lean
          echo "SEMANTIC_REPAIR_LABEL_REMOVED=PASS"
          echo "IDENTITY_COMPILES_TO_ENDPOINT_OBLIGATION=PASS"
          echo "COMPOSITION_COMPILES_TO_ENDPOINT_OBLIGATION=PASS"
          echo "GENERIC_FILLER_GENUINELY_NEW=PASS"
          echo "NO_UNRELATED_TRANSPORT_ADDED=PASS"
          echo "RESIDUAL_ABLATION_BLOCKS_FILLER=PASS"
          echo "GENERIC_COMPLETION_UNIVERSAL=PASS"
          echo "PURIFICATION_CYCLE_1=PASS"
