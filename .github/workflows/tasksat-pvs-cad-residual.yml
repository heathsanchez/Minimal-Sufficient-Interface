name: TaskSAT PVS CAD Residual

on:
  workflow_dispatch:
  push:
    branches:
      - tasksat-pvs-cad-residual-v1
    paths:
      - "experiments/tasksat_semantic_residual_cad.pvs"
      - "experiments/tasksat_semantic_residual_cad.cmds"
      - ".github/workflows/tasksat-pvs-cad-residual.yml"

permissions:
  contents: read

jobs:
  residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out audit repo
        uses: actions/checkout@v4

      - name: Check out verified pvs_cad
        uses: actions/checkout@v4
        with:
          repository: j-tanner-slagel/pvs_cad
          ref: 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          path: vendor/pvs_cad

      - name: Check out pinned NASALib
        uses: actions/checkout@v4
        with:
          repository: nasa/pvslib
          ref: e426f69dc2680ad575491f93c5a51739ec8b25fa
          path: vendor/pvslib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PVS 8.1.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pvs-dist
          curl -L --fail --retry 3 https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz -o "$RUNNER_TEMP/pvs.tgz"
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  $RUNNER_TEMP/pvs.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pvs.tgz" -C vendor/pvs-dist
          PVS_BIN=$(find "$GITHUB_WORKSPACE/vendor/pvs-dist" -type f -name pvs -perm -u+x | head -1)
          test -n "$PVS_BIN"
          PVS_DIR=$(dirname "$PVS_BIN")
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          "$PVS_BIN" -raw -version

      - name: Install residual theory
        run: |
          cp experiments/tasksat_semantic_residual_cad.pvs vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_residual_cad.cmds vendor/pvs_cad/cad/

      - name: Configure pvs_cad
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_residual_scratch
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/setup.sh

      - name: Start warm PVS server
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_residual_scratch
          PVS_PORT: "23457"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/cli/srv.sh tasksat_semantic_residual_cad

      - name: Prove the two residual implications
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_residual_scratch
          PVS_PORT: "23457"
          PC_TIMEOUT: "240"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          mkdir -p results
          bash vendor/pvs_cad/tools/cliprove.sh "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_residual_cad.pvs" tasksat_semantic_residual_cad "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_residual_cad.cmds" | tee results/tasksat_pvs_cad_residual.txt
          test "$(grep -c ' QED$' results/tasksat_pvs_cad_residual.txt)" -eq 2

      - name: Upload residual evidence
        uses: actions/upload-artifact@v4
        with:
          name: tasksat-pvs-cad-residual
          path: results/tasksat_pvs_cad_residual.txt
          if-no-files-found: error
