name: Minimum Calculus Self Audit

on:
  push:
    branches:
      - minimum-calculus-self-audit
      - minimum-calculus-tournament
      - constitutional-failed-factorization
    paths:
      - 'minimum_calculus_self_audit.py'
      - 'self_attack_synthesis.py'
      - 'calculus_tournament.py'
      - 'calculus_compounding_tournament.py'
      - 'sequential_motif_tournament.py'
      - 'tests/test_minimum_calculus_self_audit.py'
      - 'tests/test_self_attack_synthesis.py'
      - 'tests/test_calculus_tournament.py'
      - 'tests/test_calculus_compounding_tournament.py'
      - 'tests/test_sequential_motif_tournament.py'
      - '.github/workflows/minimum-calculus-self-audit.yml'
  workflow_dispatch:

jobs:
  self-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executable self-audit
        run: python -m unittest tests.test_minimum_calculus_self_audit -v
      - name: Generated adversarial self-attack synthesis
        run: python -m unittest tests.test_self_attack_synthesis -v
      - name: Exact 32-calculus tournament
        run: |
          python -m unittest tests.test_calculus_tournament -v
          python calculus_tournament.py
      - name: Exact COMPOUND tournament
        run: |
          python -m unittest tests.test_calculus_compounding_tournament -v
          python calculus_compounding_tournament.py
      - name: Sequential motif tournament
        run: |
          python -m unittest tests.test_sequential_motif_tournament -v
          python sequential_motif_tournament.py
