name: ARC3 consequence selection experiment
on:
  push:
    branches: [experiment/arc3-consequence-selection-v1]
    paths:
      - 'experiments/arc3_consequence/consequence_selection.py'
      - 'experiments/arc3_consequence/run_selection.py'
      - 'tests/test_consequence_selection.py'
      - '.github/workflows/arc3-consequence-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install arc-agi==0.9.9
      - name: Test consequence discovery and rejection
        run: |
          python -m unittest discover -s tests -p test_consequence_selection.py -v
          echo 'CONSEQUENCE_SELECTION_TESTS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Run matched cold and developed controllers on official offline game
        run: |
          python experiments/arc3_consequence/run_selection.py \
            --game bt11-fd9df0622a1a \
            --environments-dir upstream-arc-agi/test_environment_files \
            --max-actions 120 --output arc3-consequence-selection.json
          echo 'ARC3_CONSEQUENCE_SELECTION_OFFLINE=COMPLETED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-consequence-selection
          path: arc3-consequence-selection.json
          if-no-files-found: ignore
