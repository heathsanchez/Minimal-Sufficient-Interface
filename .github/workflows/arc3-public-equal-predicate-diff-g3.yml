name: ARC3 Public Equal Predicate Diff G3

on:
  workflow_dispatch:
  push:
    branches: [arc3-public-equal-predicate-diff-g3]
    paths:
      - 'experiments/arc3_public_equal_predicate_diff_g3.py'
      - '.github/workflows/arc3-public-equal-predicate-diff-g3.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: vendor/duck-harness
      - name: Install Duck
        working-directory: vendor/duck-harness/ARC3-Inference
        run: uv sync --locked --python "$(command -v python)"
      - name: Download exact public game
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENV_DIR: ${{ github.workspace }}/public-env
          GAME_ID: tn36-ef4dde99
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from arc_agi import Arcade, OperationMode
          root=Path(os.environ["ENV_DIR"]);root.mkdir(parents=True,exist_ok=True)
          arcade=Arcade(operation_mode=OperationMode.NORMAL,environments_dir=str(root))
          env=arcade.make(os.environ["GAME_ID"])
          if env is None: raise SystemExit("public game unavailable")
          print("PUBLIC_GAME_DOWNLOAD=PASS",env.environment_info.game_id)
          arcade.close_scorecard()
          PY
      - name: Localize omitted visible distinction
        working-directory: vendor/duck-harness/ARC3-Inference
        env:
          ENVROOT: ${{ github.workspace }}/public-env
          OUTDIR: ${{ github.workspace }}/evidence/arc3-public-equal-predicate-diff-g3
        run: |
          uv run python "$GITHUB_WORKSPACE/experiments/arc3_public_equal_predicate_diff_g3.py" \
            | tee "$GITHUB_WORKSPACE/arc3-public-equal-predicate-diff-g3.log"
          grep -E 'ARC3_PUBLIC_EQUAL_PREDICATE_DIFF_G3=DIAGNOSTIC' "$GITHUB_WORKSPACE/arc3-public-equal-predicate-diff-g3.log"
      - name: Seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/arc3-public-equal-predicate-diff-g3/result.json").read_text())
          assert d["model_calls"]==0 and d["source_inspection"] is False
          assert len(d["pairs"])==3
          assert all(x["source_predicate"] for x in d["pairs"])
          print("ARC3_PUBLIC_EQUAL_PREDICATE_DIFF_G3_SEAL=PASS")
          print("PAIRS=",[(x["pair"],x["source_predicate"],x["target_panel_equal"],x["changed_pixels"],x["color_transitions"],x["component_boxes"][:4]) for x in d["pairs"]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-equal-predicate-diff-g3
          path: |
            evidence/arc3-public-equal-predicate-diff-g3/result.json
            arc3-public-equal-predicate-diff-g3.log
          if-no-files-found: error
