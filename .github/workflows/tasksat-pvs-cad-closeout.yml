name: TaskSAT PVS CAD Closeout

on:
  workflow_dispatch:
  push:
    branches:
      - tasksat-pvs-cad-closeout-v1
    paths:
      - "experiments/tasksat_semantic_drift_cad.pvs"
      - "experiments/tasksat_semantic_drift_cad_closeout.cmds"
      - "experiments/tasksat_semantic_residual_cad.pvs"
      - "experiments/tasksat_semantic_residual_cad.cmds"
      - "experiments/tasksat_semantic_closeout_cad.pvs"
      - "experiments/tasksat_semantic_closeout_cad.cmds"
      - "experiments/tasksat_range_bounds_contract_audit.py"
      - "experiments/tasksat_rate_range_contract.py"
      - "experiments/tasksat_contract_compliant_assignment_audit.py"
      - "experiments/tasksat_bounds_assignment_repair.py"
      - "TASKSAT_PVS_CAD_CLOSEOUT.md"
      - ".github/workflows/tasksat-pvs-cad-closeout.yml"

permissions:
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4

      - name: Check out verified pvs_cad
        uses: actions/checkout@v4
        with:
          repository: j-tanner-slagel/pvs_cad
          ref: 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          path: vendor/pvs_cad

      - name: Check out pinned NASALib
        uses: actions/checkout@v4
        with:
          repository: nasa/pvslib
          ref: e426f69dc2680ad575491f93c5a51739ec8b25fa
          path: vendor/pvslib

      - name: Check out pinned TaskSAT
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/tasksat
          ref: f9d6063b45967a3fea578c47f54806aadaafe1b0
          path: vendor/tasksat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PVS 8.1.2 x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pvs-dist
          curl -L --fail --retry 3 https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz -o "$RUNNER_TEMP/pvs.tgz"
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  $RUNNER_TEMP/pvs.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pvs.tgz" -C vendor/pvs-dist
          PVS_BIN=$(find "$GITHUB_WORKSPACE/vendor/pvs-dist" -type f -name pvs -perm -u+x | head -1)
          test -n "$PVS_BIN"
          PVS_DIR=$(dirname "$PVS_BIN")
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          "$PVS_BIN" -raw -version

      - name: Install pinned TaskSAT
        run: python -m pip install -e vendor/tasksat

      - name: Reproduce missing containment check
        run: >-
          python experiments/tasksat_range_bounds_contract_audit.py vendor/tasksat
          --out results/tasksat_range_bounds_contract_audit.json

      - name: Reproduce rate-interval documentation divergence
        run: >-
          python experiments/tasksat_rate_range_contract.py vendor/tasksat
          --out results/tasksat_rate_range_contract.json

      - name: Reproduce contract-compliant assignment divergence
        run: >-
          python experiments/tasksat_contract_compliant_assignment_audit.py vendor/tasksat
          --expect unsat
          --out results/tasksat_contract_witness_before_repair.json

      - name: Apply candidate re-clamp repair
        run: >-
          python experiments/tasksat_bounds_assignment_repair.py vendor/tasksat
          --out results/tasksat_reclamp_repair.json

      - name: Verify contract-compliant witness after repair
        run: >-
          python experiments/tasksat_contract_compliant_assignment_audit.py vendor/tasksat
          --expect sat
          --out results/tasksat_contract_witness_after_repair.json

      - name: Preserve upstream numeric-assignment regression after repair
        working-directory: vendor/tasksat
        env:
          PYTHONPATH: src/smt
        run: >-
          python -m pytest -q
          tests/test_verifier1.py::TestVerifier::test_tasknet12_assign_numeric

      - name: Install PVS closeout theories
        run: |
          cp experiments/tasksat_semantic_drift_cad.pvs vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_drift_cad_closeout.cmds vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_residual_cad.pvs vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_residual_cad.cmds vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_closeout_cad.pvs vendor/pvs_cad/cad/
          cp experiments/tasksat_semantic_closeout_cad.cmds vendor/pvs_cad/cad/

      - name: Configure verified CAD environment
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_closeout_scratch
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/setup.sh

      - name: Start one warm PVS server
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_closeout_scratch
          PVS_PORT: "23458"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/cli/srv.sh tasksat_semantic_drift_cad
          vendor/pvs_cad/tools/pvscli.sh --typecheck tasksat_semantic_residual_cad.pvs | tail -5
          vendor/pvs_cad/tools/pvscli.sh --typecheck tasksat_semantic_closeout_cad.pvs | tail -5

      - name: Reprove seven established CAD obligations
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_closeout_scratch
          PVS_PORT: "23458"
          PC_TIMEOUT: "180"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/cliprove.sh "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_drift_cad.pvs" tasksat_semantic_drift_cad "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_drift_cad_closeout.cmds" | tee results/tasksat_cad_core7.txt
          test "$(grep -c ' QED$' results/tasksat_cad_core7.txt)" -eq 7

      - name: Reprove two minimized residual implications
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_closeout_scratch
          PVS_PORT: "23458"
          PC_TIMEOUT: "180"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/cliprove.sh "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_residual_cad.pvs" tasksat_semantic_residual_cad "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_residual_cad.cmds" | tee results/tasksat_cad_residual2.txt
          test "$(grep -c ' QED$' results/tasksat_cad_residual2.txt)" -eq 2

      - name: Prove exact-case exhaustion
        shell: bash
        env:
          CAD_ROOT: ${{ github.workspace }}/vendor/pvs_cad
          CAD_LIB_DIR: ${{ github.workspace }}/vendor/pvs_cad/cad
          NASALIB: ${{ github.workspace }}/vendor/pvslib
          SCRATCH: ${{ runner.temp }}/cad_closeout_scratch
          PVS_PORT: "23458"
          PC_TIMEOUT: "180"
        run: |
          set -euo pipefail
          export PATH="$PVS_DIR:$PATH"
          export PVS="$PVS_DIR/pvs"
          export PROVEIT="$PVS_DIR/proveit"
          export PVS_LIBRARY_PATH="$NASALIB"
          bash vendor/pvs_cad/tools/cliprove.sh "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_closeout_cad.pvs" tasksat_semantic_closeout_cad "$GITHUB_WORKSPACE/vendor/pvs_cad/cad/tasksat_semantic_closeout_cad.cmds" | tee results/tasksat_cad_case1.txt
          test "$(grep -c ' QED$' results/tasksat_cad_case1.txt)" -eq 1

      - name: Seal closeout manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TASKSAT_PVS_CAD_CLOSEOUT=WARRANTED"
            echo "TaskSAT=f9d6063b45967a3fea578c47f54806aadaafe1b0"
            echo "pvs_cad=8750362e99c2ba0e9a0307dcaa39b9766c562feb"
            echo "NASALib=e426f69dc2680ad575491f93c5a51739ec8b25fa"
            echo "PVS=pvs8.1.2"
            echo "PVS_asset_sha256=5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b"
            echo "CAD_QED_COUNT=10"
            echo "containment_check=WARRANTED_MISSING_CONTAINMENT_CHECK"
            echo "rate_interval=WARRANTED_RATE_INTERVAL_DOCUMENTATION_IMPLEMENTATION_DIVERGENCE"
            echo "contract_assignment_before_repair=UNSAT"
            echo "contract_assignment_after_repair=SAT"
            echo
            cat results/tasksat_cad_core7.txt
            cat results/tasksat_cad_residual2.txt
            cat results/tasksat_cad_case1.txt
          } > results/tasksat_pvs_cad_closeout_manifest.txt
          test "$(grep -c ' QED$' results/tasksat_pvs_cad_closeout_manifest.txt)" -eq 10

      - name: Upload sealed closeout evidence
        uses: actions/upload-artifact@v4
        with:
          name: tasksat-pvs-cad-closeout
          path: |
            results/tasksat_pvs_cad_closeout_manifest.txt
            results/tasksat_cad_core7.txt
            results/tasksat_cad_residual2.txt
            results/tasksat_cad_case1.txt
            results/tasksat_range_bounds_contract_audit.json
            results/tasksat_rate_range_contract.json
            results/tasksat_contract_witness_before_repair.json
            results/tasksat_contract_witness_after_repair.json
            results/tasksat_reclamp_repair.json
          if-no-files-found: error
