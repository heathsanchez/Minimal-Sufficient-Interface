name: Recursive Obligation Genesis

on:
  push:
    branches:
      - recursive-discovery-compiler-v1
    paths:
      - 'lean/LemmaSynthesis/RecursiveObligationGenesis.lean'
      - '.github/workflows/recursive-obligation-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check recursive obligation genesis
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/RecursiveObligationGenesis.lean
