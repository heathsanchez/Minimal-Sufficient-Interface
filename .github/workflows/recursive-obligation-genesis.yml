name: Recursive Obligation Genesis

on:
  push:
    branches:
      - recursive-discovery-compiler-v1
    paths:
      - 'lean/LemmaSynthesis/RecursiveObligationGenesis.lean'
      - 'experiments/mathgraph/recursive_obligation_synthesis.py'
      - '.github/workflows/recursive-obligation-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Blindly synthesize recursive obligations
        run: python experiments/mathgraph/recursive_obligation_synthesis.py
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check recursive obligation theorems
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/RecursiveObligationGenesis.lean
