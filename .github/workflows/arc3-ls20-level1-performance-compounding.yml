name: ARC3 ls20 Level-1 performance compounding
on:
  push:
    branches: [arc3-ls20-level1-performance-compounding-v1]
    paths:
      - 'kaggle/**'
      - '.github/workflows/arc3-ls20-level1-performance-compounding.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arc3-ls20-level1-performance-compounding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  level-compounding:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARC_API_KEY: ''
      OPERATION_MODE: ''
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify exact frozen MG-ARC5
        run: |
          mkdir -p kaggle/ls20-level1-performance-compounding-results
          python kaggle/scripts/build_agent.py --output kaggle/ls20-level1-performance-compounding-results/agent.py
          echo 'd9f0b95dfee14613425e8f557808e129b25e8a055ad481800b1024ce45281ead  kaggle/ls20-level1-performance-compounding-results/agent.py' | sha256sum --check
          python -m py_compile kaggle/scripts/ls20_level1_performance_compounding.py
      - name: Install pinned SDK
        run: |
          python -m pip install arc-agi==0.9.9 arcengine==0.9.3 python-dotenv
          python -m pip freeze > kaggle/ls20-level1-performance-compounding-results/requirements-resolved.txt
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-3-Agents
          ref: 4743e7d0aaae0ded0d98a89a7e282e63564cd58b
          path: kaggle/vendor/ARC-AGI-3-Agents
      - run: python kaggle/scripts/slim_framework.py
      - name: Prepare exact ls20 world
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import sys
          sys.path.insert(0, 'kaggle/scripts')
          import benchmark_audit as a
          a.AGENT = a.Path('kaggle/ls20-level1-performance-compounding-results/agent.py')
          a.prepare(SimpleNamespace(
              fixtures=False,
              games='ls20',
              environments_dir='kaggle/ls20-level1-performance-compounding-results/envs',
              manifest='kaggle/ls20-level1-performance-compounding-results/public.json',
              max_actions=400,
          ))
          PY
      - name: Download and verify augmented dynamic ledger
        run: |
          gh api /repos/heathsanchez/Minimal-Sufficient-Interface/actions/artifacts/10560271684/zip > /tmp/dynamic.zip
          echo '3b94865a5cf69cebf138a23f360411b4113ac97937540fc11cad980256481056  /tmp/dynamic.zip' | sha256sum --check
          mkdir -p /tmp/dynamic
          unzip -q /tmp/dynamic.zip -d /tmp/dynamic
          cp /tmp/dynamic/ls20-dynamic-ledger-performance-results/augmented-exact-replay-ledger.json kaggle/ls20-level1-performance-compounding-results/augmented-exact-replay-ledger.json
      - name: Compile highest level, explore beyond it, retain and recompile
        run: python -u kaggle/scripts/ls20_level1_performance_compounding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-ls20-level1-performance-compounding
          path: |
            kaggle/ls20-level1-performance-compounding-results/
            kaggle/scripts/ls20_level1_performance_compounding.py
          if-no-files-found: warn
