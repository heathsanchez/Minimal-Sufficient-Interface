name: Capability Generated Future Interface

on:
  push:
    branches:
      - purify-developmental-kernel-v1
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete proofs
        run: |
          if grep -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' formal/CapabilityGeneratedFutureInterface.lean; then
            echo "INCOMPLETE_PROOF_FOUND"
            exit 1
          fi
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependencies
        env:
          LEAN_PATH: formal
        run: |
          lean -o formal/IdentityForcedAsMinimalCompletion.olean formal/IdentityForcedAsMinimalCompletion.lean
          lean -o formal/FailureForcesIdentityCompletion.olean formal/FailureForcesIdentityCompletion.lean
          lean -o formal/FailureForcesCompositionCompletion.olean formal/FailureForcesCompositionCompletion.lean
          lean -o formal/GenericVerifiedCompletionKernel.olean formal/GenericVerifiedCompletionKernel.lean
          lean -o formal/RequirementLandscapeCompletion.olean formal/RequirementLandscapeCompletion.lean
          lean -o formal/ConsequentialCompletionCoupling.olean formal/ConsequentialCompletionCoupling.lean
      - name: Check capability-generated future interface
        env:
          LEAN_PATH: formal
        run: |
          lean formal/CapabilityGeneratedFutureInterface.lean
          echo "CANONICAL_FUTURE_INTERFACE_DERIVED_FROM_CAPABILITY=PASS"
          echo "OLD_GENERATED_FUTURES_EMBED=PASS"
          echo "RESIDUAL_GENERATES_GENUINELY_NEW_FUTURE=PASS"
          echo "REQUIREMENT_ABLATION_REMOVES_GENERATED_FUTURE=PASS"
          echo "GENERATED_FUTURE_CAN_REFINE_IDENTITY=PASS"
          echo "NO_SUPPLIED_FUTURE_NAMING_MAP=PASS"
          echo "NO_SORRY_OR_ADMIT=PASS"
          echo "CYCLE_14_FRONTIER_STEP_1=PASS"
