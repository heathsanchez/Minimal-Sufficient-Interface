name: ARC3 action classes
on:
  push:
    branches: [experiment/arc3-unrestricted-prefix-search-v1]
    paths: [.github/workflows/arc3-action-classes.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install arc-agi==0.9.9
      - uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI
          ref: f12822c4d550121c35a275008d964afbbed47d2f
          path: upstream-arc-agi
      - name: Compare reduced and full search
        run: |
          python experiments/arc3_consequence/run_action_classes.py \
            --game bt33-a7c3f9d18b4e \
            --environments-dir upstream-arc-agi/test_environment_files \
            --evidence experiments/arc3_consequence/checkpoint_action_classes.json \
            --max-actions 120 --max-episodes 2048 --max-depth 32 \
            --max-training-actions 20000 --max-levels 5 \
            --output arc3-action-classes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-action-classes
          path: arc3-action-classes.json
          if-no-files-found: warn
