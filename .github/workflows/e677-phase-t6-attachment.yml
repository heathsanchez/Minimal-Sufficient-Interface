name: E677 phase T6 attachment

on:
  push:
    branches:
      - recursive-discovery-compiler-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-t6-four-row:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile attachment sources
        run: python -m py_compile partition_derangement_probe.py phase_141_orbit_certificate.py phase_T6_four_row_attachment_probe.py
      - name: Run source-backed T6 four-row attachment
        run: python phase_T6_four_row_attachment_probe.py
      - name: Verify attachment scope and result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/phase_T6_four_row_attachment_probe.json'))
          assert x['baseline_phase_states']==141
          assert x['surviving_phase_states'] + x['rejected_phase_states'] == 141
          assert x['contraction'] == x['rejected_phase_states']
          assert len(x['partition_orbit_breakdown'])==13
          assert x['A_domain']=='all 720 permutations of Z7 fixing 0'
          assert x['canonical_D']==['0125634','0145236','1023546','1024356']
          assert x['rows_tested']==[0,1,2,3]
          assert x['full_seven_row_core_claimed'] is False
          assert x['e677_implication_solved_claimed'] is False
          print('T6_FOUR_ROW_BASELINE=' + str(x['baseline_phase_states']))
          print('T6_FOUR_ROW_SURVIVORS=' + str(x['surviving_phase_states']))
          print('T6_FOUR_ROW_REJECTED=' + str(x['rejected_phase_states']))
          print('T6_FOUR_ROW_CONTRACTION=' + str(x['contraction']))
          print('T6_FOUR_ROW_ORBITS_KILLED=' + str(x['partition_orbits_fully_killed']))
          print('T6_FOUR_ROW_RESIDUAL=' + x['residual'])
          print('T6_FOUR_ROW_ATTACHMENT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e677-phase-t6-four-row-attachment
          path: artifacts/phase_T6_four_row_attachment_probe.json
