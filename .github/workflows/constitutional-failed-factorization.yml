name: Constitutional Failed Factorization

on:
  push:
    branches:
      - constitutional-failed-factorization
    paths:
      - 'lean/ConstitutionalFailedFactorization.lean'
      - 'lean-toolchain'
      - '.github/workflows/constitutional-failed-factorization.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: lean --version
      - name: Check constitutional theorems
        working-directory: lean
        run: lean ConstitutionalFailedFactorization.lean
