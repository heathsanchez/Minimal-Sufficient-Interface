name: Constitutional Failed Factorization

on:
  push:
    branches:
      - constitutional-failed-factorization
    paths:
      - 'lean/ConstitutionalFailedFactorization.lean'
      - 'lean/ConstitutionalRealizationAndRecursion.lean'
      - 'tests/test_constitutional_realization_census.py'
      - 'tests/test_constitutional_attacks.py'
      - 'lean-toolchain'
      - '.github/workflows/constitutional-failed-factorization.yml'
  workflow_dispatch:

jobs:
  constitutional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive constitutional realization census
        run: python -m unittest tests.test_constitutional_realization_census -v
      - name: Five constitutional adversarial attacks
        run: python -m unittest tests.test_constitutional_attacks -v
      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: lean --version
      - name: Compile constitutional theorems
        working-directory: lean
        run: lean -o ConstitutionalFailedFactorization.olean ConstitutionalFailedFactorization.lean
      - name: Check realization and higher-order recursion theorems
        working-directory: lean
        env:
          LEAN_PATH: .
        run: lean ConstitutionalRealizationAndRecursion.lean
