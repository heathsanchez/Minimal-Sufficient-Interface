name: Recoverability Model Genesis

on:
  push:
    branches:
      - experiment/recoverability-model-genesis
  pull_request:
    paths:
      - 'lean/LemmaSynthesis/RecoverabilityModelGenesis.lean'
      - '.github/workflows/recoverability-model-genesis.yml'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check recoverability-driven recursive genesis
        env:
          LEAN_PATH: lean
        run: lean lean/LemmaSynthesis/RecoverabilityModelGenesis.lean
